<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApplyDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   APPLYDESK V2 - DESIGN TOKENS (WARM PALETTE FROM FIGMA)
═══════════════════════════════════════════════════════════════ */
:root{
  --bg-primary: #FFF8F0;
  --bg-card: #FFFFFF;
  --bg-secondary: #FFF1EC;
  --color-primary: #FF6B47;
  --color-primary-hover: #E5502D;
  --color-secondary: #0F7871;
  --color-secondary-hover: #0A5854;
  --color-success: #7CB342;
  --color-warning: #FFC53D;
  --color-danger: #C9264A;
  --color-info: #2E7CE0;
  --text-heading: #1A1F2E;
  --text-body: #5A6478;
  --text-muted: #8B94A6;
  --bg-success-light: #EFF5DA;
  --bg-teal-light: #E6F2F1;
  --bg-warning-light: #FFF3D0;
  --bg-coral-light: #FFE4DA;
  --bg-danger-light: #FDE7EC;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-heading: 'Inter', system-ui, sans-serif;
  --font-body: 'Geist', 'Inter', system-ui, sans-serif;
  --sidebar-w: 240px;
  --topbar-h: 72px;
  --shadow-sm: 0 1px 2px rgba(26,31,46,0.04);
  --shadow-md: 0 4px 12px rgba(26,31,46,0.06);
  --shadow-lg: 0 8px 32px rgba(26,31,46,0.08);
  --shadow-coral: 0 6px 20px rgba(255,107,71,0.25);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 100px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-body);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);color:var(--text-heading);font-weight:700;letter-spacing:-0.015em;line-height:1.2}
h1{font-family:var(--font-display);font-weight:800}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--color-primary);text-decoration:none;font-weight:500}
a:hover{color:var(--color-primary-hover)}

/* Busy indicator */
#busy{position:fixed;top:16px;right:16px;background:var(--color-primary);color:#fff;border-radius:8px;padding:8px 16px;font-weight:600;font-size:12px;z-index:200;display:none;box-shadow:var(--shadow-coral);letter-spacing:0.04em;text-transform:uppercase}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:1.5px solid transparent;border-radius:8px;font-family:var(--font-heading);font-weight:600;font-size:14px;cursor:pointer;transition:all .15s ease;background:var(--bg-card);color:var(--text-heading);border-color:var(--bg-secondary);line-height:1.2;text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn.primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary);box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:#fff;box-shadow:var(--shadow-coral)}
.btn.secondary{background:var(--color-secondary);color:#fff;border-color:var(--color-secondary)}
.btn.secondary:hover{background:var(--color-secondary-hover);border-color:var(--color-secondary-hover);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-body)}
.btn.ghost:hover{background:var(--bg-secondary);color:var(--text-heading)}
.btn.danger{background:transparent;color:var(--color-danger);border-color:#F5C8D3}
.btn.danger:hover{background:var(--color-danger);color:#fff;border-color:var(--color-danger)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.lg{padding:14px 24px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Inputs */
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 14px;background:var(--bg-primary);border:1.5px solid var(--bg-secondary);border-radius:8px;font-size:14px;color:var(--text-heading);transition:all .15s ease;outline:none;font-family:var(--font-body)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);background:var(--bg-card);box-shadow:0 0 0 3px rgba(255,107,71,0.1)}
textarea{resize:vertical;min-height:80px}

.field{margin-bottom:16px}
.field label{display:block;font-family:var(--font-heading);font-size:12px;font-weight:600;color:var(--text-heading);margin-bottom:6px;letter-spacing:0.02em}

/* ═══════ LOGIN SCREEN ═══════ */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--bg-primary) 0%,var(--bg-secondary) 100%)}
.login-card{background:var(--bg-card);border-radius:24px;padding:48px 40px;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:22px;box-shadow:var(--shadow-coral)}
.login-logo-text{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text-heading);letter-spacing:-0.02em}
.login-title{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);margin-bottom:8px;letter-spacing:-0.025em}
.login-subtitle{color:var(--text-body);font-size:14px;margin-bottom:32px}
.login-alert{background:var(--bg-danger-light);color:var(--color-danger);padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;margin-bottom:16px}
.login-divider{position:relative;text-align:center;margin:24px 0 16px}
.login-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--bg-secondary)}
.login-divider span{position:relative;background:var(--bg-card);padding:0 12px;font-size:12px;color:var(--text-muted);font-family:var(--font-heading);letter-spacing:0.06em;text-transform:uppercase}
.login-link{text-align:center;font-size:14px;color:var(--text-body);margin-top:16px}

/* ═══════ APP SHELL ═══════ */
.app-shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--bg-card);border-right:1px solid var(--bg-secondary);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:0 12px;margin-bottom:32px}
.sidebar-logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:18px;box-shadow:var(--shadow-coral)}
.sidebar-logo-text{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-heading);letter-spacing:-0.02em}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:var(--font-heading);font-size:14px;font-weight:500;color:var(--text-body);transition:all .15s ease;border:none;background:transparent;text-align:left;width:100%}
.sidebar-item:hover{background:var(--bg-secondary);color:var(--text-heading)}
.sidebar-item.active{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));color:#fff;font-weight:600;box-shadow:var(--shadow-coral)}
.sidebar-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-item .nav-badge{margin-left:auto;background:var(--color-primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;min-width:20px;text-align:center}
.sidebar-item.active .nav-badge{background:rgba(255,255,255,0.25);color:#fff}
.sidebar-user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--bg-secondary);margin-top:16px;cursor:pointer}
.sidebar-user-avatar{width:36px;height:36px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;flex-shrink:0}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-family:var(--font-heading);font-size:14px;font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

/* Main area */
.main-area{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--bg-card);border-bottom:1px solid var(--bg-secondary);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-heading);letter-spacing:-0.02em}
.topbar-search{flex:1;max-width:480px;position:relative}
.topbar-search input{padding-left:40px;background:var(--bg-primary);border-color:transparent}
.topbar-search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-muted);pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-bell{width:40px;height:40px;border-radius:8px;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;border:none;color:var(--text-body);transition:all .15s ease}
.topbar-bell:hover{background:var(--bg-secondary);color:var(--text-heading)}
.topbar-bell .bell-dot{position:absolute;top:8px;right:10px;width:8px;height:8px;background:var(--color-primary);border-radius:50%;border:2px solid var(--bg-card)}
.topbar-avatar{width:40px;height:40px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;border:none}

/* Content */
.content{padding:32px;flex:1;max-width:1400px;width:100%}
.page-header{margin-bottom:24px}
.page-title{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);letter-spacing:-0.025em;margin-bottom:6px}
.page-subtitle{color:var(--text-body);font-size:14px}

/* Cards */
.card{background:var(--bg-card);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);border:1px solid rgba(26,31,46,0.04)}
.card-title{font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--text-heading);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-subtitle{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px}

/* Stat cards */
.stat-grid{display:grid;gap:16px}
.stat-grid.g2{grid-template-columns:repeat(2,1fr)}
.stat-grid.g3{grid-template-columns:repeat(3,1fr)}
.stat-grid.g4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--bg-card);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-value{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);letter-spacing:-0.02em;line-height:1.1}
.stat-trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:4px}
.stat-trend.up{color:var(--color-success)}
.stat-trend.down{color:var(--color-danger)}

/* Tags/Badges */
.tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.tag.coral{background:var(--bg-coral-light);color:var(--color-primary)}
.tag.teal{background:var(--bg-teal-light);color:var(--color-secondary)}
.tag.success{background:var(--bg-success-light);color:#4A6B1F}
.tag.warning{background:var(--bg-warning-light);color:#8A5B12}
.tag.danger{background:var(--bg-danger-light);color:var(--color-danger)}
.tag.muted{background:var(--bg-secondary);color:var(--text-body)}

/* Filter chips */
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-chip{padding:8px 16px;border-radius:100px;background:transparent;border:1.5px solid var(--bg-secondary);font-family:var(--font-heading);font-size:13px;font-weight:500;color:var(--text-body);cursor:pointer;transition:all .15s ease}
.filter-chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.filter-chip.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:12px 16px;font-family:var(--font-heading);font-weight:600;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;background:var(--bg-primary);border-bottom:1px solid var(--bg-secondary)}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--bg-secondary);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg-primary)}
.data-table tr.clickable{cursor:pointer}

/* Grid */
.card-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item-card{background:var(--bg-card);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid rgba(26,31,46,0.04);transition:all .15s ease;cursor:pointer}
.item-card:hover{box-shadow:var(--shadow-md);border-color:var(--color-primary)}

/* Avatar */
.avatar{width:40px;height:40px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;flex-shrink:0}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:48px;height:48px;font-size:16px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.avatar.coral{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover))}
.avatar.warning{background:linear-gradient(135deg,#FFA500,var(--color-warning));color:#8A5B12}
.avatar.success{background:linear-gradient(135deg,var(--color-success),#5A8228)}

/* Countdown ring */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-svg{transform:rotate(-90deg)}
.ring-track{stroke:var(--bg-secondary);fill:none}
.ring-progress{fill:none;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-value{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-heading);line-height:1}
.ring-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-top:2px}

/* Empty state */
.empty-state{text-align:center;padding:60px 24px;background:var(--bg-card);border-radius:16px;border:2px dashed var(--bg-secondary)}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:0.5}
.empty-title{font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--text-heading);margin-bottom:6px}
.empty-text{color:var(--text-body);font-size:14px;max-width:400px;margin:0 auto 16px}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(26,31,46,0.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-inner{background:var(--bg-card);border-radius:20px;padding:32px;max-width:520px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
.modal-inner h3{font-family:var(--font-display);font-weight:800;font-size:22px;margin-bottom:12px}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

/* Section title */
.section-title{font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--text-heading);margin-bottom:16px}

/* Detail grid */
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:12px 24px;font-size:14px}
.detail-grid dt{color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:0.06em;font-weight:600;padding-top:2px}
.detail-grid dd{color:var(--text-heading);font-weight:500;word-break:break-word}

/* Progress bar */
.progress{height:6px;background:var(--bg-secondary);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-hover));border-radius:100px;transition:width 0.6s ease}

/* Split view */
.split-view{display:grid;grid-template-columns:400px 1fr;gap:24px;min-height:calc(100vh - var(--topbar-h) - 64px)}
.split-list{background:var(--bg-card);border-radius:16px;padding:20px;overflow-y:auto;max-height:calc(100vh - 130px)}
.split-detail{background:var(--bg-card);border-radius:16px;padding:24px;overflow-y:auto;max-height:calc(100vh - 130px)}

/* Chat bubbles */
.chat-bubble{padding:10px 14px;border-radius:12px;margin-bottom:8px;max-width:75%;font-size:14px}
.chat-bubble.own{background:var(--color-primary);color:#fff;margin-left:auto}
.chat-bubble.other{background:var(--bg-secondary);color:var(--text-heading)}
.chat-meta{font-size:11px;color:var(--text-muted);margin-bottom:4px}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--bg-secondary);border-radius:2px}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;background:var(--color-primary);border-radius:50%;border:2px solid var(--bg-card);box-shadow:0 0 0 2px var(--bg-secondary)}
.timeline-item .time{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px}
.timeline-item .desc{font-size:13px;color:var(--text-heading);line-height:1.5}

/* Responsive */
@media(max-width:1024px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-100%;z-index:100;width:260px;transition:left .25s ease;box-shadow:var(--shadow-lg)}.sidebar.open{left:0}.topbar{padding:0 16px}.split-view{grid-template-columns:1fr}.stat-grid.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.topbar-search{display:none}.login-card{padding:32px 24px}.stat-grid.g3,.stat-grid.g4{grid-template-columns:1fr}.content{padding:20px 16px}.page-title{font-size:24px}}
</style>

<body>
<div id="busy">Working...</div>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   PRESERVED FROM PORTAL.HTML - AUTH FLOW, RPC, STATE
═══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://rofyegirmgqjhekuxjat.supabase.co';
const SB_KEY = 'sb_publishable_4f6WR1sk2N9EUO2bU7dkyA_9TByUhTL';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ad-auth' } });
let authMode = null;

async function rpc(fn, args){
  document.getElementById('busy').style.display='block';
  try{
    let useFn = fn;
    let useArgs = Object.assign({}, args || {});
    let useAuth = 'Bearer ' + SB_KEY;
    if (authMode === 'supabase') {
      const legacyReads = ['fn_get_state','fn_login','fn_get_public_stats','fn_submit_lead'];
      const isDirectAuth = fn.indexOf('fn_a_') === 0;
      const shouldRewrite = legacyReads.indexOf(fn) === -1 && !isDirectAuth;
      if (shouldRewrite || isDirectAuth) {
        if (shouldRewrite) { useFn = fn.replace(/^fn_/, 'fn_a_'); delete useArgs.p_actor; }
        try { const s = await sb.auth.getSession(); if (s && s.data && s.data.session) useAuth = 'Bearer ' + s.data.session.access_token; } catch(e){}
      }
    }
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + useFn, { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':useAuth}, body: JSON.stringify(useArgs) });
    if(!r.ok){ const txt = await r.text().catch(()=>String(r.status)); throw new Error('Network ' + r.status + ': ' + txt.slice(0,200)); }
    return await r.json();
  } finally { document.getElementById('busy').style.display='none'; }
}

async function rpcRaw(fn, args, accessToken){
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+accessToken}, body: JSON.stringify(args||{}) });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

const today = () => new Date().toISOString().slice(0,10);
const fmt = d => { if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString(undefined, {month:'short',day:'numeric',year:'numeric'}); }catch(e){ return d; } };
// Viewer-local date+time. Auto-detects the viewer's timezone and locale.
// US viewer sees US format in their zone; India viewer sees IST, dd/mm.
const fmtDateTime = v => {
  if(!v) return '';
  try{
    let s = String(v).trim();
    // Bare date (no time) -> date only, no misleading hour
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
      const d0 = new Date(s + 'T00:00:00Z');
      return d0.toLocaleDateString(undefined, {month:'short',day:'numeric',year:'numeric'});
    }
    // Normalize Postgres timestamp: "2026-08-11 16:13:44.895+00" -> ISO
    s = s.replace(' ', 'T');
    // Trim microseconds to milliseconds (JS only handles 3 digits)
    s = s.replace(/(\.\d{3})\d+/, '$1');
    // Normalize zone: +00 -> +00:00, +0530 -> +05:30
    if(/[+-]\d{2}$/.test(s)) s = s + ':00';
    else if(/[+-]\d{4}$/.test(s)) s = s.replace(/([+-]\d{2})(\d{2})$/, '$1:$2');
    else if(!/[zZ]|[+-]\d{2}:\d{2}$/.test(s)) s = s + 'Z'; // no zone at all -> assume UTC
    const d = new Date(s);
    if(isNaN(d.getTime())) return String(v);
    return d.toLocaleString(undefined, {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  }catch(e){ return String(v); }
};
const timeAgo = iso => {
  if(!iso) return '';
  try{
    let s = String(iso);
    if(/\d{2}:\d{2}/.test(s) && !/[zZ]|[+-]\d{2}:?\d{2}$/.test(s)) s = s.replace(' ','T') + 'Z';
    const t = new Date(s).getTime();
    const diff = Math.floor((Date.now() - t) / 1000);
    if(diff < 60) return diff + 's ago';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if(diff < 2592000) return Math.floor(diff/86400) + 'd ago';
    return Math.floor(diff/2592000) + 'mo ago';
  }catch(e){ return ''; }
};
const money = (amt, cur) => {
  const symbol = cur === 'USD' ? '$' : cur === 'INR' ? '₹' : (cur || '');

  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
};

/* ═══════ SVG CHART HELPERS ═══════ */
// Sparkline: values array -> tiny inline line chart
function svgSparkline(values, opts){
  opts = opts || {};
  const w = opts.width || 100, h = opts.height || 32;
  const color = opts.color || 'var(--color-primary)';
  const showDots = opts.dots !== false;
  if(!values || values.length < 2) return `<svg width="${w}" height="${h}"><line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${color}" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4"/></svg>`;
  const min = Math.min.apply(null, values);
  const max = Math.max.apply(null, values);
  const range = max - min || 1;
  const pad = 3;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * (w - 2*pad) + pad;
    const y = h - pad - ((v - min) / range) * (h - 2*pad);
    return { x, y };
  });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const lastPoint = points[points.length - 1];
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    ${showDots ? `<circle cx="${lastPoint.x.toFixed(1)}" cy="${lastPoint.y.toFixed(1)}" r="2.5" fill="${color}"/>` : ''}
  </svg>`;
}

// Line chart with area fill (for revenue tracker)
function svgLineChart(values, opts){
  opts = opts || {};
  const w = opts.width || 400, h = opts.height || 140;
  const color = opts.color || 'var(--color-success)';
  const fillOpacity = opts.fillOpacity || 0.12;
  if(!values || values.length < 2) return `<svg width="${w}" height="${h}" style="background:var(--bg-primary);border-radius:8px"><text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="11" fill="var(--text-muted)">No data yet</text></svg>`;
  const min = Math.min.apply(null, values);
  const max = Math.max.apply(null, values);
  const range = max - min || 1;
  const pad = 8;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * (w - 2*pad) + pad;
    const y = h - pad - ((v - min) / range) * (h - 2*pad);
    return { x, y };
  });
  const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${(w-pad).toFixed(1)},${(h-pad).toFixed(1)} L${pad.toFixed(1)},${(h-pad).toFixed(1)} Z`;
  const gid = 'lg' + Math.random().toString(36).slice(2, 8);
  return `<svg width="${w}" height="${h}" style="display:block;background:var(--bg-primary);border-radius:8px;overflow:visible">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="${fillOpacity}"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#${gid})"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="${color}"/>`).join('')}
  </svg>`;
}

// Bar chart (for weekly pipeline/transmission)
function svgBarChart(values, opts){
  opts = opts || {};
  const w = opts.width || 300, h = opts.height || 120;
  const labels = opts.labels || [];
  const colors = opts.colors || ['var(--color-primary)'];
  const pad = 12;
  const gap = 6;
  const barCount = values.length;
  const barW = (w - 2*pad - (barCount-1)*gap) / barCount;
  const max = Math.max.apply(null, values.concat([1]));
  return `<svg width="${w}" height="${h}" style="display:block;overflow:visible">
    ${values.map((v, i) => {
      const barH = Math.max(2, (v / max) * (h - 2*pad - 14));
      const x = pad + i*(barW + gap);
      const y = h - pad - barH - 14;
      const color = colors[i % colors.length];
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"/>
      <text x="${(x + barW/2).toFixed(1)}" y="${h - 2}" text-anchor="middle" font-size="10" font-family="var(--font-heading)" font-weight="600" fill="var(--text-muted)">${esc(labels[i] || '')}</text>`;
    }).join('')}
  </svg>`;
}

// Progress ring - big circular gauge
function svgRing(pct, opts){
  opts = opts || {};
  const size = opts.size || 100;
  const stroke = opts.stroke || 10;
  const color = opts.color || 'var(--color-primary)';
  const trackColor = opts.trackColor || 'var(--bg-secondary)';
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct/100)));
  const value = opts.value != null ? opts.value : (pct + '%');
  const label = opts.label || '';
  const sublabel = opts.sublabel || '';
  return `<div style="position:relative;width:${size}px;height:${size}px;display:inline-flex;align-items:center;justify-content:center">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .6s ease"/>
    </svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
      <div style="font-family:var(--font-display);font-weight:800;font-size:${Math.floor(size/5.5)}px;color:var(--text-heading);line-height:1">${esc(value)}</div>
      ${label ? `<div style="font-family:var(--font-heading);font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-top:2px">${esc(label)}</div>` : ''}
      ${sublabel ? `<div style="font-size:10px;color:var(--text-body);margin-top:2px">${esc(sublabel)}</div>` : ''}
    </div>
  </div>`;
}

// Generate sample sparkline data (upward trend with noise)
function sampleSparkline(count, base, growth){
  count = count || 8; base = base || 10; growth = growth == null ? 1 : growth;
  const arr = [];
  for(let i = 0; i < count; i++){
    arr.push(Math.round(base + i * growth + (Math.random() * base * 0.3 - base * 0.15)));
  }
  return arr;
}

async function loadLeads(){
  try{ const r = await rpc('fn_get_leads', {p_actor: session.code}); leads = (r&&r.ok) ? r.leads : []; }
  catch(e){ leads = []; }
}
async function refresh(){
  try{
    const res = await rpc('fn_get_state', {p_code: session.code});
    if(res && res.ok){
      S = res;
      if(res.role === 'admin' || res.role === 'manager') await loadLeads();
      return true;
    }
    // fn_get_state failed but user IS authenticated - continue with empty state
    console.warn('fn_get_state returned not-ok:', res);
    S = { clients: [], recruiters: [], managers: [], role: session.role };
    if(session.role === 'admin' || session.role === 'manager'){ try{ await loadLeads(); }catch(e){} }
    return true;
  }catch(e){
    console.warn('refresh error:', e);
    S = { clients: [], recruiters: [], managers: [], role: session.role };
    return true;
  }
}
async function refreshAnd(fn){ if(await refresh()) fn(); }

function askConfirm(message, title){
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal-inner"><h3>${esc(title || 'Are you sure?')}</h3><p style="color:var(--text-body);margin-bottom:24px">${esc(message)}</p><div class="modal-actions"><button class="btn ghost" id="ac-no">Cancel</button><button class="btn danger" id="ac-yes">Yes</button></div></div>`;
    document.body.appendChild(back);
    const cleanup = v => { back.remove(); resolve(v); };
    back.querySelector('#ac-yes').onclick = () => cleanup(true);
    back.querySelector('#ac-no').onclick = () => cleanup(false);
    back.onclick = e => { if(e.target === back) cleanup(false); };
  });
}

function toast(msg, kind){
  const t = document.createElement('div');
  const bg = kind === 'error' ? 'var(--color-danger)' : kind === 'success' ? 'var(--color-success)' : 'var(--color-primary)';
  t.style.cssText = `position:fixed;top:20px;right:20px;background:${bg};color:#fff;padding:12px 20px;border-radius:8px;font-family:var(--font-heading);font-weight:600;font-size:14px;z-index:400;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

window.doEmailLogin = async function(){
  const email = ($('#li-email').value || '').trim().toLowerCase();
  const pass = $('#li-pass').value || '';
  if(!email || !pass){ renderLogin('Enter email and password.'); return; }
  document.getElementById('busy').style.display = 'block';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ renderLogin(error.message || 'Login failed.'); return; }
    const who = await rpcRaw('fn_whoami', {}, data.session.access_token);
    if(!who || !who.ok){ await sb.auth.signOut(); renderLogin('Your email is not linked to an ApplyDesk profile yet. Ask admin to invite you.'); return; }
    authMode = 'supabase';
    session = { code: who.role_code || '', role: who.role, name: who.name, email };
    await refresh();
    rerender();
  }catch(e){ renderLogin('Connection problem, try again.'); }
  finally{ document.getElementById('busy').style.display = 'none'; }
};

window.doLogin = async function(){
  const code = ($('#code').value || '').trim().toLowerCase();
  if(!code){ renderLogin('Enter your access code.'); return; }
  try{
    const res = await rpc('fn_login', { p_code: code });
    if(!res.ok){ renderLogin('Invalid code.'); return; }
    authMode = 'legacy';
    session = { code, role: res.role, name: res.name };
    sessionStorage.setItem('ad-code', code);
    await refresh();
    rerender();
  }catch(e){ renderLogin('Connection problem, try again.'); }
};

    <p style="color:var(--text-body);font-size:14px;margin-bottom:16px">${prefilledEmail ? 'We will send a reset link to your email on file:' : 'Enter your email and we will send you a link to set a new password.'}</p>

  const cleanup = () => back.remove();
  back.querySelector('#rst-cancel').onclick = cleanup;
  back.onclick = e => { if(e.target === back) cleanup(); };

};

window.doSetPassword = async function(){
  const pass = document.getElementById('sp-pass').value;
  const conf = document.getElementById('sp-conf').value;
  const err = document.getElementById('sp-err');
  if(!pass || pass.length < 8){ err.textContent = 'Password must be at least 8 characters.'; return; }
  if(pass !== conf){ err.textContent = 'Passwords do not match.'; return; }
  err.textContent = '';
  document.getElementById('busy').style.display = 'block';
  try{
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ err.textContent = error.message || 'Could not save password.'; return; }
    history.replaceState(null, '', window.location.pathname);
    const who = await sb.auth.getUser();
    if(who && who.data && who.data.user){
      const wr = await rpcRaw('fn_whoami', {}, (await sb.auth.getSession()).data.session.access_token);
      if(wr && wr.ok){
        authMode = 'supabase';
        session = { code: wr.role_code || '', role: wr.role, name: wr.name, email: who.data.user.email };
        await refresh();
        rerender();
        return;
      }
    }
    alert('Password saved. Please log in.'); renderLogin();
  }catch(e){ err.textContent = 'Could not save password. Try again.'; }
  finally{ document.getElementById('busy').style.display = 'none'; }
};

window.toggleAvatarMenu = function(e){
  if(e) e.stopPropagation();
  const m = document.getElementById('avatar-menu');
  if(!m) return;
  const isOpen = m.style.display !== 'none';
  m.style.display = isOpen ? 'none' : 'block';
  if(!isOpen){
    setTimeout(() => {
      document.addEventListener('click', function outsideClick(ev){
        const menu = document.getElementById('avatar-menu');
        if(!menu){ document.removeEventListener('click', outsideClick); return; }
        if(!menu.contains(ev.target)){
          closeAvatarMenu();
          document.removeEventListener('click', outsideClick);
        }
      });
    }, 50);
  }
};
window.closeAvatarMenu = function(){ const m = document.getElementById('avatar-menu'); if(m) m.style.display = 'none'; };

function renderAdminDashboard(){
  const cs = S.clients || [];
  const rs = S.recruiters || [];
  const ms = S.managers || [];
  const activeClients = cs.filter(c => !c.deactivated_at).length;
  // Real count: applications logged with today's date
  const _todayStr = new Date().toISOString().slice(0,10);
  const appsToday = (S.records || []).filter(r => {
    if(r.type && r.type !== 'application') return false;
    const d = (r.date || r.created_at || '').slice(0,10);
    return d === _todayStr;
  }).length;
  const activeRecruiters = rs.filter(r => !r.deactivated_at).length;
  const monthlyRecurring = cs.filter(c => !c.deactivated_at && c.subscription_amount).reduce((sum, c) => sum + (c.subscription_currency === 'USD' ? Number(c.subscription_amount) : Number(c.subscription_amount) / 88), 0);
  const unclaimedLeads = (leads || []).filter(l => !l.claimed_by).length;

  // Month progress ring
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const dayOfMonth = now.getDate();
  const monthPct = Math.round((dayOfMonth / daysInMonth) * 100);

  // Revenue history (last 6 months) - sample data since we don't have full history yet
  const revenueHistory = sampleSparkline(6, Math.max(500, Math.round(monthlyRecurring * 0.7)), Math.round(monthlyRecurring * 0.05));
  revenueHistory[revenueHistory.length - 1] = Math.round(monthlyRecurring); // Current month is real

  // Telemetry sparklines
  const activeClientsTrend = sampleSparkline(8, Math.max(1, activeClients - 3), 0.4);
  activeClientsTrend[activeClientsTrend.length - 1] = activeClients;
  const appsSentTrend = sampleSparkline(8, 80, 6);
  const leadsTrend = sampleSparkline(8, Math.max(1, unclaimedLeads + 2), -0.3);
  leadsTrend[leadsTrend.length - 1] = unclaimedLeads;

  // Orbital Billing Pulse - upcoming payments
  const upcoming = [];
  cs.forEach(c => {
    if(c.deactivated_at || !c.subscription_start_date) return;
    try{
      const start = new Date(c.subscription_start_date);
      const nowD = new Date();
      const monthsElapsed = Math.max(1, Math.ceil((nowD - start) / (30 * 86400000)));
      const nextDue = new Date(start.getTime() + monthsElapsed * 30 * 86400000);
      const days = Math.floor((nextDue - nowD) / 86400000);
      if(days >= 0 && days <= 30) upcoming.push({ name: c.name, code: c.code, days, amount: c.subscription_amount, currency: c.subscription_currency });
    }catch(e){}
  });
  upcoming.sort((a,b) => a.days - b.days);

  const orbitalCards = upcoming.slice(0, 6).map(p => {
    const urgent = p.days <= 3;
    const dotColor = urgent ? 'var(--color-danger)' : 'var(--color-info)';
    const borderColor = urgent ? 'var(--color-danger)' : 'var(--color-info)';
    const amountColor = urgent ? 'var(--color-danger)' : 'var(--color-info)';

function renderLeadsPage(){

          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(l.plan_interest || 'No plan')} · ${timeAgo(l.created_at)}</div>

    <div class="split-list">${listItems}</div>

function renderLeadDetail(l){
  const notes = l.notes_json || [];
  const notesHtml = Array.isArray(notes) && notes.length ? notes.map(n => `<div class="timeline-item"><div class="time">${esc(n.by || 'Admin')} · ${timeAgo(n.at)}</div><div class="desc">${esc(n.text)}</div></div>`).join('') : `<div style="color:var(--text-muted);font-size:13px;padding:16px 0">No notes yet. Add one below.</div>`;
  const dispName = leadName(l);

  // Resolve who claimed - could be code, show as name
  let claimedByName = '';
  if(l.claimed_by){
    const r = (S.recruiters || []).find(x => x.code === l.claimed_by);
    const m = (S.managers || []).find(x => x.code === l.claimed_by);
    const a = (adminsList || []).find(x => x.code === l.claimed_by);
    claimedByName = r ? r.name : m ? m.name : a ? a.name : (l.claimed_by === session.code ? 'You' : l.claimed_by);
  }

  // Assignee options for admin/manager
  const canReassign = session.role === 'admin' || session.role === 'manager';
  const assignOptions = [
    ...(S.managers || []).filter(m => !m.deactivated_at).map(m => ({ code: m.code, name: m.name, role: 'manager' })),
    ...(S.recruiters || []).filter(r => !r.deactivated_at).map(r => ({ code: r.code, name: r.name, role: 'recruiter' }))
  ];

  return `<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap">
    <div class="avatar lg coral">${esc(initials(dispName))}</div>
    <div style="flex:1;min-width:200px"><h2 style="font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--text-heading);margin:0">${esc(dispName)}</h2><div style="font-size:13px;color:var(--text-muted)">Submitted ${timeAgo(l.created_at)}${l.claimed_by ? ' · <span class="tag success">CLAIMED BY ' + esc(claimedByName.toUpperCase()) + '</span>' : ' · <span class="tag warning">UNCLAIMED</span>'}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${!l.claimed_by ? `<button class="btn primary" onclick="claimLead(${l.id})">✋ Claim</button>` : ''}
      ${session.role === 'admin' ? `<button class="btn ghost sm" onclick="deleteLead(${l.id}, '${esc(dispName.replace(/'/g, ''))}')" style="color:#fff;background:var(--color-danger);border-color:var(--color-danger)">🗑️ Delete lead</button>` : ''}
    </div>
  </div>
  ${canReassign ? `<div class="card" style="margin-bottom:16px;padding:14px 18px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Assign to</div>
      <select id="lead-assign-select" style="flex:1;min-width:200px;max-width:300px">
        <option value="">— Choose team member —</option>
        ${assignOptions.map(o => `<option value="${esc(o.code)}" ${l.claimed_by === o.code ? 'selected' : ''}>${esc(o.name)} (${esc(o.role)})</option>`).join('')}
      </select>
      <button class="btn primary sm" onclick="assignLead(${l.id})">Assign</button>
      ${l.claimed_by ? `<button class="btn ghost sm" onclick="unassignLead(${l.id})">Unassign</button>` : ''}
    </div>
  </div>` : ''}
  <div class="card" style="margin-bottom:16px">
    <div class="card-subtitle">Contact info</div>
    <dl class="detail-grid">
      ${l.email ? `<dt>Email</dt><dd><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></dd>` : '<dt>Email</dt><dd style="color:var(--text-muted);font-style:italic">Not provided</dd>'}
      ${l.phone ? `<dt>Phone</dt><dd><a href="tel:${esc(l.phone)}">${esc(l.phone)}</a></dd>` : ''}
      ${(() => {
        const raw = l.plan || l.plan_interest || '';
        let planPart = raw, timePart = l.best_time_to_call || '';
        const marker = raw.indexOf('Preferred call time:');
        if(marker !== -1){
          timePart = raw.slice(marker + 'Preferred call time:'.length).replace(/^[\s|:-]+/, '').trim();
          planPart = raw.slice(0, marker).replace(/[\s|]+$/, '').trim();
        }
        let out = '';
        if(timePart) out += `<dt>Best time to call</dt><dd><span class="tag coral">📞 ${esc(timePart)}</span></dd>`;
        if(planPart) out += `<dt>Interest</dt><dd><span class="tag teal">${esc(planPart)}</span></dd>`;
        return out;
      })()}
      ${l.message ? `<dt>Message</dt><dd style="font-style:italic;color:var(--text-body)">"${esc(l.message)}"</dd>` : ''}
    </dl>
  </div>
  <div class="card">
    <div class="card-subtitle">Notes timeline</div>
    <div class="timeline" style="margin-top:12px">${notesHtml}</div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <input type="text" id="lead-note-input" placeholder="Add a note (e.g. 'Called at 3pm, wants callback Tue')" onkeydown="if(event.key==='Enter')addLeadNote(${l.id})">
      <button class="btn primary" onclick="addLeadNote(${l.id})">Add note</button>
    </div>
  </div>`;
}

window.deleteLead = async function(id, name){
  const ok = await askConfirm('Permanently delete this lead? All notes and history for ' + name + ' will be lost. This cannot be undone.', 'Delete lead forever?');
  if(!ok) return;
  try{
    const r = await rpc('fn_a_delete_lead', { p_id: id });
    if(r && r.ok){
      viewState.selectedLead = null;
      await loadLeads();
      toast('Lead deleted', 'success');
      renderShell();
    } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.addLeadNote = async function(id){
  const input = document.getElementById('lead-note-input');
  const text = (input.value || '').trim();
  if(!text){ toast('Please type a note first', 'error'); return; }
  try{
    // Note: fn_add_lead_note gets rewritten to fn_a_add_lead_note by auth-mode routing
    // The SQL function takes only p_id and p_text (no p_actor)
    const r = await rpc('fn_add_lead_note', { p_id: id, p_text: text });
    if(r && r.ok){
      input.value = '';
      await loadLeads();
      toast('Note added', 'success');
      renderShell();
    }
    else toast('Could not add note: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

function renderClientsPage(){
  const cs = S.clients || [];
  const filter = viewState.clientFilter || 'active';
  const filtered = filter === 'all' ? cs : filter === 'active' ? cs.filter(c => !c.deactivated_at) : cs.filter(c => c.deactivated_at);
  const showAdd = viewState.showAddClient;

  // Load real app counts (once per session)
  if(!window.clientAppCounts && !window._loadingRecCounts){
    window._loadingRecCounts = true;
    rpc('fn_a_list_all_applications', {}).then(r => {
      const recCounts = {}, clientCounts = {};
      if(r && r.ok && Array.isArray(r.applications)){
        r.applications.forEach(a => {
          const rCode = a.recruiter_code || a.added_by;
          if(rCode){ recCounts[rCode] = (recCounts[rCode] || 0) + 1; }
          if(a.client_code){ clientCounts[a.client_code] = (clientCounts[a.client_code] || 0) + 1; }
        });
      }
      window.recruiterAppCounts = recCounts;
      window.clientAppCounts = clientCounts;
      window._loadingRecCounts = false;
      renderShell();
    }).catch(() => { window.recruiterAppCounts = {}; window.clientAppCounts = {}; window._loadingRecCounts = false; });
  }

  const clientCards = filtered.map(c => {
    let daysLeft = null;
    if(c.subscription_start_date){
      try{
        const start = new Date(c.subscription_start_date);
        const now = new Date();
        const monthsElapsed = Math.max(1, Math.ceil((now - start) / (30 * 86400000)));
        const nextDue = new Date(start.getTime() + monthsElapsed * 30 * 86400000);
        daysLeft = Math.floor((nextDue - now) / 86400000);
      }catch(e){}
    }
    const urgClass = daysLeft === null ? 'muted' : daysLeft <= 3 ? 'danger' : daysLeft <= 7 ? 'warning' : 'success';
    const urgLabel = daysLeft === null ? 'NO CYCLE' : daysLeft === 0 ? 'DUE TODAY' : daysLeft + 'd';
    const assignedRecruiter = (S.recruiters || []).find(r => r.assigned && r.assigned.includes(c.code));
    // Real velocity: count of apps for this client
    const clientAppCount = (window.clientAppCounts && window.clientAppCounts[c.code]) || 0;
    const velocity = window.clientAppCounts ? [0,0,0,0,0,0, clientAppCount] : sampleSparkline(6, 0, 0);

    return `<div class="item-card" onclick="openClientDetail('${esc(c.code)}')">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">
        <div class="avatar coral">${esc(initials(c.name))}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font-heading);font-weight:700;color:var(--text-heading);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:monospace">${esc(c.code)}</div>
        </div>
        ${c.deactivated_at ? '<span class="tag danger">INACTIVE</span>' : `<span class="tag ${urgClass}">${urgLabel}</span>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bg-secondary)">
        <div>
          <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Apps received</div>
          <div style="font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-heading);margin-top:2px">${clientAppCount} ${clientAppCount === 1 ? 'app' : 'apps'}</div>
        </div>
        ${svgSparkline(velocity, { width: 90, height: 32, color: 'var(--color-primary)' })}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-size:12px;color:var(--text-muted)">
        <span>${c.subscription_amount ? money(c.subscription_amount, c.subscription_currency) + '/mo' : 'No plan'}</span>
        <span>${assignedRecruiter ? '🎯 ' + esc(assignedRecruiter.name.split(' ')[0]) : 'Unassigned'}</span>
      </div>
    </div>`;
  }).join('') || `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">👥</div><h3 class="empty-title">No clients yet</h3><p class="empty-text">Add your first client to get started.</p><button class="btn primary" onclick="toggleAddClient()">+ Add client</button></div>`;

  const addForm = showAdd ? `<div class="card" style="margin-bottom:24px;border:2px solid var(--color-primary)">
    <div class="card-title">➕ Add new client <button class="btn ghost sm" onclick="toggleAddClient()">Cancel</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="field"><label>Full name *</label><input id="ac-name" type="text" placeholder="Jane Smith"></div>
      <div class="field"><label>Email *</label><input id="ac-email" type="email" placeholder="jane@example.com"></div>
      <div class="field"><label>Phone</label><input id="ac-phone" type="tel" placeholder="(555) 123-4567"></div>
      <div class="field"><label>Access code *</label><input id="ac-code" type="text" placeholder="jane01"></div>
      <div class="field"><label>Target role</label><input id="ac-role" type="text" placeholder="Senior Product Manager"></div>
      <div class="field"><label>Years experience</label><input id="ac-years" type="number" placeholder="5"></div>
      <div class="field"><label>Sponsorship</label><select id="ac-sponsor"><option value="">Select...</option><option>US Citizen</option><option>Green Card</option><option>H1B</option><option>OPT</option><option>OPT-EAD</option><option>Other</option></select></div>
      <div class="field"><label>Base resume URL</label><input id="ac-resume" type="url" placeholder="https://..."></div>
      <div class="field"><label>Subscription start</label><input id="ac-start" type="date"></div>
      <div class="field"><label>Amount</label><input id="ac-amount" type="number" placeholder="150"></div>
      <div class="field"><label>Currency</label><select id="ac-currency"><option value="USD">USD ($)</option><option value="INR">INR (₹)</option></select></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:8px">
      <button class="btn ghost" onclick="toggleAddClient()">Cancel</button>
      <button class="btn primary" onclick="submitAddClient()">Add client</button>
    </div>
  </div>` : '';

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
    <div><h1 class="page-title">Client Management</h1><p class="page-subtitle">${cs.filter(c => !c.deactivated_at).length} active · ${cs.filter(c => c.deactivated_at).length} deactivated</p></div>
    ${!showAdd ? '<button class="btn primary" onclick="toggleAddClient()">➕ Add client</button>' : ''}
  </div>
  ${addForm}
  <div class="filter-chips">
    <button class="filter-chip ${filter === 'all' ? 'active' : ''}" onclick="setClientFilter('all')">All (${cs.length})</button>
    <button class="filter-chip ${filter === 'active' ? 'active' : ''}" onclick="setClientFilter('active')">Active (${cs.filter(c => !c.deactivated_at).length})</button>
    <button class="filter-chip ${filter === 'inactive' ? 'active' : ''}" onclick="setClientFilter('inactive')">Deactivated (${cs.filter(c => c.deactivated_at).length})</button>
  </div>
  <div class="card-grid">${clientCards}</div>`;
}

window.toggleAddClient = function(){ viewState.showAddClient = !viewState.showAddClient; renderShell(); };

window.submitAddClient = async function(){
  const getV = id => (document.getElementById(id) || {}).value || '';
  const name = getV('ac-name').trim();
  const email = getV('ac-email').trim().toLowerCase();
  const code = getV('ac-code').trim().toLowerCase();
  if(!name || !email || !code){ toast('Name, email, and access code are required', 'error'); return; }
  try{
    const r = await rpc('fn_a_add_client', {
      p_name: name, p_code: code, p_email: email, p_phone: getV('ac-phone').trim(),
      p_target_role: getV('ac-role').trim(), p_sponsorship: getV('ac-sponsor'),
      p_years_experience: parseFloat(getV('ac-years')) || 0,
      p_base_resume_url: getV('ac-resume').trim(),
      p_subscription_start: getV('ac-start') || null,
      p_subscription_amount: parseFloat(getV('ac-amount')) || 150,
      p_subscription_currency: getV('ac-currency') || 'USD',
      p_target: 25
    });
    if(!r || !r.ok){ toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); return; }
    viewState.showAddClient = false;
    await refresh();
    toast('Client added', 'success');
    renderShell();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

  if(!c) return `<div class="empty-state"><div class="empty-icon">❓</div><h3 class="empty-title">Client not found</h3><p class="empty-text">Code "${esc(code)}" doesn't match any client.</p><button class="btn primary" onclick="setView('clients')">← Back</button></div>`;

  let daysLeft = null, nextDue = null;
  if(c.subscription_start_date){
    try{
      const start = new Date(c.subscription_start_date);

window.sendClientInvite = async function(code, email){
  if(!confirm('Send invitation email to ' + email + '?')) return;
  try{
    const { data:{ session: s } } = await sb.auth.getSession();
    if(!s){ toast('Log in with email + password to send invites', 'error'); return; }
    const r = await fetch(SB_URL + '/functions/v1/invite-user', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':SB_KEY}, body: JSON.stringify({ role:'client', role_code:code, email }) });
    const j = await r.json();
    if(j.ok) toast('Invitation sent to ' + email, 'success');
    else toast('Failed: ' + (j.err || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.deactivateMember = async function(type, code, name){
  const ok = await askConfirm('Deactivate ' + name + '? They will lose access but their history stays.', 'Deactivate ' + name + '?');
  if(!ok) return;
  try{
    const r = await rpc('fn_a_deactivate_member', { p_type: type, p_code: code });
    if(r && r.ok){ await refresh(); toast('Deactivated', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.reactivateMember = async function(type, code){
  try{
    const r = await rpc('fn_a_reactivate_member', { p_type: type, p_code: code });
    if(r && r.ok){ await refresh(); toast('Reactivated', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

/* ═══════ RECRUITERS PAGE ═══════ */
function renderRecruitersPage(){
  const rs = S.recruiters || [];
  const filter = viewState.recruiterFilter || 'active';
  const filtered = filter === 'all' ? rs : filter === 'active' ? rs.filter(r => !r.deactivated_at) : rs.filter(r => r.deactivated_at);
  const showAdd = viewState.showAddRecruiter;

  // Load real app counts per recruiter AND per client (once per page load)
  if(!window.recruiterAppCounts && !window._loadingRecCounts){
    window._loadingRecCounts = true;
    rpc('fn_a_list_all_applications', {}).then(r => {
      const recCounts = {}, clientCounts = {};
      if(r && r.ok && Array.isArray(r.applications)){
        r.applications.forEach(a => {
          const rCode = a.recruiter_code || a.added_by;
          if(rCode){ recCounts[rCode] = (recCounts[rCode] || 0) + 1; }
          if(a.client_code){ clientCounts[a.client_code] = (clientCounts[a.client_code] || 0) + 1; }
        });
      }
      window.recruiterAppCounts = recCounts;
      window.clientAppCounts = clientCounts;
      window._loadingRecCounts = false;
      renderShell();
    }).catch(() => { window.recruiterAppCounts = {}; window.clientAppCounts = {}; window._loadingRecCounts = false; });
  }

  const cards = filtered.map(r => {
    let daysLeft = null;
    if(r.payroll_cycle_day && r.payroll_amount){
      try{
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
        const cycleThisMonth = new Date(y, m, Math.min(r.payroll_cycle_day, 28));
        const nextCycle = cycleThisMonth >= now ? cycleThisMonth : new Date(y, m + 1, Math.min(r.payroll_cycle_day, 28));
        daysLeft = Math.floor((nextCycle - now) / 86400000);
      }catch(e){}
    }
    const urgClass = daysLeft === null ? 'muted' : daysLeft <= 3 ? 'danger' : daysLeft <= 7 ? 'warning' : 'success';
    const urgLabel = daysLeft === null ? 'NO PAYROLL' : daysLeft === 0 ? 'DUE TODAY' : daysLeft + 'd';
    const assignedCount = (r.assigned || []).length;
    // Real velocity: count of apps this recruiter has logged (from cache if available)
    const recruiterAppCount = (window.recruiterAppCounts && window.recruiterAppCounts[r.code]) || 0;
    const velocity = window.recruiterAppCounts ? [0,0,0,0,0,0, recruiterAppCount] : sampleSparkline(6, 0, 0);

    return `<div class="item-card" onclick="openRecruiterDetail('${esc(r.code)}')">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">
        <div class="avatar coral">${esc(initials(r.name))}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--font-heading);font-weight:700;color:var(--text-heading);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:monospace">${esc(r.code)}</div>
        </div>
        ${r.deactivated_at ? '<span class="tag danger">INACTIVE</span>' : `<span class="tag ${urgClass}">${urgLabel}</span>`}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bg-secondary)">
        <div>
          <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Weekly velocity</div>
          <div style="font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-heading);margin-top:2px">${velocity.reduce((a,b) => a+b, 0)} apps</div>
        </div>
        ${svgSparkline(velocity, { width: 90, height: 32, color: 'var(--color-secondary)' })}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-size:12px;color:var(--text-muted)">
        <span>${r.payroll_amount ? money(r.payroll_amount, r.payroll_currency) + '/mo' : 'No payroll'}</span>
        <span>${assignedCount} client${assignedCount !== 1 ? 's' : ''}</span>
      </div>
    </div>`;
  }).join('') || `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🎯</div><h3 class="empty-title">No recruiters yet</h3><p class="empty-text">Add your first recruiter.</p><button class="btn primary" onclick="toggleAddRecruiter()">+ Add recruiter</button></div>`;

  const addForm = showAdd ? `<div class="card" style="margin-bottom:24px;border:2px solid var(--color-primary)">
    <div class="card-title">➕ Add new recruiter <button class="btn ghost sm" onclick="toggleAddRecruiter()">Cancel</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="field"><label>Full name *</label><input id="ar-name" type="text" placeholder="Alex Rodriguez"></div>

    </div>

      <button class="btn ghost" onclick="toggleAddRecruiter()">Cancel</button>
      <button class="btn primary" onclick="submitAddRecruiter()">Add recruiter</button>
    </div>
  </div>` : '';

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
    <div><h1 class="page-title">Recruiters</h1><p class="page-subtitle">${rs.filter(r => !r.deactivated_at).length} active · ${rs.filter(r => r.deactivated_at).length} deactivated</p></div>
    ${!showAdd ? '<button class="btn primary" onclick="toggleAddRecruiter()">➕ Add recruiter</button>' : ''}
  </div>
  ${addForm}
  <div class="filter-chips">
    <button class="filter-chip ${filter === 'all' ? 'active' : ''}" onclick="setRecruiterFilter('all')">All (${rs.length})</button>
    <button class="filter-chip ${filter === 'active' ? 'active' : ''}" onclick="setRecruiterFilter('active')">Active (${rs.filter(r => !r.deactivated_at).length})</button>
    <button class="filter-chip ${filter === 'inactive' ? 'active' : ''}" onclick="setRecruiterFilter('inactive')">Deactivated (${rs.filter(r => r.deactivated_at).length})</button>
  </div>
  <div class="card-grid">${cards}</div>`;
}

window.submitAddRecruiter = async function(){
  const getV = id => (document.getElementById(id) || {}).value || '';
  const name = getV('ar-name').trim(), email = getV('ar-email').trim().toLowerCase(), code = getV('ar-code').trim().toLowerCase();

  try{
    const r = await rpc('fn_a_add_recruiter', {
      p_name: name, p_code: code, p_email: email, p_phone: getV('ar-phone').trim(),
      p_target_roles: getV('ar-roles').trim(),
      p_payroll_amount: parseFloat(getV('ar-amount')) || 0,
      p_payroll_currency: getV('ar-currency') || 'INR',
      p_payroll_cycle_day: parseInt(getV('ar-cycle')) || 15

    if(!r || !r.ok){ toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); return; }
    viewState.showAddRecruiter = false;
    await refresh();
    toast('Recruiter added', 'success');
    renderShell();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

function renderFinancePage(){
  const tab = viewState.financeTab || 'transactions';
  const tabBtn = (key, label) => `<button class="filter-chip ${tab === key ? 'active' : ''}" onclick="setFinanceTab('${key}')">${label}</button>`;
  const tabbar = `<div class="filter-chips" style="margin-bottom:20px">${tabBtn('transactions', '📊 Transactions')}${tabBtn('subscriptions', '🔁 Subscriptions')}${tabBtn('payrolls', '💼 Payrolls')}${tabBtn('spends', '📉 Spends')}${tabBtn('resumes', '📄 Resume Requests')}</div>`;

  const header = `<div class="page-header"><h1 class="page-title">Treasury</h1><p class="page-subtitle">Every dollar in, every rupee out.</p></div>`;
  const dateFilter = financeDateFilter(tab);

  if(tab === 'subscriptions') return header + tabbar + dateFilter + renderFinSubscriptions();
  if(tab === 'payrolls') return header + tabbar + dateFilter + renderFinPayrolls();
  if(tab === 'spends') return header + tabbar + dateFilter + renderFinSpends();
  if(tab === 'resumes') return header + tabbar + dateFilter + renderFinResumes();
  return header + tabbar + dateFilter + renderFinTransactions();
}

window.setFinanceTab = function(t){ viewState.financeTab = t; viewState.financeData = null; renderShell(); };

function renderFinTransactions(){
  // Combined view: load all 3 finance data sources and merge into unified transaction list
  if(viewState.financeData === null || viewState.financeData === undefined){
    viewState.financeData = 'loading';
    Promise.all([
      rpc('fn_a_finance_subscriptions', {}).catch(() => ({ ok: false })),
      rpc('fn_a_finance_payrolls', {}).catch(() => ({ ok: false })),
      rpc('fn_a_finance_spends', {}).catch(() => ({ ok: false }))
    ]).then(([subsR, rollsR, spendsR]) => {
      const combined = [];
      ((subsR && subsR.subscriptions) || []).forEach(s => {
        combined.push({
          date: s.start_date || s.next_due,
          description: 'Subscription: ' + (s.client_name || s.client_code),
          category: 'Subscription',
          direction: 'in',
          amount: s.amount, currency: s.currency, amount_inr: s.currency === 'USD' ? Number(s.amount) * 88 : Number(s.amount),
          client_code: s.client_code
        });
      });
      ((rollsR && rollsR.payrolls) || []).forEach(p => {
        combined.push({
          date: p.next_due,
          description: 'Payroll: ' + (p.name || p.code),
          category: (p.member_type || 'Team') + ' payroll',
          direction: 'out',
          amount: p.amount, currency: p.currency, amount_inr: p.currency === 'USD' ? Number(p.amount) * 88 : Number(p.amount),
          member_code: p.code
        });
      });
      ((spendsR && spendsR.spends) || []).forEach(s => {
        combined.push({
          date: s.txn_date,
          description: s.description || '(no description)',
          category: s.category || 'Other',
          direction: 'out',
          amount: s.amount, currency: s.currency, amount_inr: Number(s.amount_inr || 0),
          related_party: s.related_party
        });
      });
      combined.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      viewState.financeData = combined;
      renderShell();
    }).catch(() => { viewState.financeData = []; renderShell(); });
    return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading transactions...</h3></div>`;
  }
  if(viewState.financeData === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;

  let txns = viewState.financeData || [];
  const df = viewState.financeDateFrom, dt = viewState.financeDateTo;
  if(df || dt){
    txns = txns.filter(t => {
      if(!t.date) return false;
      if(df && t.date < df) return false;
      if(dt && t.date > dt) return false;
      return true;
    });
  }

  const totalIn = txns.filter(t => t.direction === 'in').reduce((s, t) => s + Number(t.amount_inr || 0), 0);
  const totalOut = txns.filter(t => t.direction === 'out').reduce((s, t) => s + Number(t.amount_inr || 0), 0);
  const net = totalIn - totalOut;

  const rows = txns.map(t => `<tr>
    <td>${fmt(t.date)}</td>

window.openAddSpend = function(){

};
window.openEditSpend = function(spendJson){
  // Parse the passed spend (JSON-encoded via JSON.stringify)
  const spend = typeof spendJson === 'string' ? JSON.parse(spendJson.replace(/&quot;/g,'"')) : spendJson;
  openSpendModal(spend);

function openSpendModal(spend){
  const isEdit = !!spend;
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal-inner" style="max-width:520px">
    <h3>${isEdit ? '✏️ Edit spend' : '➕ Add spend'}</h3>
    <div class="field"><label>Date *</label><input id="sp-date" type="date" value="${esc(isEdit && spend.txn_date ? spend.txn_date : new Date().toISOString().slice(0,10))}"></div>
    <div class="field"><label>Description *</label><input id="sp-desc" type="text" placeholder="e.g. Netlify hosting, Google Ads" value="${esc(isEdit ? (spend.description||'') : '')}"></div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
      <div class="field"><label>Category</label><select id="sp-cat"><option>Infrastructure</option><option>Marketing</option><option>Tools</option><option>Contractors</option><option>Legal</option><option>Office</option><option>Other</option></select></div>
      <div class="field"><label>Related party</label><input id="sp-party" type="text" placeholder="Vendor name" value="${esc(isEdit ? (spend.related_party||'') : '')}"></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
      <div class="field"><label>Amount *</label><input id="sp-amt" type="number" step="0.01" placeholder="0.00" value="${esc(isEdit ? spend.amount : '')}"></div>
      <div class="field"><label>Currency</label><select id="sp-cur"><option value="INR" ${isEdit && spend.currency==='INR' ? 'selected' : ''}>INR</option><option value="USD" ${isEdit && spend.currency==='USD' ? 'selected' : ''}>USD</option></select></div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="sp-cancel">Cancel</button>
      <button class="btn primary" id="sp-save">${isEdit ? 'Save changes' : 'Add spend'}</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  // Set category if editing
  if(isEdit && spend.category){
    setTimeout(() => { const sel = document.getElementById('sp-cat'); if(sel) sel.value = spend.category; }, 10);
  }
  const cleanup = () => back.remove();
  back.querySelector('#sp-cancel').onclick = cleanup;
  back.onclick = e => { if(e.target === back) cleanup(); };
  back.querySelector('#sp-save').onclick = async () => {
    const txnDate = document.getElementById('sp-date').value;
    const desc = document.getElementById('sp-desc').value.trim();
    const cat = document.getElementById('sp-cat').value;
    const party = document.getElementById('sp-party').value.trim();
    const amt = parseFloat(document.getElementById('sp-amt').value);
    const cur = document.getElementById('sp-cur').value;
    if(!txnDate){ toast('Date required', 'error'); return; }
    if(!desc){ toast('Description required', 'error'); return; }
    if(!amt || isNaN(amt) || amt <= 0){ toast('Enter a valid amount', 'error'); return; }
    try{
      const args = { p_txn_date: txnDate, p_description: desc, p_category: cat, p_related_party: party || null, p_amount: amt, p_currency: cur };
      if(isEdit){ args.p_id = spend.id; }
      const fn = isEdit ? 'fn_a_fin_update' : 'fn_a_fin_add';
      const r = await rpc(fn, args);
      if(r && r.ok){
        toast(isEdit ? 'Spend updated' : 'Spend added', 'success');
        viewState.financeData = null;
        cleanup();
        renderShell();
      } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
    }catch(e){ toast('Failed: ' + e.message, 'error'); }
  };
}

window.deleteSpend = async function(id, description){
  const ok = await askConfirm(`Delete "${description}"? This cannot be undone.`, 'Delete spend?');
  if(!ok) return;
  try{
    const r = await rpc('fn_a_fin_delete', { p_id: id });
    if(r && r.ok){
      toast('Spend deleted', 'success');
      viewState.financeData = null;
      renderShell();
    } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.claimResume = async function(id){

};
window.completeResume = async function(id){
  const rate = prompt('Exchange rate (INR per USD)? Enter 1 if INR:', '88');

  const fxRate = parseFloat(rate) || 88;
  if(!confirm('Mark complete and log payment?')) return;
  try{
    const r = await rpc('fn_a_complete_resume_request', { p_id: id, p_fx_rate: fxRate });
    if(r && r.ok){ viewState.financeData = null; toast('Completed and logged', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

  }

  // Named groups (3+ members or broadcast). 2-person direct chats are reached via contact tap, not listed here.
  const namedGroups = groups.filter(g => g.is_broadcast || (g.member_count || 0) > 2 || (g.description !== 'Direct chat' && (!g.name || g.name.indexOf(' & ') === -1)));
  const groupItems = namedGroups.map(g => {
    const gKey = 'group:' + g.id;
    const isActive = selKey === gKey;

        <div style="font-size:10px;color:var(--text-muted)">${g.member_count || 0} members</div>
      </div>
    </div>`;
  }).join('');

  const contactList = section('Admins', c.admins) + section('Managers', c.managers) + section('Recruiters', c.recruiters) + (isTeam ? section('Clients', c.clients) : '');

  // Right pane
  let detailHtml;
  if(selKey && selKey.indexOf('dm:') === 0){
    const code = selKey.slice(3);
    const all = [...(c.admins||[]), ...(c.managers||[]), ...(c.recruiters||[]), ...(c.clients||[])];
    const person = all.find(p => p.code === code);
    detailHtml = person ? renderDirectChat(person) : `<div class="empty-state"><div class="empty-icon">💬</div><h3 class="empty-title">Select a conversation</h3></div>`;
  } else if(selKey && selKey.indexOf('group:') === 0){
    const g = groups.find(x => ('group:' + x.id) === selKey);
    detailHtml = g ? renderGroupThread(g) : `<div class="empty-state"><div class="empty-icon">💬</div><h3 class="empty-title">Select a conversation</h3></div>`;
  } else {
    detailHtml = `<div class="empty-state"><div class="empty-icon">💬</div><h3 class="empty-title">Select someone to chat</h3><p class="empty-text">Tap a name on the left to open a private conversation.</p></div>`;
  }

  const createBtn = c.can_create_group ? `<button class="btn primary sm" onclick="openCreateGroup()">➕ Group</button>` : '';

  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 class="page-title" style="margin:0">Chat</h1>
    <div style="display:flex;gap:8px">${createBtn}<button class="btn ghost sm" onclick="refreshChats()">↻ Refresh</button></div>

    <div class="split-list" style="padding:12px">
      ${namedGroups.length ? `<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;padding:4px 8px 6px 8px">Groups (${namedGroups.length})</div>${groupItems}` : ''}

    </div>
    <div class="split-detail">${detailHtml}</div>
  </div>`;
}

function renderClientThread(clientCode){
  const thread = (clientThreadsCache || []).find(t => t.client_code === clientCode);
  const clientName = thread ? thread.client_name : clientCode;

  // Load messages if needed
  if(!threadMessagesCache[clientCode]){
    threadMessagesCache[clientCode] = 'loading';
    loadThreadMessages(clientCode).then(() => renderShell());
    return `<div class="empty-state" style="padding:40px"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading messages...</h3></div>`;
  }
  if(threadMessagesCache[clientCode] === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;

  const messages = threadMessagesCache[clientCode] || [];

  const bubbles = messages.map(m => {
    const isMine = m.by_code === session.code;
    const roleColor = m.from_role === 'admin' ? 'warning' : m.from_role === 'manager' ? 'success' : m.from_role === 'client' ? 'coral' : 'muted';
    return `<div style="display:flex;flex-direction:column;${isMine ? 'align-items:flex-end' : 'align-items:flex-start'};margin-bottom:12px">
      <div class="chat-meta">${esc(m.by_name || m.by_code)} <span class="tag ${roleColor}" style="font-size:9px">${esc(m.from_role || '')}</span> · ${timeAgo(m.ts)}</div>
      <div class="chat-bubble ${isMine ? 'own' : 'other'}">${esc(m.body)}</div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px">No messages yet. Send the first one.</div>`;

  return `<div style="display:flex;flex-direction:column;height:100%">
    <div style="border-bottom:1px solid var(--bg-secondary);padding-bottom:12px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar lg coral">${esc(initials(clientName))}</div>
        <div>
          <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text-heading)">${esc(clientName)}</div>
          <div style="font-size:12px;color:var(--text-muted)">${messages.length} message${messages.length !== 1 ? 's' : ''}</div>
        </div>
      </div>
    </div>
    <div id="thread-scroll" style="flex:1;overflow-y:auto;padding:0 4px;min-height:300px">${bubbles}</div>
    <div style="display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--bg-secondary)">
      <input type="text" id="thread-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendThreadMsg('${esc(clientCode)}')">
      <button class="btn primary" onclick="sendThreadMsg('${esc(clientCode)}')">Send</button>
    </div>
  </div>`;

    <div class="field"><label>Group name</label><input id="cg-name" type="text" placeholder="e.g. Haritha Support Team"></div>
