    </div>`;
  }).join('') || `<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px">No messages yet. Send the first one.</div>`;

  const isBroadcast = g.is_broadcast || g.broadcast;
  const canSend = !isBroadcast || session.role === 'admin';

  // For a 2-person direct chat, show the OTHER person's name, not "X & Y"
  const isDirect = !isBroadcast && (g.member_count || 0) === 2 && (g.description === 'Direct chat' || (g.name && g.name.indexOf(' & ') !== -1));
  let headerName = g.name;
  if(isDirect && g.name && g.name.indexOf(' & ') !== -1){
    const parts = g.name.split(' & ');
    const mine = (session.name || '').trim();
    headerName = parts.find(p => p.trim() !== mine) || parts[parts.length - 1];
  }

  // Start auto-poll for this group so new messages arrive without refresh
  startChatPoll(g.id);

  return `<div style="display:flex;flex-direction:column;height:100%">
    <div style="border-bottom:1px solid var(--bg-secondary);padding-bottom:12px;margin-bottom:16px">
      <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text-heading)">${isBroadcast ? '📢 ' : ''}${esc(headerName)}</div>
      <div style="font-size:12px;color:var(--text-muted)">${isDirect ? 'Direct message' : (g.member_count || 0) + ' members'}${isBroadcast ? ' · Broadcast (admin-only send)' : ''}</div>
    </div>
    <div id="group-scroll" style="flex:1;overflow-y:auto;padding:0 4px;min-height:300px">${bubbles}</div>
    ${canSend ? `<div style="display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--bg-secondary)">
      <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg(${g.id})">
      <button class="btn primary" onclick="sendMsg(${g.id})">Send</button>
    </div>` : '<div style="padding-top:16px;color:var(--text-muted);font-size:12px;font-style:italic">Broadcast channel - only admins can send</div>'}
  </div>`;
}

let chatPollTimer = null;
let chatPollGroup = null;
function startChatPoll(groupId){
  // Restart only if switching groups
  if(chatPollGroup === groupId && chatPollTimer) return;
  stopChatPoll();
  chatPollGroup = groupId;
  chatPollTimer = setInterval(async () => {
    // Only poll while this exact group is still open on the Chat view
    if(currentView !== 'chats' || viewState.selectedChatKey !== 'group:' + groupId){ stopChatPoll(); return; }
    // Don't clobber text being typed
    const input = document.getElementById('msg-input');
    const typing = input && document.activeElement === input && input.value.trim().length > 0;
    try{
      const rr = await rpc('fn_a_group_messages', { p_group_id: groupId, p_limit: 100 });
      if(rr && rr.ok){
        const fresh = rr.messages || [];
        const cur = Array.isArray(viewState.groupMessages) ? viewState.groupMessages : [];
        // Only re-render if message count changed (new message arrived)
        if(fresh.length !== cur.length){
          viewState.groupMessages = fresh;
          const draft = typing ? input.value : '';
          renderShell();
          if(draft){ const ni = document.getElementById('msg-input'); if(ni){ ni.value = draft; ni.focus(); } }
          setTimeout(() => { const s = document.getElementById('group-scroll'); if(s) s.scrollTop = s.scrollHeight; }, 60);
        }
      }
    }catch(e){ /* silent */ }
  }, 3000);
}
function stopChatPoll(){
  if(chatPollTimer){ clearInterval(chatPollTimer); chatPollTimer = null; }
  chatPollGroup = null;
}

window.sendMsg = async function(groupId){
  const input = document.getElementById('msg-input');
  if(!input) return;
  const body = (input.value || '').trim();
  if(!body) return;
  input.value = '';
  try{
    const r = await rpc('fn_a_send_group_message', { p_group_id: groupId, p_body: body });
    if(r && r.ok){
      // Reload THIS group's messages, keep it selected
      const rr = await rpc('fn_a_group_messages', { p_group_id: groupId, p_limit: 100 });
      viewState.groupMessages = (rr && rr.ok) ? (rr.messages || []) : [];
      renderShell();
      setTimeout(() => { const s = document.getElementById('group-scroll'); if(s) s.scrollTop = s.scrollHeight; }, 100);
    } else { toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); input.value = body; }
  }catch(e){ toast('Failed: ' + e.message, 'error'); input.value = body; }
};

window.openEditOwnProfile = function(){

    { id:'name', label:'Full name', value:me.name },

    { id:'years_experience', label:'Years of experience', type:'number', value:me.years_experience },

    ] }
  ], async (v) => {
    try{
      const res = await rpc('fn_a_edit_own_client', {
        p_name: v.name || null, p_phone: v.phone || null, p_target_role: v.target_role || null,
        p_years_experience: v.years_experience ? parseFloat(v.years_experience) : null,

    }catch(e){ toast('Failed: ' + e.message, 'error'); return false; }

};

let clientAppsCache = null;
function renderClientApplicationsList(){
  if(clientAppsCache === null){
    rpc('fn_a_list_client_applications', {}).then(r => {
      clientAppsCache = (r && r.ok) ? (r.applications || []) : [];
      const container = document.getElementById('client-apps-list');
      if(container) container.innerHTML = renderClientApplicationsList();
    }).catch(() => { clientAppsCache = []; });
    return `<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px">⏳ Loading applications...</div>`;
  }
  if(!clientAppsCache.length){
    return `<div class="empty-state" style="padding:24px"><div class="empty-icon">📄</div><h3 class="empty-title">No applications yet</h3><p class="empty-text">Your recruiter will start logging applications soon.</p></div>`;
  }
  return clientAppsCache.map(a => {
    const latestStatus = Array.isArray(a.status_json) && a.status_json.length ? a.status_json[a.status_json.length - 1] : null;
    const statusLabel = latestStatus ? latestStatus.status : 'Applied';
    const statusClass = statusLabel.toLowerCase().includes('reject') ? 'danger' : statusLabel.toLowerCase().includes('interview') || statusLabel.toLowerCase().includes('call') ? 'warning' : statusLabel.toLowerCase().includes('offer') ? 'success' : 'teal';
    return `<div style="padding:14px 0;border-bottom:1px solid var(--bg-secondary);cursor:pointer" onclick="openAppDetail(${a.id})">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px">
        <div style="flex:1;min-width:0"><div style="font-family:var(--font-heading);font-weight:700;color:var(--text-heading);font-size:15px">${esc(a.job_title || 'Untitled role')}</div><div style="font-size:13px;color:var(--text-body)">${esc(a.company || 'Unknown company')}</div></div>
        <span class="tag ${statusClass}">${esc(statusLabel)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted)">
        <span>Applied ${timeAgo(a.applied_at)}</span>
        <span>${Array.isArray(a.status_json) ? a.status_json.length : 0} update${Array.isArray(a.status_json) && a.status_json.length !== 1 ? 's' : ''}</span>
      </div>
    </div>`;
  }).join('');
}

  try{
    const r = await rpc('fn_a_delete_application', { p_record_id: recordId });

      toast('Application deleted', 'success');

};

function renderResumeOrdersPage(){
  if(resumeOrdersCache === null){
    rpc('fn_a_list_resume_orders', {}).then(r => {
      resumeOrdersCache = (r && r.ok) ? (r.orders || []) : [];
      const c = document.getElementById('ro-list'); if(c) c.innerHTML = renderResumeOrdersList();
    }).catch(() => { resumeOrdersCache = []; });
  }
  const canCreate = session.role === 'admin';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 class="page-title" style="margin:0">Resume Orders</h1>
    ${canCreate ? '<button class="btn primary sm" onclick="openCreateResumeOrder()">➕ New order</button>' : ''}
  </div>
  <div id="ro-list">${renderResumeOrdersList()}</div>`;
}

function renderResumeOrdersList(){
  if(resumeOrdersCache === null) return `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">⏳ Loading orders...</div>`;
  if(!resumeOrdersCache.length) return `<div class="empty-state" style="padding:48px"><div class="empty-icon">📋</div><h3 class="empty-title">No resume orders yet</h3>${session.role === 'admin' ? '<p class="empty-text">Click "New order" to add one.</p>' : ''}</div>`;
  const statusClass = s => s === 'Delivered' ? 'success' : s === 'In progress' ? 'warning' : 'teal';
  const rows = resumeOrdersCache.map(o => `<tr>
    <td style="white-space:nowrap;font-size:12px">${esc(fmtDateTime(o.created_at))}</td>
    <td><b>${esc(o.client_name || '')}</b>${o.phone ? `<br><span style="font-size:11px;color:var(--text-muted)">${esc(o.phone)}</span>` : ''}</td>
    <td style="white-space:nowrap">${o.amount_paid != null ? money(o.amount_paid, o.currency || 'USD') : '—'}</td>
    <td style="white-space:nowrap;font-size:12px">${esc(o.assigned_to_name || '—')}</td>
    <td><span class="tag ${statusClass(o.status)}" style="font-size:10px">${esc(o.status || 'New')}</span></td>
    <td style="white-space:nowrap">${o.resume_file ? `<button class="btn ghost sm" onclick="openStoredFile('${esc(o.resume_file).replace(/'/g,'')}')">📄 Resume</button>` : '<span style="font-size:11px;color:var(--text-muted)">No file</span>'}</td>
    ${session.role === 'admin' ? `<td style="white-space:nowrap"><button class="btn ghost sm" onclick="openEditResumeOrder(${o.id})">✏️</button><button class="btn ghost sm" style="color:var(--color-danger)" onclick="deleteResumeOrder(${o.id})">🗑</button></td>` : ''}
  </tr>`).join('');
  return `<div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr style="text-align:left;border-bottom:2px solid var(--bg-secondary)">
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Date</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Client</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Paid</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Assigned</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">Status</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;color:var(--text-muted)">File</th>
      ${session.role === 'admin' ? '<th style="padding:8px"></th>' : ''}
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function resumeOrderFormFields(o){
  o = o || {};
  const team = (adminsList || []).filter(a => a.active !== false && a.deactivated_at == null && a.code && a.name);
  const teamOpts = [{value:'',label:'— Assign to —'}].concat(team.map(t => ({value:t.code, label:t.name})));
  const clientOpts = [{value:'',label:'— Pick existing client (optional) —'}].concat((S.clients || []).map(c => ({value:c.code, label:c.name})));
  return [
    { id:'client_code', label:'Existing client (optional)', type:'select', value:o.client_code || '', options:clientOpts },
    { id:'client_name', label:'Client name', value:o.client_name },
    { id:'phone', label:'Phone', type:'tel', value:o.phone },
    { id:'amount_paid', label:'Amount paid', type:'number', value:o.amount_paid },
    { id:'currency', label:'Currency', type:'select', value:o.currency || 'USD', options:[{value:'USD',label:'USD ($)'},{value:'INR',label:'INR (₹)'}] },
    { id:'assigned_to', label:'Assigned to', type:'select', value:o.assigned_to || '', options:teamOpts },
    { id:'status', label:'Status', type:'select', value:o.status || 'New', options:[{value:'New',label:'New'},{value:'In progress',label:'In progress'},{value:'Delivered',label:'Delivered'}] },
    { id:'resume_file', label:'Delivered resume (upload)', type:'file', uploadPrefix:'resume-orders', value:o.resume_file }
  ];
}

window.openCreateResumeOrder = async function(){
  try{ const r = await rpc('fn_a_list_admins', {}); adminsList = (r && r.ok) ? (r.admins || []) : (adminsList || []); }catch(e){}
  openEditModal('New resume order', resumeOrderFormFields({}), async (v) => {
    if(!v.client_name || !v.client_name.trim()){ toast('Client name required', 'error'); return false; }
    try{
      const r = await rpc('fn_a_create_resume_order', {
        p_client_code: v.client_code || null, p_client_name: v.client_name,
        p_phone: v.phone || null, p_amount_paid: v.amount_paid ? parseFloat(v.amount_paid) : null,
        p_currency: v.currency || 'USD', p_assigned_to: v.assigned_to || null,
        p_status: v.status || 'New', p_resume_file: v.resume_file || null
      });
      if(!r || !r.ok){ toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); return false; }
      resumeOrdersCache = null; toast('Order created', 'success'); renderShell(); return true;
    }catch(e){ toast('Failed: ' + e.message, 'error'); return false; }
  });
};

window.openEditResumeOrder = async function(id){
  try{ const r = await rpc('fn_a_list_admins', {}); adminsList = (r && r.ok) ? (r.admins || []) : (adminsList || []); }catch(e){}
  const o = (resumeOrdersCache || []).find(x => x.id === id);
  if(!o) return;
  openEditModal('Edit resume order', resumeOrderFormFields(o), async (v) => {
    try{
      const r = await rpc('fn_a_update_resume_order', {
        p_id: id, p_client_code: v.client_code || null, p_client_name: v.client_name || null,
        p_phone: v.phone || null, p_amount_paid: v.amount_paid ? parseFloat(v.amount_paid) : null,
        p_currency: v.currency || null, p_assigned_to: v.assigned_to || null,
        p_status: v.status || null, p_resume_file: v.resume_file || null
      });
      if(!r || !r.ok){ toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); return false; }
      resumeOrdersCache = null; toast('Order updated', 'success'); renderShell(); return true;
    }catch(e){ toast('Failed: ' + e.message, 'error'); return false; }
  });
};

window.deleteResumeOrder = async function(id){
  if(!await confirmModal('Delete this resume order?', { title:'Delete order', okLabel:'Delete', danger:true })) return;
  try{
    const r = await rpc('fn_a_delete_resume_order', { p_id: id });
    if(r && r.ok){ resumeOrdersCache = null; toast('Order deleted', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.openAppDetail = async function(recordId){
  // Check any cache we have that might contain this app
  const allCaches = [clientAppsCache, allAppsCache, recentAppsCache].filter(c => Array.isArray(c));
  let app = null;
  for(const cache of allCaches){
    app = cache.find(a => a.id === recordId);
    if(app) break;
  }
  if(!app){
    // Fetch fresh
    try{
      const r = await rpc('fn_a_list_all_applications', {});
      if(r && r.ok){
        app = (r.applications || []).find(a => a.id === recordId);
      }
    }catch(e){}
  }
  if(!app){ toast('Application not found', 'error'); return; }

  const statuses = Array.isArray(app.status_json) ? app.status_json : [];
  const statusRows = statuses.length ? statuses.map(s => `<div style="padding:10px 12px;border-left:3px solid var(--color-primary);margin-bottom:8px;background:var(--bg-primary);border-radius:0 8px 8px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
      <b style="color:var(--text-heading);font-size:14px">${esc(s.status)}</b>
      <span style="font-size:11px;color:var(--text-muted)">${timeAgo(s.at)}</span>
    </div>
    <div style="font-size:12px;color:var(--text-body);margin-bottom:2px">${esc(s.by || 'Unknown')} · <span class="tag muted" style="font-size:10px">${esc(s.role || '')}</span></div>
    ${s.note ? `<div style="font-size:13px;color:var(--text-body);margin-top:4px">${esc(s.note)}</div>` : ''}
    ${s.screenshot_url ? `<a href="${esc(s.screenshot_url)}" target="_blank" style="font-size:12px;color:var(--color-primary);display:inline-block;margin-top:4px">📎 View screenshot</a>` : ''}
  </div>`).join('') : '<div style="color:var(--text-muted);font-size:13px">No status updates yet.</div>';

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal-inner" style="max-width:640px;max-height:85vh;display:flex;flex-direction:column">
    <h3>${esc(app.job_title || 'Application')}</h3>
    <div style="color:var(--text-body);font-size:14px;margin-bottom:16px"><b>${esc(app.company || 'Unknown company')}</b>${app.source ? ' · ' + esc(app.source) : ''}${(app.created_at || app.applied_at) ? ' · Applied ' + esc(fmtDateTime(app.created_at || app.applied_at)) : ''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      ${app.job_url ? `<a href="${esc(app.job_url)}" target="_blank" class="btn ghost sm">🔗 View job posting</a>` : '<span style="font-size:12px;color:var(--text-muted);padding:6px 12px">No job posting link</span>'}
      <button onclick="downloadResume(${app.id}, '${esc(app.resume_used || '').replace(/'/g,'')}')" class="btn ghost sm">📄 Download resume used</button>
      ${app.screenshot_url ? `<button onclick="openStoredFile('${esc(app.screenshot_url).replace(/'/g,'')}')" class="btn ghost sm">📎 Original screenshot</button>` : ''}
      ${session.role === 'admin' ? `<button onclick="deleteApplication(${app.id})" class="btn ghost sm" style="color:var(--color-danger);margin-left:auto">🗑 Delete</button>` : ''}
    </div>
    <div style="border-top:1px solid var(--bg-secondary);padding-top:16px;margin-bottom:12px">
      <h4 style="font-family:var(--font-heading);font-weight:700;color:var(--text-heading);font-size:14px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px">Status Timeline</h4>
      <div style="max-height:280px;overflow-y:auto">${statusRows}</div>
    </div>
    <div style="border-top:1px solid var(--bg-secondary);padding-top:16px">
      <div class="field"><label>Add status update</label><select id="apd-status" style="margin-bottom:8px"><option value="">Choose status...</option><option>Recruiter called me</option><option>Vendor emailed</option><option>Phone screen scheduled</option><option>Technical interview scheduled</option><option>Onsite scheduled</option><option>Rejected</option><option>Offer received</option><option>Accepted offer</option><option>Withdrew</option><option>Follow-up sent</option></select></div>
      <div class="field"><textarea id="apd-note" placeholder="Notes (e.g. 'Recruiter said next round is Tuesday at 3pm')" rows="2"></textarea></div>
      <div class="field"><label style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Screenshot of email/message (optional)</label><input id="apd-screenshot-file" type="file" accept="image/*" style="padding:8px;background:var(--bg-primary);border:1px solid var(--bg-secondary);border-radius:8px;width:100%;font-family:var(--font-body);font-size:13px"></div>
    </div>
    <div class="modal-actions"><button class="btn ghost" id="apd-close">Close</button><button class="btn primary" id="apd-add">Add status update</button></div>
  </div>`;
  document.body.appendChild(back);
  const cleanup = () => back.remove();
  back.querySelector('#apd-close').onclick = cleanup;
  back.onclick = e => { if(e.target === back) cleanup(); };
  back.querySelector('#apd-add').onclick = async () => {
    const status = document.getElementById('apd-status').value;
    const note = document.getElementById('apd-note').value;
    const screenshotFileInput = document.getElementById('apd-screenshot-file');
    const screenshotFile = screenshotFileInput ? screenshotFileInput.files[0] : null;
    if(!status){ toast('Choose a status first', 'error'); return; }

    let screenshotUrl = null;
    if(screenshotFile){
      if(screenshotFile.size > 5 * 1024 * 1024){ toast('Screenshot must be under 5 MB', 'error'); return; }
      if(!screenshotFile.type.startsWith('image/')){ toast('Screenshot must be an image', 'error'); return; }
      toast('Uploading screenshot...', 'success');
      // Authenticated client so storage RLS sees the user
      const sess = await sb.auth.getSession();
      const tok = sess && sess.data && sess.data.session;
      if(!tok || !tok.access_token){ toast('Session expired, log out and back in.', 'error'); return; }
      const sbAuthed = window.supabase.createClient(SB_URL, SB_KEY, {
        global: { headers: { Authorization: 'Bearer ' + tok.access_token } },
        auth: { persistSession: false, autoRefreshToken: false }
      });
      const clientCode = app.client_code || 'unknown';
      const timestamp = Date.now();
      const safeName = screenshotFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${clientCode}/${timestamp}-status-${safeName}`;
      const { data: shotUpload, error: shotError } = await sbAuthed.storage.from('client-resumes').upload(path, screenshotFile);
      if(shotError){ toast('Screenshot upload failed: ' + shotError.message, 'error'); return; }
      const { data: signedData } = await sbAuthed.storage.from('client-resumes').createSignedUrl(shotUpload.path, 60 * 60 * 24 * 365);
      screenshotUrl = signedData ? signedData.signedUrl : shotUpload.path;
    }

    try{
      const r = await rpc('fn_a_add_application_status', { p_record_id: recordId, p_status: status, p_note: note || null, p_screenshot_url: screenshotUrl });
      if(r && r.ok){
        clientAppsCache = null;
        allAppsCache = null;
        recentAppsCache = null;
        toast('Status added', 'success');
        cleanup();
        renderShell();
      } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
    }catch(e){ toast('Failed: ' + e.message, 'error'); }
  };
};

window.submitApplication = async function(){
  const clientCode = document.getElementById('app-client').value;
  const company = document.getElementById('app-company').value.trim();
  const jobTitle = document.getElementById('app-job-title').value.trim();
  const jobUrl = document.getElementById('app-job-url').value.trim();
  const source = (document.getElementById('app-type') || {}).value || 'application';
  const resumeFileInput = document.getElementById('app-resume');
  const resumeFile = resumeFileInput ? resumeFileInput.files[0] : null;
  const screenshotFileInput = document.getElementById('app-screenshot');
  const screenshotFile = screenshotFileInput ? screenshotFileInput.files[0] : null;

  if(!clientCode){ toast('Choose a client first', 'error'); return; }
  if(!company){ toast('Company name is required', 'error'); return; }
  if(!jobTitle){ toast('Job title is required', 'error'); return; }
  if(!resumeFile){ toast('Please attach a resume file', 'error'); return; }

  // Validate resume
  if(resumeFile.size > 10 * 1024 * 1024){ toast('Resume must be under 10 MB', 'error'); return; }
  const allowedResume = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
  if(!allowedResume.includes(resumeFile.type) && !/\.(pdf|doc|docx)$/i.test(resumeFile.name)){
    toast('Only PDF, DOC, or DOCX resumes allowed', 'error'); return;
  }

  // Validate screenshot if provided
  if(screenshotFile){
    if(screenshotFile.size > 5 * 1024 * 1024){ toast('Screenshot must be under 5 MB', 'error'); return; }
    if(!screenshotFile.type.startsWith('image/')){ toast('Screenshot must be an image file', 'error'); return; }
  }

  try{
    toast('Uploading files...', 'success');

    // Verify we have a live session (do NOT call setSession - it can force a
    // token refresh that 403s and logs the user out mid-upload)
    let _accessToken = null;
    try{
      const sess = await sb.auth.getSession();
      const tok = sess && sess.data && sess.data.session;
      if(!tok || !tok.access_token){
        toast('Your session expired. Please log out and back in, then retry.', 'error');
        return;
      }
      _accessToken = tok.access_token;
    }catch(e){
      toast('Auth check failed. Log out and back in, then retry.', 'error');
      return;
    }

    // Authenticated storage client - passes the user's JWT so RLS sees them
    const sbAuthed = window.supabase.createClient(SB_URL, SB_KEY, {
      global: { headers: { Authorization: 'Bearer ' + _accessToken } },
      auth: { persistSession: false, autoRefreshToken: false }
    });

    // Step 1: Upload resume to Supabase Storage
    const timestamp = Date.now();
    const safeResumeName = resumeFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const resumePath = `${clientCode}/${timestamp}-resume-${safeResumeName}`;
    const { data: resumeUpload, error: resumeError } = await sbAuthed.storage.from('client-resumes').upload(resumePath, resumeFile);
    if(resumeError){
      toast('Resume upload failed: ' + resumeError.message + '. Check the client-resumes bucket exists.', 'error');
      return;
    }
    const { data: resumeSignedData } = await sbAuthed.storage.from('client-resumes').createSignedUrl(resumeUpload.path, 60 * 60 * 24 * 365);
    const resumeUrl = resumeSignedData ? resumeSignedData.signedUrl : resumeUpload.path;

    // Step 2: Upload screenshot if provided (uses same bucket, different subfolder)
    let screenshotUrl = null;
    if(screenshotFile){
      const safeScreenshotName = screenshotFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const screenshotPath = `${clientCode}/${timestamp}-screenshot-${safeScreenshotName}`;
      const { data: shotUpload, error: shotError } = await sbAuthed.storage.from('client-resumes').upload(screenshotPath, screenshotFile);
      if(shotError){
        toast('Screenshot upload failed: ' + shotError.message, 'error');
        return;
      }
      const { data: shotSignedData } = await sbAuthed.storage.from('client-resumes').createSignedUrl(shotUpload.path, 60 * 60 * 24 * 365);
      screenshotUrl = shotSignedData ? shotSignedData.signedUrl : shotUpload.path;
    }

    // Step 3: Create the application record
    const r = await rpc('fn_a_add_application', {
      p_client_code: clientCode, p_company: company, p_job_title: jobTitle,
      p_job_description: null, p_job_url: jobUrl || null,
      p_source: source || null, p_resume_used: resumeUrl, p_screenshot_url: screenshotUrl
    });
    if(r && r.ok){
      toast('Application dispatched with resume' + (screenshotUrl ? ' and screenshot' : '') + '!', 'success');
      recentAppsCache = null;
      allAppsCache = null;
      clientAppsCache = null;
      viewState.dispatchedToday = (viewState.dispatchedToday || 0) + 1;
      clearAppForm();
      renderShell();
    } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.uploadEditFile = async function(fieldId, prefix){
  const fileInput = document.getElementById('emfile-' + fieldId);
  const urlInput = document.getElementById('em-' + fieldId);
  const status = document.getElementById('emfilestatus-' + fieldId);
  const file = fileInput && fileInput.files[0];
  if(!file){ if(status){ status.textContent = 'Choose a file first.'; status.style.color = 'var(--color-danger)'; } return; }
  if(file.size > 10 * 1024 * 1024){ if(status){ status.textContent = 'File must be under 10 MB.'; status.style.color = 'var(--color-danger)'; } return; }
  if(status){ status.textContent = 'Uploading...'; status.style.color = 'var(--text-muted)'; }
  try{
    const sess = await sb.auth.getSession();
    const tok = sess && sess.data && sess.data.session;
    if(!tok || !tok.access_token){ if(status){ status.textContent = 'Session expired, log out and back in.'; status.style.color = 'var(--color-danger)'; } return; }
    const sbAuthed = window.supabase.createClient(SB_URL, SB_KEY, {
      global: { headers: { Authorization: 'Bearer ' + tok.access_token } },
      auth: { persistSession: false, autoRefreshToken: false }
    });
    const ts = Date.now();
    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${prefix}/${ts}-${safe}`;
    const { data: up, error: upErr } = await sbAuthed.storage.from('client-resumes').upload(path, file);
    if(upErr){ if(status){ status.textContent = 'Upload failed: ' + upErr.message; status.style.color = 'var(--color-danger)'; } return; }
    const { data: signed } = await sbAuthed.storage.from('client-resumes').createSignedUrl(up.path, 60 * 60 * 24 * 365);
    const url = signed ? signed.signedUrl : up.path;
    if(urlInput) urlInput.value = url;
    if(status){ status.textContent = '✓ Uploaded: ' + file.name; status.style.color = 'var(--color-success)'; }
  }catch(e){ if(status){ status.textContent = 'Upload error: ' + e.message; status.style.color = 'var(--color-danger)'; } }
};

function openEditModal(title, fields, onSubmit){
  const back = document.createElement('div');
  back.className = 'modal-back';
  const rows = fields.map(f => {
    if(f.type === 'select'){
      const opts = f.options.map(o => `<option value="${esc(o.value)}" ${o.value === f.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
      return `<div class="field"><label>${esc(f.label)}</label><select id="em-${f.id}">${opts}</select></div>`;
    }
    if(f.type === 'file'){
      // URL text field + upload button that fills it
      return `<div class="field" style="grid-column:1/-1"><label>${esc(f.label)}</label>
        <input id="em-${f.id}" type="text" value="${esc(f.value == null ? '' : f.value)}" placeholder="Paste a link, or upload a file →" style="margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <input type="file" id="emfile-${f.id}" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="font-size:12px;flex:1">
          <button type="button" class="btn ghost sm" onclick="uploadEditFile('${f.id}','${esc(f.uploadPrefix || 'misc')}')">⬆ Upload</button>
        </div>
        <div id="emfilestatus-${f.id}" style="font-size:11px;color:var(--text-muted);margin-top:4px"></div>
      </div>`;
    }
    if(f.type === 'readonly'){
      return `<div class="field"><label>${esc(f.label)}</label><input type="text" value="${esc(f.value == null || f.value === '' ? 'Not set' : f.value)}" disabled style="background:var(--bg-secondary);color:var(--text-muted);cursor:not-allowed"><div style="font-size:10px;color:var(--text-muted);margin-top:3px">Contact an admin to change this</div></div>`;
    }
    return `<div class="field"><label>${esc(f.label)}</label><input id="em-${f.id}" type="${f.type || 'text'}" value="${esc(f.value == null ? '' : f.value)}" placeholder="${esc(f.placeholder || '')}"></div>`;
  }).join('');
  back.innerHTML = `<div class="modal-inner" style="max-width:640px"><h3>${esc(title)}</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0">${rows}</div><div class="modal-actions"><button class="btn ghost" id="em-cancel">Cancel</button><button class="btn primary" id="em-save">Save changes</button></div></div>`;
  document.body.appendChild(back);
  const cleanup = () => back.remove();
  back.querySelector('#em-cancel').onclick = cleanup;
  back.onclick = e => { if(e.target === back) cleanup(); };
  back.querySelector('#em-save').onclick = async () => {
    const values = {};
    fields.forEach(f => { const el = document.getElementById('em-' + f.id); if(el) values[f.id] = el.value.trim(); });
    const ok = await onSubmit(values);
    if(ok) cleanup();
  };
}

window.openAssignClients = function(recruiterCode){
  const rec = (S.recruiters || []).find(x => x.code === recruiterCode);
  if(!rec) return;
  const allClients = (S.clients || []).filter(c => !c.deactivated_at);
  const currentAssignments = new Set(rec.assigned || []);

  const back = document.createElement('div');
  back.className = 'modal-back';
  const clientRows = allClients.map(c => `<label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;background:var(--bg-primary);margin-bottom:6px">
    <input type="checkbox" class="asn-client" value="${esc(c.code)}" ${currentAssignments.has(c.code) ? 'checked' : ''} style="width:auto">
    <div class="avatar sm coral">${esc(initials(c.name))}</div>
    <div style="flex:1"><div style="font-weight:600;font-size:14px;color:var(--text-heading)">${esc(c.name)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.target_role || 'No target role')}</div></div>
  </label>`).join('') || '<div style="color:var(--text-muted);font-size:13px">No active clients yet.</div>';

  back.innerHTML = `<div class="modal-inner" style="max-width:560px;max-height:85vh;display:flex;flex-direction:column">
    <h3>Assign clients to ${esc(rec.name)}</h3>
    <p style="color:var(--text-body);font-size:13px;margin-bottom:14px">Check the clients this recruiter will handle. Unchecking removes them.</p>
    <div style="flex:1;overflow-y:auto;max-height:400px;padding:4px">${clientRows}</div>
    <div class="modal-actions"><button class="btn ghost" id="asn-cancel">Cancel</button><button class="btn primary" id="asn-save">Save assignments</button></div>
  </div>`;
  document.body.appendChild(back);
  const cleanup = () => back.remove();
  back.querySelector('#asn-cancel').onclick = cleanup;
  back.onclick = e => { if(e.target === back) cleanup(); };
  back.querySelector('#asn-save').onclick = async () => {
    const newAssignments = Array.from(document.querySelectorAll('.asn-client:checked')).map(el => el.value);
    // Determine adds and removes
    const toAdd = newAssignments.filter(c => !currentAssignments.has(c));
    const toRemove = Array.from(currentAssignments).filter(c => !newAssignments.includes(c));
    try{
      for(const clientCode of toAdd){
        await rpc('fn_a_toggle_assign', { p_recruiter: recruiterCode, p_client: clientCode });
      }
      for(const clientCode of toRemove){
        await rpc('fn_a_toggle_assign', { p_recruiter: recruiterCode, p_client: clientCode });
      }
      await refresh();
      toast('Assignments updated', 'success');
      cleanup();
      renderShell();
    }catch(e){ toast('Failed: ' + e.message, 'error'); }
  };
};

let dmContactsAttempted = false;

async function loadDmContacts(){
  dmContactsAttempted = true;
  try{
    const r = await rpc('fn_a_dm_contacts', {});
    if(r && r.ok){ dmContactsCache = r; return r; }
  }catch(e){ console.warn('loadDmContacts failed:', e); }
  return null;
}

async function loadChatPeople(){
  if(chatPeopleCache) return chatPeopleCache;
  chatPeopleAttempted = true;
  try{
    const r = await rpc('fn_list_chat_people', {});
    if(r && r.ok){
      chatPeopleCache = r;
      return r;
    }
  }catch(e){ console.warn('loadChatPeople failed:', e); }
  return null; // Don't cache empty - let fallback kick in
}

function getChatablePeople(){
  // Prefer the full roster from fn_list_chat_people if loaded and non-empty
  const roster = chatPeopleCache;
  let admins = [], managers = [], recruiters = [], clients = [];

  const rosterHasPeople = roster && (
    (roster.admins || []).length +
    (roster.managers || []).length +
    (roster.recruiters || []).length +
    (roster.clients || []).length > 0
  );

  if(rosterHasPeople){
    admins = (roster.admins || []).map(a => ({ code: a.code, name: a.name, role: 'admin' }));
    managers = (roster.managers || []).map(m => ({ code: m.code, name: m.name, role: 'manager' }));
    recruiters = (roster.recruiters || []).map(r => ({ code: r.code, name: r.name, role: 'recruiter' }));
    clients = (roster.clients || []).map(c => ({ code: c.code, name: c.name, role: 'client' }));
  } else {
    // Fallback: use S data (works for admin since fn_get_state returns full roster)
    const cs = (S.clients || []).filter(c => !c.deactivated_at);
    const rs = (S.recruiters || []).filter(r => !r.deactivated_at);
    const ms = (S.managers || []).filter(m => !m.deactivated_at);
    const adminsL = (adminsList || []).filter(a => a.active);
    admins = adminsL.map(a => ({ code: a.code, name: a.name, role: 'admin' }));
    managers = ms.map(m => ({ code: m.code, name: m.name, role: 'manager' }));
    recruiters = rs.map(r => ({ code: r.code, name: r.name, role: 'recruiter' }));
    clients = cs.map(c => ({ code: c.code, name: c.name, role: 'client' }));
  }

  const all = [...admins, ...managers, ...recruiters, ...clients];
  const withoutSelf = all.filter(p => p.code !== session.code);

  // Client can only see admin/manager/recruiter (NOT other clients)
  if(session.role === 'client'){
    return withoutSelf.filter(p => p.role !== 'client');
  }
  // Everyone else sees all
  return withoutSelf;
}
window.deleteMember = async function(type, code, name){
  const ok = await askConfirm('PERMANENTLY DELETE ' + name + '?\n\nThis removes the record. Their historical activity may still show in reports if referenced. This cannot be undone.\n\nType-safe alternative: use Deactivate instead.', 'Delete ' + name + ' forever?');
  if(!ok) return;
  try{
    const r = await rpc('fn_a_delete_member', { p_type: type, p_code: code });
    if(r && r.ok){
      if(type === 'admin'){ adminsList = null; }
      await refresh();
      toast('Deleted', 'success');
      // If we deleted the client/recruiter we were viewing, go back to list
      if(currentView === 'client-detail' || currentView === 'recruiter-detail'){
        currentView = type + 's';
        viewState = {};
      }
      renderShell();
    } else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.openEditManager = function(code){
  const m = (S.managers || []).find(x => x.code === code);
  if(!m) return;
  openEditModal('Edit ' + m.name, [
    { id:'name', label:'Full name', value:m.name },
    { id:'email', label:'Email', type:'email', value:m.email },
    { id:'phone', label:'Phone', type:'tel', value:m.phone },
    { id:'payroll_amount', label:'Payroll amount', type:'number', value:m.payroll_amount },
    { id:'payroll_currency', label:'Currency', type:'select', value:m.payroll_currency || 'INR', options:[{value:'INR',label:'INR (₹)'},{value:'USD',label:'USD ($)'}] },
    { id:'payroll_cycle_day', label:'Cycle day (1-28)', type:'number', value:m.payroll_cycle_day }
  ], async (v) => {
    try{
      const res = await rpc('fn_a_edit_manager', {
        p_code: code, p_name: v.name || null, p_email: v.email || null, p_phone: v.phone || null,
        p_payroll_amount: v.payroll_amount ? parseFloat(v.payroll_amount) : null,
        p_payroll_currency: v.payroll_currency || null,
        p_payroll_cycle_day: v.payroll_cycle_day ? parseInt(v.payroll_cycle_day) : null
      });
      if(!res || !res.ok){ toast('Failed: ' + ((res && res.err) || 'unknown'), 'error'); return false; }
      await refresh();
      toast('Manager updated', 'success');
      renderShell();
      return true;
    }catch(e){ toast('Failed: ' + e.message, 'error'); return false; }
  });
};

/* ═══════ APPLICATIONS PAGE (admin/manager/recruiter) ═══════ */
let allAppsCache = null;
function renderApplicationsPage(){
  const filterClient = viewState.appFilterClient || '';
  const filterSource = viewState.appFilterSource || '';
  const filterFrom = viewState.appFilterFrom || '';
  const filterTo = viewState.appFilterTo || '';

  if(allAppsCache === null){
    allAppsCache = 'loading';
    rpc('fn_a_list_all_applications', {
      p_client_code: filterClient || null,
      p_from_date: filterFrom || null,
      p_to_date: filterTo || null
    }).then(r => {
      allAppsCache = (r && r.ok) ? (r.applications || []) : [];
      renderShell();
    }).catch(() => { allAppsCache = []; renderShell(); });
    return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading applications...</h3></div>`;
  }
  if(allAppsCache === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;

  // Filter apps by latest status client-side (filterSource is actually status now)
  let apps = allAppsCache || [];
  if(filterSource){
    apps = apps.filter(a => {
      const statuses = Array.isArray(a.status_json) ? a.status_json : [];
      const latest = statuses.length ? statuses[statuses.length - 1] : null;
      const statusLabel = latest ? latest.status : 'Applied';
      return statusLabel === filterSource;
    });
  }
  const clientOptions = (S.clients || []).map(c => `<option value="${esc(c.code)}" ${filterClient === c.code ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const statusOptions = ['Applied','Recruiter called me','Vendor emailed','Phone screen scheduled','Technical interview scheduled','Onsite scheduled','Rejected','Offer received','Accepted offer','Withdrew'].map(s => `<option value="${esc(s)}" ${filterSource === s ? 'selected' : ''}>${esc(s)}</option>`).join('');

  // Stats
  const totalApps = apps.length;
  const statusBreakdown = {};
  apps.forEach(a => {
    const latest = Array.isArray(a.status_json) && a.status_json.length ? a.status_json[a.status_json.length - 1] : null;
    const status = latest ? latest.status : 'Applied';
    statusBreakdown[status] = (statusBreakdown[status] || 0) + 1;
  });
  const responses = apps.filter(a => Array.isArray(a.status_json) && a.status_json.some(s => /call|interview|offer|screen/i.test(s.status || ''))).length;
  const responseRate = totalApps > 0 ? Math.round((responses / totalApps) * 100) : 0;

  // Sort newest first, render as a compact table (one row per application)
  const sorted = apps.slice().sort((a,b) => {
    const ta = new Date((a.created_at || a.applied_at || '')).getTime() || 0;
    const tb = new Date((b.created_at || b.applied_at || '')).getTime() || 0;
    return tb - ta;
  });

  const showClientCol = session.role !== 'client';
  const rows = sorted.map(a => {
    const latestStatus = Array.isArray(a.status_json) && a.status_json.length ? a.status_json[a.status_json.length - 1] : null;
    const statusLabel = latestStatus ? latestStatus.status : 'Applied';
    const sl = statusLabel.toLowerCase();
    const statusClass = sl.includes('reject') ? 'danger' : (sl.includes('interview') || sl.includes('call') || sl.includes('screen')) ? 'warning' : sl.includes('offer') || sl.includes('accept') ? 'success' : 'teal';
    const client = (S.clients || []).find(c => c.code === a.client_code);
    const clientNm = client ? client.name : (a.client_code || '');
    const recruiterDisplay = a.recruiter_name || (S.recruiters || []).find(r => r.code === a.recruiter_code)?.name || '';
    const when = a.created_at || a.applied_at;
    return `<tr onclick="openAppDetail(${a.id})" style="cursor:pointer">
      <td style="white-space:nowrap;font-size:12px;color:var(--text-body)">${esc(fmtDateTime(when))}</td>
      ${showClientCol ? `<td style="white-space:nowrap">${esc(clientNm)}</td>` : ''}
      <td><b>${esc(a.company || 'Unknown')}</b><br><span style="color:var(--text-muted);font-size:12px">${esc(a.job_title || 'Untitled role')}</span></td>
      <td><span class="tag ${statusClass}" style="font-size:10px;padding:3px 8px">${esc(statusLabel)}</span></td>
      <td style="white-space:nowrap;font-size:12px;color:var(--text-body)">${esc(recruiterDisplay) || '—'}</td>
    </tr>`;
  }).join('');

  const table = sorted.length ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
    <thead><tr style="text-align:left;border-bottom:2px solid var(--bg-secondary)">
      <th style="padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Date & Time</th>
      ${showClientCol ? '<th style="padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Client</th>' : ''}
      <th style="padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Company / Role</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Status</th>
      <th style="padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted)">Recruiter</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty-state" style="padding:48px"><div class="empty-icon">📄</div><h3 class="empty-title">No applications yet</h3><p class="empty-text">${session.role === 'recruiter' ? 'Log your first application from the "Log Application" tab.' : 'Applications will appear here once recruiters start logging them.'}</p></div>`;

  const clientCards = table;

  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:16px;flex-wrap:wrap">
    <div>
      <h1 style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--text-heading);letter-spacing:-0.02em;text-transform:uppercase;margin:0">${session.role === 'recruiter' ? 'My Applications' : 'All Applications'}</h1>
      <p style="color:var(--text-body);font-size:13px;margin-top:4px">${totalApps} application${totalApps !== 1 ? 's' : ''} · ${responses} response${responses !== 1 ? 's' : ''} · ${responseRate}% response rate</p>
    </div>
    ${session.role === 'recruiter' ? `<button class="btn primary" onclick="setView('log')">➕ Dispatch new</button>` : ''}
  </div>

  <!-- Filters -->
  <div style="background:var(--bg-card);border-radius:12px;padding:16px;margin-bottom:20px;display:flex;gap:12px;align-items:end;flex-wrap:wrap">
    ${session.role !== 'recruiter' ? `<div style="min-width:180px;flex:1"><label style="display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px">Client</label><select id="app-filter-client"><option value="">All clients</option>${clientOptions}</select></div>` : ''}
    <div style="min-width:140px;flex:1"><label style="display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px">Status</label><select id="app-filter-source"><option value="">All statuses</option>${statusOptions}</select></div>
    <div style="min-width:130px;flex:1"><label style="display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px">From</label><input type="date" id="app-filter-from" value="${esc(filterFrom)}"></div>
    <div style="min-width:130px;flex:1"><label style="display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px">To</label><input type="date" id="app-filter-to" value="${esc(filterTo)}"></div>
    <button class="btn primary" onclick="applyAppFilter()">🔍 Filter</button>
    ${(filterClient || filterSource || filterFrom || filterTo) ? '<button class="btn ghost" onclick="clearAppFilter()">Clear</button>' : ''}
  </div>

  ${clientCards}`;
}

window.applyAppFilter = function(){
  const cf = document.getElementById('app-filter-client');
  viewState.appFilterClient = cf ? cf.value : '';
  viewState.appFilterSource = document.getElementById('app-filter-source').value;
  viewState.appFilterFrom = document.getElementById('app-filter-from').value;
  viewState.appFilterTo = document.getElementById('app-filter-to').value;
  allAppsCache = null;
  renderShell();
};
window.clearAppFilter = function(){
  viewState.appFilterClient = viewState.appFilterSource = viewState.appFilterFrom = viewState.appFilterTo = '';
  allAppsCache = null;
  renderShell();
};

/* ═══════ BOOT ═══════ */
(async function boot(){
  $('#app').innerHTML = '<div style="text-align:center;padding-top:20vh"><h2 style="font-family:var(--font-display);font-weight:800;color:var(--text-heading)">Loading...</h2></div>';

  const hash = window.location.hash || '';
  const isInvite = hash.includes('type=invite') || hash.includes('type=signup');
  const isRecovery = hash.includes('type=recovery');
  if(isInvite || isRecovery){
    try{
      await new Promise(r => setTimeout(r, 400));
      const { data: { session: s } } = await sb.auth.getSession();
      if(s){ renderSetPassword(isInvite ? 'Welcome to ApplyDesk! Choose a password to finish setting up your account.' : 'Choose your new password.'); return; }
    }catch(e){}
  }

  try{
    const { data: { session: s } } = await sb.auth.getSession();
    if(s && s.access_token){
      const who = await rpcRaw('fn_whoami', {}, s.access_token);
      if(who && who.ok){
        authMode = 'supabase';
        session = { code: who.role_code || '', role: who.role, name: who.name, email: s.user ? s.user.email : '' };
        await refresh();
        rerender();
        return;
      }
    }
  }catch(e){}

  const saved = sessionStorage.getItem('ad-code');
  if(saved){
    try{
      const res = await rpc('fn_login', { p_code: saved });
      if(res.ok){
        authMode = 'legacy';
        session = { code: saved, role: res.role, name: res.name };
        await refresh();
        rerender();
        return;
      }
    }catch(e){}
  }
  renderLogin();
})();
</script>
