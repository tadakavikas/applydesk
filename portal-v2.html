<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApplyDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   APPLYDESK V2 - DESIGN TOKENS (WARM PALETTE FROM FIGMA)
═══════════════════════════════════════════════════════════════ */
:root{
  --bg-primary: #FFF8F0;
  --bg-card: #FFFFFF;
  --bg-secondary: #FFF1EC;
  --color-primary: #FF6B47;
  --color-primary-hover: #E5502D;
  --color-secondary: #0F7871;
  --color-secondary-hover: #0A5854;
  --color-success: #7CB342;
  --color-warning: #FFC53D;
  --color-danger: #C9264A;
  --text-heading: #1A1F2E;
  --text-body: #5A6478;
  --text-muted: #8B94A6;
  --bg-success-light: #EFF5DA;
  --bg-teal-light: #E6F2F1;
  --bg-warning-light: #FFF3D0;
  --bg-coral-light: #FFE4DA;
  --bg-danger-light: #FDE7EC;
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-heading: 'Inter', system-ui, sans-serif;
  --font-body: 'Geist', 'Inter', system-ui, sans-serif;
  --sidebar-w: 240px;
  --topbar-h: 72px;
  --shadow-sm: 0 1px 2px rgba(26,31,46,0.04);
  --shadow-md: 0 4px 12px rgba(26,31,46,0.06);
  --shadow-lg: 0 8px 32px rgba(26,31,46,0.08);
  --shadow-coral: 0 6px 20px rgba(255,107,71,0.25);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-2xl: 20px;
  --radius-full: 100px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-body);background:var(--bg-primary);color:var(--text-body);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);color:var(--text-heading);font-weight:700;letter-spacing:-0.015em;line-height:1.2}
h1{font-family:var(--font-display);font-weight:800}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--color-primary);text-decoration:none;font-weight:500}
a:hover{color:var(--color-primary-hover)}

/* Busy indicator */
#busy{position:fixed;top:16px;right:16px;background:var(--color-primary);color:#fff;border-radius:8px;padding:8px 16px;font-weight:600;font-size:12px;z-index:200;display:none;box-shadow:var(--shadow-coral);letter-spacing:0.04em;text-transform:uppercase}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border:1.5px solid transparent;border-radius:8px;font-family:var(--font-heading);font-weight:600;font-size:14px;cursor:pointer;transition:all .15s ease;background:var(--bg-card);color:var(--text-heading);border-color:var(--bg-secondary);line-height:1.2;text-align:center;white-space:nowrap}
.btn:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn.primary{background:var(--color-primary);color:#fff;border-color:var(--color-primary);box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--color-primary-hover);border-color:var(--color-primary-hover);color:#fff;box-shadow:var(--shadow-coral)}
.btn.secondary{background:var(--color-secondary);color:#fff;border-color:var(--color-secondary)}
.btn.secondary:hover{background:var(--color-secondary-hover);border-color:var(--color-secondary-hover);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-body)}
.btn.ghost:hover{background:var(--bg-secondary);color:var(--text-heading)}
.btn.danger{background:transparent;color:var(--color-danger);border-color:#F5C8D3}
.btn.danger:hover{background:var(--color-danger);color:#fff;border-color:var(--color-danger)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.lg{padding:14px 24px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Inputs */
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 14px;background:var(--bg-primary);border:1.5px solid var(--bg-secondary);border-radius:8px;font-size:14px;color:var(--text-heading);transition:all .15s ease;outline:none;font-family:var(--font-body)}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);background:var(--bg-card);box-shadow:0 0 0 3px rgba(255,107,71,0.1)}
textarea{resize:vertical;min-height:80px}

.field{margin-bottom:16px}
.field label{display:block;font-family:var(--font-heading);font-size:12px;font-weight:600;color:var(--text-heading);margin-bottom:6px;letter-spacing:0.02em}

/* ═══════ LOGIN SCREEN ═══════ */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--bg-primary) 0%,var(--bg-secondary) 100%)}
.login-card{background:var(--bg-card);border-radius:24px;padding:48px 40px;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:22px;box-shadow:var(--shadow-coral)}
.login-logo-text{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text-heading);letter-spacing:-0.02em}
.login-title{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);margin-bottom:8px;letter-spacing:-0.025em}
.login-subtitle{color:var(--text-body);font-size:14px;margin-bottom:32px}
.login-alert{background:var(--bg-danger-light);color:var(--color-danger);padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;margin-bottom:16px}
.login-divider{position:relative;text-align:center;margin:24px 0 16px}
.login-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--bg-secondary)}
.login-divider span{position:relative;background:var(--bg-card);padding:0 12px;font-size:12px;color:var(--text-muted);font-family:var(--font-heading);letter-spacing:0.06em;text-transform:uppercase}
.login-link{text-align:center;font-size:14px;color:var(--text-body);margin-top:16px}

/* ═══════ APP SHELL ═══════ */
.app-shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--bg-card);border-right:1px solid var(--bg-secondary);padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:0 12px;margin-bottom:32px}
.sidebar-logo-mark{width:36px;height:36px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:900;font-size:18px;box-shadow:var(--shadow-coral)}
.sidebar-logo-text{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-heading);letter-spacing:-0.02em}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:var(--font-heading);font-size:14px;font-weight:500;color:var(--text-body);transition:all .15s ease;border:none;background:transparent;text-align:left;width:100%}
.sidebar-item:hover{background:var(--bg-secondary);color:var(--text-heading)}
.sidebar-item.active{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));color:#fff;font-weight:600;box-shadow:var(--shadow-coral)}
.sidebar-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.sidebar-item .nav-badge{margin-left:auto;background:var(--color-primary);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;min-width:20px;text-align:center}
.sidebar-item.active .nav-badge{background:rgba(255,255,255,0.25);color:#fff}
.sidebar-user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;background:var(--bg-secondary);margin-top:16px;cursor:pointer}
.sidebar-user-avatar{width:36px;height:36px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;flex-shrink:0}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-family:var(--font-heading);font-size:14px;font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600}

/* Main area */
.main-area{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:var(--bg-card);border-bottom:1px solid var(--bg-secondary);padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-heading);letter-spacing:-0.02em}
.topbar-search{flex:1;max-width:480px;position:relative}
.topbar-search input{padding-left:40px;background:var(--bg-primary);border-color:transparent}
.topbar-search::before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-muted);pointer-events:none}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-bell{width:40px;height:40px;border-radius:8px;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative;border:none;color:var(--text-body);transition:all .15s ease}
.topbar-bell:hover{background:var(--bg-secondary);color:var(--text-heading)}
.topbar-bell .bell-dot{position:absolute;top:8px;right:10px;width:8px;height:8px;background:var(--color-primary);border-radius:50%;border:2px solid var(--bg-card)}
.topbar-avatar{width:40px;height:40px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;cursor:pointer;border:none}

/* Content */
.content{padding:32px;flex:1;max-width:1400px;width:100%}
.page-header{margin-bottom:24px}
.page-title{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);letter-spacing:-0.025em;margin-bottom:6px}
.page-subtitle{color:var(--text-body);font-size:14px}

/* Cards */
.card{background:var(--bg-card);border-radius:16px;padding:24px;box-shadow:var(--shadow-sm);border:1px solid rgba(26,31,46,0.04)}
.card-title{font-family:var(--font-heading);font-weight:700;font-size:16px;color:var(--text-heading);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-subtitle{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px}

/* Stat cards */
.stat-grid{display:grid;gap:16px}
.stat-grid.g2{grid-template-columns:repeat(2,1fr)}
.stat-grid.g3{grid-template-columns:repeat(3,1fr)}
.stat-grid.g4{grid-template-columns:repeat(4,1fr)}
.stat-card{background:var(--bg-card);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm)}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stat-value{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);letter-spacing:-0.02em;line-height:1.1}
.stat-trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:4px}
.stat-trend.up{color:var(--color-success)}
.stat-trend.down{color:var(--color-danger)}

/* Tags/Badges */
.tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.tag.coral{background:var(--bg-coral-light);color:var(--color-primary)}
.tag.teal{background:var(--bg-teal-light);color:var(--color-secondary)}
.tag.success{background:var(--bg-success-light);color:#4A6B1F}
.tag.warning{background:var(--bg-warning-light);color:#8A5B12}
.tag.danger{background:var(--bg-danger-light);color:var(--color-danger)}
.tag.muted{background:var(--bg-secondary);color:var(--text-body)}

/* Filter chips */
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filter-chip{padding:8px 16px;border-radius:100px;background:transparent;border:1.5px solid var(--bg-secondary);font-family:var(--font-heading);font-size:13px;font-weight:500;color:var(--text-body);cursor:pointer;transition:all .15s ease}
.filter-chip:hover{border-color:var(--color-primary);color:var(--color-primary)}
.filter-chip.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}

/* Tables */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:12px 16px;font-family:var(--font-heading);font-weight:600;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;background:var(--bg-primary);border-bottom:1px solid var(--bg-secondary)}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--bg-secondary);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg-primary)}
.data-table tr.clickable{cursor:pointer}

/* Grid */
.card-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.item-card{background:var(--bg-card);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);border:1px solid rgba(26,31,46,0.04);transition:all .15s ease;cursor:pointer}
.item-card:hover{box-shadow:var(--shadow-md);border-color:var(--color-primary)}

/* Avatar */
.avatar{width:40px;height:40px;border-radius:100px;background:linear-gradient(135deg,var(--color-secondary),var(--color-secondary-hover));color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:700;font-size:14px;flex-shrink:0}
.avatar.sm{width:32px;height:32px;font-size:12px}
.avatar.lg{width:48px;height:48px;font-size:16px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.avatar.coral{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover))}
.avatar.warning{background:linear-gradient(135deg,#FFA500,var(--color-warning));color:#8A5B12}
.avatar.success{background:linear-gradient(135deg,var(--color-success),#5A8228)}

/* Countdown ring */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring-svg{transform:rotate(-90deg)}
.ring-track{stroke:var(--bg-secondary);fill:none}
.ring-progress{fill:none;stroke-linecap:round;transition:stroke-dashoffset 0.6s ease}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-value{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--text-heading);line-height:1}
.ring-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-top:2px}

/* Empty state */
.empty-state{text-align:center;padding:60px 24px;background:var(--bg-card);border-radius:16px;border:2px dashed var(--bg-secondary)}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:0.5}
.empty-title{font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--text-heading);margin-bottom:6px}
.empty-text{color:var(--text-body);font-size:14px;max-width:400px;margin:0 auto 16px}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(26,31,46,0.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-inner{background:var(--bg-card);border-radius:20px;padding:32px;max-width:520px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto}
.modal-inner h3{font-family:var(--font-display);font-weight:800;font-size:22px;margin-bottom:12px}
.modal-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}

/* Section title */
.section-title{font-family:var(--font-heading);font-weight:700;font-size:18px;color:var(--text-heading);margin-bottom:16px}

/* Detail grid */
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:12px 24px;font-size:14px}
.detail-grid dt{color:var(--text-muted);text-transform:uppercase;font-size:11px;letter-spacing:0.06em;font-weight:600;padding-top:2px}
.detail-grid dd{color:var(--text-heading);font-weight:500;word-break:break-word}

/* Progress bar */
.progress{height:6px;background:var(--bg-secondary);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-hover));border-radius:100px;transition:width 0.6s ease}

/* Split view */
.split-view{display:grid;grid-template-columns:400px 1fr;gap:24px;min-height:calc(100vh - var(--topbar-h) - 64px)}
.split-list{background:var(--bg-card);border-radius:16px;padding:20px;overflow-y:auto;max-height:calc(100vh - 130px)}
.split-detail{background:var(--bg-card);border-radius:16px;padding:24px;overflow-y:auto;max-height:calc(100vh - 130px)}

/* Chat bubbles */
.chat-bubble{padding:10px 14px;border-radius:12px;margin-bottom:8px;max-width:75%;font-size:14px}
.chat-bubble.own{background:var(--color-primary);color:#fff;margin-left:auto}
.chat-bubble.other{background:var(--bg-secondary);color:var(--text-heading)}
.chat-meta{font-size:11px;color:var(--text-muted);margin-bottom:4px}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--bg-secondary);border-radius:2px}
.timeline-item{position:relative;padding-bottom:16px}
.timeline-item::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;background:var(--color-primary);border-radius:50%;border:2px solid var(--bg-card);box-shadow:0 0 0 2px var(--bg-secondary)}
.timeline-item .time{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:4px}
.timeline-item .desc{font-size:13px;color:var(--text-heading);line-height:1.5}

/* Responsive */
@media(max-width:1024px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-100%;z-index:100;width:260px;transition:left .25s ease;box-shadow:var(--shadow-lg)}.sidebar.open{left:0}.topbar{padding:0 16px}.split-view{grid-template-columns:1fr}.stat-grid.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.topbar-search{display:none}.login-card{padding:32px 24px}.stat-grid.g3,.stat-grid.g4{grid-template-columns:1fr}.content{padding:20px 16px}.page-title{font-size:24px}}
</style>

<div id="busy">Working...</div>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════════
   PRESERVED FROM PORTAL.HTML - AUTH FLOW, RPC, STATE
═══════════════════════════════════════════════════════════════ */
const SB_URL = 'https://rofyegirmgqjhekuxjat.supabase.co';
const SB_KEY = 'sb_publishable_4f6WR1sk2N9EUO2bU7dkyA_9TByUhTL';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ad-auth' } });
let authMode = null;

async function rpc(fn, args){
  document.getElementById('busy').style.display='block';
  try{
    let useFn = fn;
    let useArgs = Object.assign({}, args || {});
    let useAuth = 'Bearer ' + SB_KEY;
    if (authMode === 'supabase') {
      const legacyReads = ['fn_get_state','fn_login','fn_get_public_stats','fn_submit_lead'];
      const isDirectAuth = fn.indexOf('fn_a_') === 0;
      const shouldRewrite = legacyReads.indexOf(fn) === -1 && !isDirectAuth;
      if (shouldRewrite || isDirectAuth) {
        if (shouldRewrite) { useFn = fn.replace(/^fn_/, 'fn_a_'); delete useArgs.p_actor; }
        try { const s = await sb.auth.getSession(); if (s && s.data && s.data.session) useAuth = 'Bearer ' + s.data.session.access_token; } catch(e){}
      }
    }
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + useFn, { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':useAuth}, body: JSON.stringify(useArgs) });
    if(!r.ok){ const txt = await r.text().catch(()=>String(r.status)); throw new Error('Network ' + r.status + ': ' + txt.slice(0,200)); }
    return await r.json();
  } finally { document.getElementById('busy').style.display='none'; }
}

async function rpcRaw(fn, args, accessToken){
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+accessToken}, body: JSON.stringify(args||{}) });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0,10);
const fmt = d => { if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}); }catch(e){ return d; } };
const timeAgo = iso => {
  if(!iso) return '';
  try{
    const t = new Date(iso).getTime();
    const diff = Math.floor((Date.now() - t) / 1000);
    if(diff < 60) return diff + 's ago';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if(diff < 2592000) return Math.floor(diff/86400) + 'd ago';
    return Math.floor(diff/2592000) + 'mo ago';
  }catch(e){ return ''; }
};
const money = (amt, cur) => {
  const symbol = cur === 'USD' ? '$' : cur === 'INR' ? '₹' : (cur || '');
  return symbol + Number(amt || 0).toLocaleString();
};
const initials = name => {
  if(!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
};

async function loadLeads(){
  try{ const r = await rpc('fn_get_leads', {p_actor: session.code}); leads = (r&&r.ok) ? r.leads : []; }
  catch(e){ leads = []; }
}
async function refresh(){
  const res = await rpc('fn_get_state', {p_code: session.code});
  if(!res.ok){ alert('Session expired.'); logout(); return false; }
  S = res;
  if(res.role==='admin' || res.role==='manager') await loadLeads();
  return true;
}
async function refreshAnd(fn){ if(await refresh()) fn(); }

function askConfirm(message, title){
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal-inner"><h3>${esc(title || 'Are you sure?')}</h3><p style="color:var(--text-body);margin-bottom:24px">${esc(message)}</p><div class="modal-actions"><button class="btn ghost" id="ac-no">Cancel</button><button class="btn danger" id="ac-yes">Yes</button></div></div>`;
    document.body.appendChild(back);
    const cleanup = v => { back.remove(); resolve(v); };
    back.querySelector('#ac-yes').onclick = () => cleanup(true);
    back.querySelector('#ac-no').onclick = () => cleanup(false);
    back.onclick = e => { if(e.target === back) cleanup(false); };
  });
}

function toast(msg, kind){
  const t = document.createElement('div');
  const bg = kind === 'error' ? 'var(--color-danger)' : kind === 'success' ? 'var(--color-success)' : 'var(--color-primary)';
  t.style.cssText = `position:fixed;top:20px;right:20px;background:${bg};color:#fff;padding:12px 20px;border-radius:8px;font-family:var(--font-heading);font-weight:600;font-size:14px;z-index:400;box-shadow:var(--shadow-lg);animation:fadeIn .2s ease`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

window.toggleCodeLogin = function(){
  const b = document.getElementById('code-login-block');
  const l = document.getElementById('code-toggle-link');
  if(b.style.display === 'none'){ b.style.display = 'block'; l.textContent = 'Hide access code option'; setTimeout(() => { const c = document.getElementById('code'); if(c) c.focus(); }, 50); }
  else { b.style.display = 'none'; l.textContent = 'Use access code instead'; }
};

window.doEmailLogin = async function(){
  const email = ($('#li-email').value || '').trim().toLowerCase();
  const pass = $('#li-pass').value || '';
  if(!email || !pass){ renderLogin('Enter email and password.'); return; }
  document.getElementById('busy').style.display = 'block';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ renderLogin(error.message || 'Login failed.'); return; }
    const who = await rpcRaw('fn_whoami', {}, data.session.access_token);
    if(!who || !who.ok){ await sb.auth.signOut(); renderLogin('Your email is not linked to an ApplyDesk profile yet. Ask admin to invite you.'); return; }
    authMode = 'supabase';
    session = { code: who.role_code || '', role: who.role, name: who.name, email };
    await refresh();
    rerender();
  }catch(e){ renderLogin('Connection problem, try again.'); }
  finally{ document.getElementById('busy').style.display = 'none'; }
};

window.doLogin = async function(){
  const code = ($('#code').value || '').trim().toLowerCase();
  if(!code){ renderLogin('Enter your access code.'); return; }
  try{
    const res = await rpc('fn_login', { p_code: code });
    if(!res.ok){ renderLogin('Invalid code.'); return; }
    authMode = 'legacy';
    session = { code, role: res.role, name: res.name };
    sessionStorage.setItem('ad-code', code);
    await refresh();
    rerender();
  }catch(e){ renderLogin('Connection problem, try again.'); }
};

window.doReset = async function(){
  const email = prompt('Enter your email to receive a password reset link:');
  if(!email) return;
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: window.location.origin + '/portal-v2.html' });
    if(error){ alert(error.message || 'Could not send reset email.'); return; }
    alert('If that email is registered, a reset link is on its way.');
  }catch(e){ alert('Could not send reset email right now.'); }
};

window.doSetPassword = async function(){
  const pass = document.getElementById('sp-pass').value;
  const conf = document.getElementById('sp-conf').value;
  const err = document.getElementById('sp-err');
  if(!pass || pass.length < 8){ err.textContent = 'Password must be at least 8 characters.'; return; }
  if(pass !== conf){ err.textContent = 'Passwords do not match.'; return; }
  err.textContent = '';
  document.getElementById('busy').style.display = 'block';
  try{
    const { error } = await sb.auth.updateUser({ password: pass });
    if(error){ err.textContent = error.message || 'Could not save password.'; return; }
    history.replaceState(null, '', window.location.pathname);
    const who = await sb.auth.getUser();
    if(who && who.data && who.data.user){
      const wr = await rpcRaw('fn_whoami', {}, (await sb.auth.getSession()).data.session.access_token);
      if(wr && wr.ok){
        authMode = 'supabase';
        session = { code: wr.role_code || '', role: wr.role, name: wr.name, email: who.data.user.email };
        await refresh();
        rerender();
        return;
      }
    }
    alert('Password saved. Please log in.'); renderLogin();
  }catch(e){ err.textContent = 'Could not save password. Try again.'; }
  finally{ document.getElementById('busy').style.display = 'none'; }
};

function renderAdminDashboard(){
  const cs = S.clients || [];
  const rs = S.recruiters || [];
  const ms = S.managers || [];
  const activeClients = cs.filter(c => !c.deactivated_at).length;
  const monthlyRecurring = cs.filter(c => !c.deactivated_at && c.subscription_amount).reduce((sum, c) => sum + (c.subscription_currency === 'USD' ? Number(c.subscription_amount) * 88 : Number(c.subscription_amount)), 0);
  const unclaimedLeads = (leads || []).filter(l => !l.claimed_by).length;
  const activeTeam = rs.filter(r => !r.deactivated_at).length + ms.filter(m => !m.deactivated_at).length;

  // Upcoming payments (next 10 days)
  const upcoming = [];
  cs.forEach(c => {
    if(c.deactivated_at || !c.subscription_start_date) return;
    try{
      const start = new Date(c.subscription_start_date);
      const now = new Date();
      const monthsElapsed = Math.max(1, Math.ceil((now - start) / (30 * 86400000)));
      const nextDue = new Date(start.getTime() + monthsElapsed * 30 * 86400000);
      const days = Math.floor((nextDue - now) / 86400000);
      if(days >= 0 && days <= 14) upcoming.push({ name: c.name, code: c.code, days, amount: c.subscription_amount, currency: c.subscription_currency });
    }catch(e){}
  });
  upcoming.sort((a,b) => a.days - b.days);

  const upcomingCards = upcoming.slice(0, 6).map(p => {
    const urgClass = p.days <= 1 ? 'danger' : p.days <= 3 ? 'danger' : p.days <= 7 ? 'warning' : 'teal';
    const urgLabel = p.days === 0 ? 'DUE TODAY' : p.days === 1 ? '1 DAY' : p.days + ' DAYS';
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-primary);margin-bottom:8px;cursor:pointer" onclick="openClientDetail('${esc(p.code)}')">
      <div class="avatar sm">${esc(initials(p.name))}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:var(--text-heading);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
        <div style="font-size:12px;color:var(--text-muted)">${money(p.amount, p.currency)}</div>
      </div>
      <span class="tag ${urgClass}">${urgLabel}</span>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">No payments due in the next 14 days.</div>`;

  const recentLeadCards = (leads || []).slice(0, 5).map(l => `<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-primary);margin-bottom:8px">
    <div class="avatar sm coral">${esc(initials(l.name))}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;color:var(--text-heading);font-size:14px">${esc(l.name)}</div>
      <div style="font-size:11px;color:var(--text-muted)">${esc(l.plan_interest || '')} · ${timeAgo(l.created_at)}</div>
    </div>
    ${!l.claimed_by ? '<span class="tag warning">NEW</span>' : ''}
  </div>`).join('') || `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">No leads yet.</div>`;

  return `<div class="page-header">
    <h1 class="page-title">Mission Control</h1>
    <p class="page-subtitle">Welcome back, ${esc(session.name)}. Here is your business pulse.</p>
  </div>
  <div class="stat-grid g4" style="margin-bottom:24px">
    <div class="stat-card"><div class="stat-label">💰 Monthly recurring (INR)</div><div class="stat-value">₹${Math.round(monthlyRecurring).toLocaleString('en-IN')}</div><div class="stat-trend up">↑ Growing</div></div>
    <div class="stat-card"><div class="stat-label">👥 Active clients</div><div class="stat-value">${activeClients}</div><div class="stat-trend up">${activeClients} paying</div></div>
    <div class="stat-card"><div class="stat-label">🎯 Team on shift</div><div class="stat-value">${activeTeam}</div><div class="stat-trend up">${rs.length} recruiters · ${ms.length} managers</div></div>
    <div class="stat-card"><div class="stat-label">🔥 Unclaimed leads</div><div class="stat-value">${unclaimedLeads}</div><div class="stat-trend ${unclaimedLeads > 0 ? 'down' : 'up'}">${unclaimedLeads > 0 ? 'Action needed' : 'All caught up'}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <div class="card">
      <div class="card-title">💰 Upcoming payments <span class="tag muted" style="font-size:10px">${upcoming.length} in next 14 days</span></div>
      ${upcomingCards}
    </div>
    <div class="card">
      <div class="card-title">🔥 Recent leads <button class="btn sm ghost" onclick="setView('leads')">View all →</button></div>
      ${recentLeadCards}
    </div>
  </div>`;
}

  const filtered = filter === 'unclaimed' ? list.filter(l => !l.claimed_by) : filter === 'mine' ? list.filter(l => l.claimed_by === session.code) : list;
  const selected = viewState.selectedLead ? list.find(l => l.id === viewState.selectedLead) : filtered[0];
  if(selected && !viewState.selectedLead) viewState.selectedLead = selected.id;

  const listItems = filtered.map(l => {
    const isActive = selected && l.id === selected.id;
    const isUnread = !l.claimed_by;
    return `<div style="padding:14px;border-radius:12px;background:${isActive ? 'var(--bg-coral-light)' : 'var(--bg-primary)'};border:1.5px solid ${isActive ? 'var(--color-primary)' : 'transparent'};cursor:pointer;margin-bottom:8px;transition:all .15s ease" onclick="selectLead(${l.id})">
      <div style="display:flex;align-items:center;gap:12px">

window.submitAddClient = async function(){
  const getV = id => (document.getElementById(id) || {}).value || '';
  const name = getV('ac-name').trim();
  const email = getV('ac-email').trim().toLowerCase();
  const code = getV('ac-code').trim().toLowerCase();
  if(!name || !email || !code){ toast('Name, email, and access code are required', 'error'); return; }
  try{
    const r = await rpc('fn_a_add_client', {
      p_name: name, p_code: code, p_email: email, p_phone: getV('ac-phone').trim(),
      p_target_role: getV('ac-role').trim(), p_sponsorship: getV('ac-sponsor'),
      p_years_experience: parseFloat(getV('ac-years')) || 0,
      p_base_resume_url: getV('ac-resume').trim(),
      p_subscription_start: getV('ac-start') || null,
      p_subscription_amount: parseFloat(getV('ac-amount')) || 150,
      p_subscription_currency: getV('ac-currency') || 'USD',
      p_target: 25
    });
    if(!r || !r.ok){ toast('Failed: ' + ((r && r.err) || 'unknown'), 'error'); return; }
    viewState.showAddClient = false;
    await refresh();
    toast('Client added', 'success');
    renderShell();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.sendClientInvite = async function(code, email){
  if(!confirm('Send invitation email to ' + email + '?')) return;
  try{
    const { data:{ session: s } } = await sb.auth.getSession();
    if(!s){ toast('Log in with email + password to send invites', 'error'); return; }
    const r = await fetch(SB_URL + '/functions/v1/invite-user', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':SB_KEY}, body: JSON.stringify({ role:'client', role_code:code, email }) });
    const j = await r.json();
    if(j.ok) toast('Invitation sent to ' + email, 'success');
    else toast('Failed: ' + (j.err || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

};

    <div class="avatar xl coral">${esc(initials(r.name))}</div>
    <div style="flex:1"><h1 style="font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-heading);letter-spacing:-0.025em;margin:0">${esc(r.name)}</h1><div style="font-size:13px;color:var(--text-muted);font-family:monospace">${esc(r.code)} · ${r.deactivated_at ? '<span class="tag danger">DEACTIVATED</span>' : '<span class="tag success">ACTIVE</span>'}</div></div>
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:24px">
    <div>
      <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,var(--bg-coral-light),var(--bg-warning-light))">
        <div style="display:flex;align-items:center;gap:24px">
          <div class="ring-wrap" style="width:${ringSize}px;height:${ringSize}px">
            <svg class="ring-svg" width="${ringSize}" height="${ringSize}"><circle class="ring-track" cx="${ringSize/2}" cy="${ringSize/2}" r="${ringRadius}" stroke-width="10"/><circle class="ring-progress" cx="${ringSize/2}" cy="${ringSize/2}" r="${ringRadius}" stroke-width="10" style="stroke:${ringColor};stroke-dasharray:${ringCirc};stroke-dashoffset:${ringOffset}"/></svg>
            <div class="ring-center"><div class="ring-value">${daysLeft !== null ? daysLeft : '—'}</div><div class="ring-label">${daysLeft === 1 ? 'DAY' : 'DAYS'}</div></div>
          </div>
          <div style="flex:1"><div class="card-subtitle">Next payroll</div><div style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--text-heading)">${r.payroll_amount ? money(r.payroll_amount, r.payroll_currency) : 'No payroll set'}</div>${nextDue ? `<div style="font-size:13px;color:var(--text-body);margin-top:4px">Due <b>${fmt(nextDue)}</b> · Cycle day ${r.payroll_cycle_day}</div>` : ''}</div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-title">Personal info</div>
        <dl class="detail-grid">

          ${r.phone ? `<dt>Phone</dt><dd>${esc(r.phone)}</dd>` : ''}
          ${r.target_roles ? `<dt>Roles</dt><dd>${esc(r.target_roles)}</dd>` : ''}
          ${r.joined_date ? `<dt>Joined</dt><dd>${fmt(r.joined_date)}</dd>` : ''}
        </dl>
      </div>
      <div class="card">
        <div class="card-title">Assigned clients (${assignedClients.length})</div>
        ${assignedClients.length ? assignedClients.map(c => `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--bg-secondary)" onclick="openClientDetail('${esc(c.code)}')" style="cursor:pointer"><div class="avatar sm">${esc(initials(c.name))}</div><div style="flex:1"><div style="font-weight:600;color:var(--text-heading);font-size:14px">${esc(c.name)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.code)}</div></div><button class="btn ghost sm">View →</button></div>`).join('') : '<div style="color:var(--text-muted);font-style:italic;padding:12px 0">No clients assigned yet.</div>'}

window.sendGenericInvite = async function(role, code, email){
  if(!confirm('Send invitation email to ' + email + '?')) return;
  try{
    const { data:{ session: s } } = await sb.auth.getSession();
    if(!s){ toast('Log in with email + password to send invites', 'error'); return; }
    const r = await fetch(SB_URL + '/functions/v1/invite-user', { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':SB_KEY}, body: JSON.stringify({ role, role_code:code, email }) });
    const j = await r.json();
    if(j.ok) toast('Invitation sent to ' + email, 'success');
    else toast('Failed: ' + (j.err || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

    if(typeof days === 'number'){
      if(days === 0){ urgClass = 'danger'; urgLabel = 'DUE TODAY'; }
      else if(days === 1){ urgClass = 'danger'; urgLabel = '1 DAY'; }
      else if(days <= 3){ urgClass = 'danger'; urgLabel = 'URGENT'; }
      else if(days <= 5){ urgClass = 'warning'; urgLabel = 'APPROACHING'; }
      else { urgClass = 'teal'; urgLabel = 'HEADS UP'; }
    }
    return `<div style="display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:${n.is_read ? 'var(--bg-card)' : 'var(--bg-coral-light)'};border-radius:12px;margin-bottom:8px;cursor:pointer;border:1px solid ${n.is_read ? 'var(--bg-secondary)' : 'transparent'}" onclick="markNotifRead(${n.id})">
      ${!n.is_read ? '<div style="width:8px;height:8px;background:var(--color-primary);border-radius:50%;flex-shrink:0;margin-top:8px"></div>' : '<div style="width:8px;flex-shrink:0"></div>'}
      <div style="font-size:22px;flex-shrink:0">${iconFor(n.category)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <div style="font-family:var(--font-heading);font-weight:${n.is_read ? '500' : '700'};color:var(--text-heading);font-size:14px">${esc(n.title)}</div>
          ${urgLabel ? `<span class="tag ${urgClass}">${urgLabel}</span>` : ''}
        </div>
        ${n.body ? `<div style="font-size:13px;color:var(--text-body);line-height:1.5">${esc(n.body)}</div>` : ''}
      </div>
      <div style="font-size:11px;color:var(--text-muted);white-space:nowrap;flex-shrink:0;font-weight:600">${timeAgo(n.created_at)}</div>
    </div>`;
  }).join('') || `<div class="empty-state"><div class="empty-icon">🔔</div><h3 class="empty-title">All caught up</h3><p class="empty-text">No notifications matching this filter.</p></div>`;

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
    <div><h1 class="page-title">Notifications</h1><p class="page-subtitle">${list.length} total · ${notifUnread} unread</p></div>
    ${notifUnread > 0 ? '<button class="btn ghost" onclick="markAllNotifsRead()">Mark all read</button>' : ''}
  </div>
  <div class="filter-chips">
    <button class="filter-chip ${filter === 'all' ? 'active' : ''}" onclick="setNotifFilter('all')">All (${list.length})</button>
    <button class="filter-chip ${filter === 'unread' ? 'active' : ''}" onclick="setNotifFilter('unread')">Unread (${notifUnread})</button>
    <button class="filter-chip ${filter === 'sub' ? 'active' : ''}" onclick="setNotifFilter('sub')">💰 Subscriptions</button>
    ${session.role === 'admin' ? `<button class="filter-chip ${filter === 'pay' ? 'active' : ''}" onclick="setNotifFilter('pay')">💼 Payrolls</button>` : ''}
  </div>
  <div>${cards}</div>`;
}

window.setNotifFilter = function(f){ viewState.notifFilter = f; renderShell(); };
window.markNotifRead = async function(id){
  try{
    await rpc('fn_mark_notification_read', { p_id: id });
    const item = (notifList || []).find(n => n.id === id);
    if(item && !item.is_read){ item.is_read = true; notifUnread = Math.max(0, notifUnread - 1); }
    renderShell();
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};
window.markAllNotifsRead = async function(){
  try{
    const r = await rpc('fn_mark_all_notifications_read', {});
    if(r && r.ok){ (notifList || []).forEach(n => n.is_read = true); notifUnread = 0; toast('All marked read', 'success'); renderShell(); }
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

/* ═══════ FINANCE PAGE (5 sub-tabs) ═══════ */
function renderFinancePage(){
  const tab = viewState.financeTab || 'transactions';
  const tabBtn = (key, label) => `<button class="filter-chip ${tab === key ? 'active' : ''}" onclick="setFinanceTab('${key}')">${label}</button>`;
  const tabbar = `<div class="filter-chips" style="margin-bottom:24px">${tabBtn('transactions', '📊 Transactions')}${tabBtn('subscriptions', '🔁 Subscriptions')}${tabBtn('payrolls', '💼 Payrolls')}${tabBtn('spends', '📉 Spends')}${tabBtn('resumes', '📄 Resume Requests')}</div>`;

  const header = `<div class="page-header"><h1 class="page-title">Treasury</h1><p class="page-subtitle">Every dollar in, every rupee out.</p></div>`;

  if(tab === 'subscriptions') return header + tabbar + renderFinSubscriptions();
  if(tab === 'payrolls') return header + tabbar + renderFinPayrolls();
  if(tab === 'spends') return header + tabbar + renderFinSpends();
  if(tab === 'resumes') return header + tabbar + renderFinResumes();

}

function renderFinSubscriptions(){
  if(viewState.financeData === null || viewState.financeData === undefined){

  }
  if(viewState.financeData === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;
  const subs = viewState.financeData || [];
  const active = subs.filter(s => s.active);
  const totalIn = active.reduce((sum, s) => sum + (s.currency === 'USD' ? Number(s.amount) * 88 : Number(s.amount)), 0);

    <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value">${active.length}</div></div>
    <div class="stat-card"><div class="stat-label">Monthly recurring (INR)</div><div class="stat-value">₹${Math.round(totalIn).toLocaleString('en-IN')}</div></div>

}

function renderFinResumes(){
  if(viewState.financeData === null || viewState.financeData === undefined){
    viewState.financeData = 'loading';
    rpc('fn_a_list_resume_requests', {}).then(r => { viewState.financeData = (r && r.ok) ? (r.requests || []) : []; renderShell(); }).catch(() => { viewState.financeData = []; renderShell(); });
    return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading resume requests...</h3></div>`;
  }
  if(viewState.financeData === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;
  const reqs = viewState.financeData || [];
  const unclaimed = reqs.filter(r => r.status === 'unclaimed');
  const claimed = reqs.filter(r => r.status === 'claimed');
  const completed = reqs.filter(r => r.status === 'completed');
  const totalEarned = completed.reduce((sum, r) => sum + (r.currency === 'USD' ? Number(r.amount) * 88 : Number(r.amount)), 0);

  const card = r => {
    const isMine = r.claimed_by === session.code;
    let actions = '';
    if(r.status === 'unclaimed') actions = `<button class="btn primary sm" onclick="claimResume(${r.id})">Claim</button>`;
    else if(r.status === 'claimed' && isMine) actions = `<button class="btn secondary sm" onclick="completeResume(${r.id})">Mark completed</button>`;
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-weight:600;color:var(--text-heading);margin-bottom:4px">${esc(r.client_name)}</div>
          <div style="font-size:12px;color:var(--text-muted)">${esc(r.client_email)}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Requested ${timeAgo(r.requested_at)}</div>
          ${r.notes ? `<div style="font-size:12px;color:var(--text-body);margin-top:6px;font-style:italic">"${esc(r.notes)}"</div>` : ''}
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--text-heading)">${money(r.amount, r.currency)}</div>
          <div style="margin-top:6px"><span class="tag ${r.status === 'unclaimed' ? 'warning' : r.status === 'claimed' ? 'coral' : 'success'}">${r.status.toUpperCase()}</span></div>
          ${actions ? `<div style="margin-top:10px">${actions}</div>` : ''}
        </div>
      </div>
    </div>`;
  };

  return `<div class="stat-grid g3" style="margin-bottom:24px">
    <div class="stat-card"><div class="stat-label">Unclaimed</div><div class="stat-value">${unclaimed.length}</div></div>
    <div class="stat-card"><div class="stat-label">In progress</div><div class="stat-value">${claimed.length}</div></div>
    <div class="stat-card"><div class="stat-label">Completed (INR)</div><div class="stat-value">₹${Math.round(totalEarned).toLocaleString('en-IN')}</div></div>
  </div>
  ${unclaimed.length ? '<h3 class="section-title">Unclaimed</h3>' + unclaimed.map(card).join('') : ''}
  ${claimed.length ? '<h3 class="section-title">In progress</h3>' + claimed.map(card).join('') : ''}
  ${completed.length ? '<h3 class="section-title">Completed</h3>' + completed.map(card).join('') : ''}
  ${!reqs.length ? '<div class="empty-state"><div class="empty-icon">📄</div><h3 class="empty-title">No resume requests</h3></div>' : ''}`;
}

window.claimResume = async function(id){
  try{
    const r = await rpc('fn_a_claim_resume_request', { p_id: id });
    if(r && r.ok){ viewState.financeData = null; toast('Claimed', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};
window.completeResume = async function(id){
  const rate = prompt('Exchange rate (INR per USD)? Enter 1 if INR:', '88');
  if(!rate) return;
  const fxRate = parseFloat(rate) || 88;
  if(!confirm('Mark complete and log payment?')) return;
  try{
    const r = await rpc('fn_a_complete_resume_request', { p_id: id, p_fx_rate: fxRate });
    if(r && r.ok){ viewState.financeData = null; toast('Completed and logged', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }
};

window.selectGroup = function(id){ viewState.selectedGroup = id; viewState.groupMessages = null; renderShell(); };

function renderGroupThread(g){
  if(viewState.groupMessages === null || viewState.groupMessages === undefined){
    viewState.groupMessages = 'loading';
    rpc('fn_a_group_messages', { p_group_id: g.id, p_limit: 100 }).then(r => { viewState.groupMessages = (r && r.ok) ? (r.messages || []) : []; renderShell(); }).catch(() => { viewState.groupMessages = []; renderShell(); });

  }
  if(viewState.groupMessages === 'loading') return `<div class="empty-state"><div class="empty-icon">⏳</div><h3 class="empty-title">Loading...</h3></div>`;
  const msgs = viewState.groupMessages || [];

  const bubbles = msgs.map(m => {
    const isMine = m.from_code === session.code;
    return `<div style="display:flex;flex-direction:column;${isMine ? 'align-items:flex-end' : 'align-items:flex-start'};margin-bottom:12px">
      <div class="chat-meta">${esc(m.from_name || m.from_code)} <span class="tag muted" style="font-size:9px">${esc(m.from_role || '')}</span> · ${timeAgo(m.sent_at)}</div>
      <div class="chat-bubble ${isMine ? 'own' : 'other'}">${esc(m.body)}</div>
    </div>`;
  }).join('') || `<div style="text-align:center;padding:32px;color:var(--text-muted);font-size:13px">No messages yet. Send the first one.</div>`;

  const canSend = !g.broadcast || session.role === 'admin';

  return `<div style="display:flex;flex-direction:column;height:100%">
    <div style="border-bottom:1px solid var(--bg-secondary);padding-bottom:12px;margin-bottom:16px">
      <div style="font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--text-heading)">${g.broadcast ? '📢 ' : ''}${esc(g.name)}</div>
      <div style="font-size:12px;color:var(--text-muted)">${g.member_count || 0} members${g.broadcast ? ' · Broadcast (admin-only send)' : ''}</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 4px;min-height:300px">${bubbles}</div>
    ${canSend ? `<div style="display:flex;gap:8px;padding-top:16px;border-top:1px solid var(--bg-secondary)">
      <input type="text" id="msg-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg(${g.id})">
      <button class="btn primary" onclick="sendMsg(${g.id})">Send</button>
    </div>` : '<div style="padding-top:16px;color:var(--text-muted);font-size:12px;font-style:italic">Broadcast channel - only admins can send</div>'}
  </div>`;
}

window.sendMsg = async function(groupId){
  const input = document.getElementById('msg-input');
  const body = (input.value || '').trim();
  if(!body) return;
  try{
    const r = await rpc('fn_a_send_group_message', { p_group_id: groupId, p_body: body });
    if(r && r.ok){ viewState.groupMessages = null; renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  }catch(e){ toast('Failed: ' + e.message, 'error'); }

window.promptCreateGroup = function(){
  const name = prompt('Group name:');
  if(!name) return;
  const broadcast = confirm('Broadcast channel? (only admins can send)');
  rpc('fn_a_create_group', { p_name: name.trim(), p_description: '', p_broadcast: broadcast, p_include_clients: false }).then(r => {
    if(r && r.ok){ groupsList = null; toast('Group created', 'success'); renderShell(); }
    else toast('Failed: ' + ((r && r.err) || 'unknown'), 'error');
  });
};

      <dl class="detail-grid" style="margin-bottom:16px">

        <dt>Role</dt><dd><span class="tag coral">${esc(roleLabel(session.role))}</span></dd>
        ${session.email ? `<dt>Email</dt><dd>${esc(session.email)}</dd>` : ''}
        <dt>Access code</dt><dd style="font-family:monospace">${esc(session.code)}</dd>
      </dl>
      <button class="btn danger" onclick="logout()">Log out</button>
    </div>
    <div class="card">
      <div class="card-title">🔑 Security</div>
      <p style="color:var(--text-body);font-size:14px;margin-bottom:16px">To change your password, log out and use the "Forgot password?" link on the login screen. You will receive a reset link by email.</p>
      <button class="btn ghost" onclick="doReset()">Send password reset email</button>
    </div>
  </div>
  <div class="card" style="margin-top:24px">
    <div class="card-title">ℹ️ About</div>
    <p style="color:var(--text-body);font-size:14px">ApplyDesk Portal v2. Built with warm palette from Figma.</p>
    <p style="color:var(--text-muted);font-size:12px;margin-top:8px">Backend: Supabase · Deploy: Cloudflare Workers</p>
  </div>`;
}

/* ═══════ ROLE-SPECIFIC DASHBOARDS (simpler for now) ═══════ */
function renderManagerDashboard(){

    <div class="stat-card"><div class="stat-label">Recruiters on shift</div><div class="stat-value">${rs.length}</div></div>
    <div class="stat-card"><div class="stat-label">Unclaimed leads</div><div class="stat-value">${(leads || []).filter(l => !l.claimed_by).length}</div></div>

  <div class="card"><div class="card-title">Quick actions</div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn primary" onclick="setView('leads')">Review leads</button><button class="btn secondary" onclick="setView('clients')">All clients</button><button class="btn ghost" onclick="setView('recruiters')">Team</button></div></div>`;
}

function renderRecruiterDashboard(){
  const myClients = (S.clients || []).filter(c => !c.deactivated_at);
  return `<div class="page-header"><h1 class="page-title">Recruiter Workspace</h1><p class="page-subtitle">Hi ${esc(session.name)}, here's your day.</p></div>
  <div class="card" style="margin-bottom:24px"><div class="card-title">📅 Today's assignments</div>
    ${myClients.length ? myClients.slice(0, 6).map(c => `<div style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg-primary);margin-bottom:8px"><div class="avatar sm">${esc(initials(c.name))}</div><div style="flex:1"><div style="font-weight:600;color:var(--text-heading);font-size:14px">${esc(c.name)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.target_role || 'No target role')}</div></div><button class="btn primary sm">Log app</button></div>`).join('') : '<div class="empty-state" style="padding:24px"><div class="empty-icon">🎯</div><h3 class="empty-title">No clients assigned</h3><p class="empty-text">Ask your manager to assign you.</p></div>'}
  </div>`;
}

function renderClientDashboard(){
  const me = (S.clients || []).find(c => c.code === session.code) || {};
  // Simple profile completeness calc
  const fields = ['name', 'email', 'phone', 'target_role', 'years_experience', 'sponsorship_status', 'base_resume_url'];
  const filled = fields.filter(f => me[f]).length;
  const pct = Math.round((filled / fields.length) * 100);
  const ringSize = 140, ringR = 60, ringC = 2 * Math.PI * ringR;
  const ringOff = ringC * (1 - pct / 100);
  return `<div class="page-header"><h1 class="page-title">Applicant Central</h1><p class="page-subtitle">Welcome ${esc(session.name)}. Complete your profile to unlock the best applications.</p></div>
  <div class="card" style="margin-bottom:24px;background:linear-gradient(135deg,var(--bg-coral-light),var(--bg-warning-light))">
    <div style="display:flex;align-items:center;gap:24px">
      <div class="ring-wrap" style="width:${ringSize}px;height:${ringSize}px">
        <svg class="ring-svg" width="${ringSize}" height="${ringSize}"><circle class="ring-track" cx="${ringSize/2}" cy="${ringSize/2}" r="${ringR}" stroke-width="12"/><circle class="ring-progress" cx="${ringSize/2}" cy="${ringSize/2}" r="${ringR}" stroke-width="12" style="stroke:var(--color-primary);stroke-dasharray:${ringC};stroke-dashoffset:${ringOff}"/></svg>
        <div class="ring-center"><div class="ring-value" style="font-size:32px">${pct}%</div><div class="ring-label">COMPLETE</div></div>
      </div>
      <div style="flex:1"><h2 style="font-family:var(--font-display);font-weight:800;color:var(--text-heading);margin-bottom:8px">${pct === 100 ? 'You are all set!' : 'Unlock max deliverability'}</h2><p style="color:var(--text-body);font-size:14px">${pct === 100 ? 'Your profile is complete. Recruiters have everything they need.' : 'Fill in remaining fields on your profile to give recruiters everything they need.'}</p></div>
    </div>
  </div>
  <div class="card"><div class="card-title">Your subscription</div><dl class="detail-grid">${me.subscription_amount ? `<dt>Amount</dt><dd><b>${money(me.subscription_amount, me.subscription_currency)}</b>/month</dd>` : ''}${me.subscription_start_date ? `<dt>Started</dt><dd>${fmt(me.subscription_start_date)}</dd>` : ''}<dt>Status</dt><dd><span class="tag success">Active</span></dd></dl></div>`;
}

function renderMyProfile(){ return `<div class="page-header"><h1 class="page-title">My Profile</h1></div><div class="card"><div class="card-title">Profile</div><dl class="detail-grid"><dt>Name</dt><dd>${esc(session.name)}</dd><dt>Role</dt><dd>${esc(roleLabel(session.role))}</dd><dt>Code</dt><dd style="font-family:monospace">${esc(session.code)}</dd>${session.email ? `<dt>Email</dt><dd>${esc(session.email)}</dd>` : ''}</dl></div>`; }
function renderMyClients(){ const cs = S.clients || []; return `<div class="page-header"><h1 class="page-title">My Clients</h1></div>${cs.length ? '<div class="card-grid">' + cs.map(c => `<div class="item-card"><div class="avatar coral">${esc(initials(c.name))}</div><h4 style="margin-top:12px">${esc(c.name)}</h4><p style="font-size:12px;color:var(--text-muted)">${esc(c.target_role || 'No target role')}</p></div>`).join('') + '</div>' : '<div class="empty-state"><div class="empty-icon">👥</div><h3 class="empty-title">No clients yet</h3></div>'}`; }
function renderLogApplication(){ return `<div class="page-header"><h1 class="page-title">Log Application</h1><p class="page-subtitle">Application logging UI coming in polish pass. Backend already supports it.</p></div><div class="empty-state"><div class="empty-icon">📝</div><h3 class="empty-title">Coming soon</h3></div>`; }
function renderMyApplications(){ return `<div class="page-header"><h1 class="page-title">My Applications</h1></div><div class="card"><p style="color:var(--text-body)">Application history view coming in polish pass.</p></div>`; }
function renderMySubscription(){ const me = (S.clients || []).find(c => c.code === session.code) || {}; return `<div class="page-header"><h1 class="page-title">My Subscription</h1></div><div class="card"><div class="card-title">Details</div><dl class="detail-grid">${me.subscription_amount ? `<dt>Amount</dt><dd><b>${money(me.subscription_amount, me.subscription_currency)}</b>/month</dd>` : '<dt>Plan</dt><dd>Not active</dd>'}${me.subscription_start_date ? `<dt>Started</dt><dd>${fmt(me.subscription_start_date)}</dd>` : ''}</dl></div>`; }

function renderPlaceholder(title, sub){

/* Debug preview hook */
window.__v2preview = function(role, name, mockData){
  session = { code: 'preview', role: role, name: name || 'Preview User', email: 'preview@example.com' };
  authMode = 'legacy';
  S = mockData && mockData.S ? mockData.S : { clients: [], recruiters: [], managers: [] };
  leads = mockData && mockData.leads ? mockData.leads : [];
  currentView = 'dashboard';
  renderShell();

/* ═══════ BOOT ═══════ */
(async function boot(){
  $('#app').innerHTML = '<div style="text-align:center;padding-top:20vh"><h2 style="font-family:var(--font-display);font-weight:800;color:var(--text-heading)">Loading...</h2></div>';

  const hash = window.location.hash || '';
  const isInvite = hash.includes('type=invite') || hash.includes('type=signup');
  const isRecovery = hash.includes('type=recovery');
  if(isInvite || isRecovery){
    try{
      await new Promise(r => setTimeout(r, 400));
      const { data: { session: s } } = await sb.auth.getSession();
      if(s){ renderSetPassword(isInvite ? 'Welcome to ApplyDesk! Choose a password to finish setting up your account.' : 'Choose your new password.'); return; }
    }catch(e){}
  }

  try{
    const { data: { session: s } } = await sb.auth.getSession();
    if(s && s.access_token){
      const who = await rpcRaw('fn_whoami', {}, s.access_token);
      if(who && who.ok){
        authMode = 'supabase';
        session = { code: who.role_code || '', role: who.role, name: who.name, email: s.user ? s.user.email : '' };
        await refresh();
        rerender();
        return;
      }
    }
  }catch(e){}

  const saved = sessionStorage.getItem('ad-code');
  if(saved){
    try{
      const res = await rpc('fn_login', { p_code: saved });
      if(res.ok){
        authMode = 'legacy';
        session = { code: saved, role: res.role, name: res.name };
        await refresh();
        rerender();
        return;
      }
    }catch(e){}
  }
  renderLogin();
})();
</script>
