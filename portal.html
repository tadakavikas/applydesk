<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApplyDesk Mission Control</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8fc;--card:#ffffff;--ink:#0e2b4a;--text:#1e3a56;--text2:#54708c;--text3:#8aa2b8;--blue:#1d72c8;--blue-d:#155a9e;--blue-bg:#e8f1fa;--border:#dbe7f2;--border-s:#c6d8ea;--green:#178a63;--green-bg:#e3f4ec;--red:#c9264a;--red-bg:#fdeaef;--amber-bg:#fdf3dc;--amber:#8a5b12;--purple:#4a3aa7;--purple-bg:#ece9fb;--radius:9px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px;position:relative}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:22px;margin-bottom:18px}
h1,h2,h3{font-weight:600;letter-spacing:-0.015em;color:var(--ink)}
h2{font-size:19px}h3{font-size:15.5px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.btn{display:inline-block;background:#fff;border:0.5px solid var(--border-s);padding:9px 17px;border-radius:var(--radius);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;text-decoration:none;color:var(--ink);line-height:1.25;text-align:center}
.btn:hover{border-color:var(--blue);color:var(--blue-d)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.red:hover{background:#a81d3c;color:#fff}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.blue:hover{background:var(--blue-d);color:#fff}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.green:hover{background:#0f6e4e;color:#fff}
.btn.purple{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.purple:hover{background:#3a2d87;color:#fff}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
input,select,textarea{border:0.5px solid var(--border-s);padding:9px 12px;font-family:inherit;font-size:13.5px;background:#f9fcfe;width:100%;border-radius:var(--radius);color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
label{font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:5px;color:var(--text3)}
.field{margin-bottom:13px}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}.row.c4{grid-template-columns:repeat(4,1fr)}.row.c5{grid-template-columns:repeat(5,1fr)}
.tag{display:inline-block;font-size:10px;padding:2.5px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag.app{background:var(--green-bg);color:#0f6e4e}
.tag.reach{background:var(--blue-bg);color:var(--blue-d)}
.tag.reply{background:var(--amber-bg);color:var(--amber)}
.tag.noreply{background:#eef1f4;color:#5a6b7c}
.tag.new{background:var(--red-bg);color:#a03a5c}
.tag.contacted{background:var(--amber-bg);color:var(--amber)}
.tag.closed{background:#eef1f4;color:#5a6b7c}
.tag.unclaimed{background:var(--amber-bg);color:var(--amber)}
.tag.claimed{background:var(--purple-bg);color:var(--purple)}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 11px;border-bottom:0.5px solid var(--border);background:#f9fcfe;font-weight:600;color:var(--text3)}
td{padding:10px 11px;border-bottom:0.5px solid #eef4fa;vertical-align:top}
.stat{background:#fff;border:0.5px solid var(--border);border-radius:11px;padding:15px}
.stat .n{font-size:26px;font-weight:600;line-height:1.1;color:var(--ink);letter-spacing:-0.02em}
.stat .l{font-weight:600;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;margin-top:5px;color:var(--text3)}
.stat.red .n{color:var(--red)}.stat.blue .n{color:var(--blue)}.stat.green .n{color:var(--green)}.stat.pink .n{color:#c94a80}.stat.purple .n{color:var(--purple)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;color:var(--ink)}
.logo .mark{width:26px;height:26px;background:var(--blue);color:#fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.rolebadge{font-size:10px;background:var(--blue-bg);color:var(--blue-d);padding:3px 10px;margin-left:8px;border-radius:99px;letter-spacing:.06em;font-weight:600;vertical-align:middle}
.tabs{display:flex;gap:4px;margin-bottom:-1px;flex-wrap:wrap}
.tab{padding:9px 16px;background:transparent;font-weight:500;font-size:12.5px;cursor:pointer;color:var(--text2);border-radius:9px 9px 0 0;border:0.5px solid transparent}
.tab.active{background:#fff;color:var(--ink);font-weight:600;border-color:var(--border);border-bottom-color:#fff}
.range-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.hidden{display:none}
.muted{color:var(--text3);font-size:12.5px}
.center{text-align:center}
.msg-bubble{border:0.5px solid var(--border);padding:11px 15px;margin-bottom:11px;max-width:80%;position:relative;border-radius:12px;background:#fff;font-size:13px}
.msg-bubble.client{background:var(--blue-bg);border-color:#d3e5f6}
.msg-bubble.team{background:var(--green-bg);border-color:#cfe9dd;margin-left:auto}
.msg-bubble .who{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;color:var(--text2)}
.msg-bubble .when{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--text3);margin-top:4px}
.msg-bubble .actions{position:absolute;top:6px;right:8px;display:none;gap:4px}
.msg-bubble:hover .actions{display:flex}
.chip{display:inline-block;background:#f4f8fc;border:0.5px solid var(--border-s);padding:4px 11px;font-size:11.5px;font-weight:500;margin:2px;cursor:pointer;border-radius:99px;color:var(--text)}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-d);font-weight:600}
#busy{position:fixed;top:14px;right:14px;background:var(--blue);color:#fff;border-radius:9px;padding:7px 14px;font-weight:600;font-size:11.5px;z-index:99;display:none;box-shadow:0 6px 18px rgba(29,114,200,.3)}
a{color:var(--blue);font-weight:500;text-decoration:none}
a:hover{color:var(--blue-d)}
.participants{border:0.5px dashed var(--border-s);padding:8px 12px;margin-bottom:12px;font-size:11.5px;color:var(--text3);border-radius:9px;background:#f9fcfe}
@media(max-width:760px){.row.c2,.row.c3,.row.c4,.row.c5{grid-template-columns:1fr}.msg-bubble{max-width:100%}}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="busy">WORKING...</div>
<div class="wrap" id="app"></div>

<script>
/* ═══════ SUPABASE CONNECTION ═══════ */
const SB_URL = 'https://rofyegirmgqjhekuxjat.supabase.co';
const SB_KEY = 'sb_publishable_4f6WR1sk2N9EUO2bU7dkyA_9TByUhTL';
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ad-auth' } });
let authMode = null; // 'supabase' after email login, 'legacy' after code login

async function rpc(fn, args){
  document.getElementById('busy').style.display='block';
  try{
    // In supabase auth mode: route writes to fn_a_* which use auth.uid() from JWT.
    // Strip p_actor (identity comes from JWT). Reads (fn_get_state, fn_login) stay as-is.
    let useFn = fn;
    let useArgs = Object.assign({}, args || {});
    let useAuth = 'Bearer ' + SB_KEY;
    if (authMode === 'supabase') {
      const legacyReads = ['fn_get_state','fn_login','fn_get_public_stats','fn_submit_lead'];
      const isDirectAuth = fn.indexOf('fn_a_') === 0;
      const shouldRewrite = legacyReads.indexOf(fn) === -1 && !isDirectAuth;
      if (shouldRewrite || isDirectAuth) {
        if (shouldRewrite) {
          useFn = fn.replace(/^fn_/, 'fn_a_');
          delete useArgs.p_actor;
        }
        try {
          const s = await sb.auth.getSession();
          if (s && s.data && s.data.session) useAuth = 'Bearer ' + s.data.session.access_token;
        } catch(e){}
      }
    }
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + useFn, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':useAuth},
      body: JSON.stringify(useArgs)
    });
    if(!r.ok){
      const txt = await r.text().catch(()=>String(r.status));
      throw new Error('Network error ' + r.status + ': ' + txt.slice(0,200));
    }
    return await r.json();
  } finally { document.getElementById('busy').style.display='none'; }
}

/* ═══════ STATE ═══════ */
let session=null;
let S={}, leads=[];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function emptyState(icon, title, subtitle, cta){
  return `<div style="text-align:center;padding:48px 24px;background:#f9fcfe;border:0.5px dashed var(--border-s);border-radius:12px;margin:14px 0">
    <div style="font-size:38px;margin-bottom:14px;opacity:.5">${icon}</div>
    <h3 style="font-size:16px;color:var(--ink);margin-bottom:6px">${title}</h3>
    <p class="muted" style="max-width:340px;margin:0 auto 16px">${subtitle}</p>
    ${cta||''}
  </div>`;
}
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const clientName=code=>{const c=(S.clients||[]).find(x=>x.code===code);return c?c.name:code;};
const teamName=code=>{
  if(!code)return 'Unclaimed';
  const m=(S.managers||[]).find(x=>x.code===code);if(m)return m.name+' (Ops)';
  const r=(S.recruiters||[]).find(x=>x.code===code);if(r)return r.name;
  if(session && code===session.code && session.role==='admin')return 'Admin';
  return 'Admin';
};

async function loadLeads(){
  try{const r=await rpc('fn_get_leads',{p_actor:session.code});leads=(r&&r.ok)?r.leads:[];}
  catch(e){leads=[];}
}
async function refresh(){
  const res=await rpc('fn_get_state',{p_code:session.code});
  if(!res.ok){alert('Session expired or removed.');logout();return false;}
  S=res;
  if(res.role==='admin'||res.role==='manager')await loadLeads();
  return true;
}
async function refreshAnd(fn){ if(await refresh()) fn(); }
function rerender(){
  session.role==='admin'?renderAdmin():session.role==='manager'?renderManager():session.role==='recruiter'?renderRecruiter():renderClient();
}

/* ═══════ IN-PAGE CONFIRM DIALOG ═══════ */
function askConfirm(message){
  return new Promise(resolve=>{
    const back=document.createElement('div');
    back.style.cssText='position:fixed;inset:0;background:rgba(18,16,14,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
    back.innerHTML=`<div style="background:#fff;border:var(--outline);box-shadow:8px 8px 0 var(--ink);padding:28px;max-width:400px;width:100%">
      <h3 style="font-family:Bangers;font-size:1.4rem;margin-bottom:14px">HOLD UP!</h3>
      <p style="margin-bottom:22px">${esc(message)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn" id="ac-no">CANCEL</button>
        <button class="btn red" id="ac-yes">YES, DELETE</button>
      </div></div>`;
    document.body.appendChild(back);
    const cleanup=v=>{back.remove();resolve(v);};
    back.querySelector('#ac-yes').onclick=()=>cleanup(true);
    back.querySelector('#ac-no').onclick=()=>cleanup(false);
    back.onclick=e=>{if(e.target===back)cleanup(false);};
  });
}

/* ═══════ LOGIN ═══════ */
function renderLogin(msg){
  session=null;S={};leads=[];authMode=null;sessionStorage.removeItem('ad-code');
  try{ sb.auth.signOut(); }catch(e){}
  $('#app').innerHTML=`
  <div style="max-width:960px;margin:5vh auto 0;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center">
    <div>
      <div class="logo" style="margin-bottom:20px"><span class="mark">A</span>ApplyDesk</div>
      <h1 style="font-size:32px;font-weight:600;letter-spacing:-0.025em;color:var(--ink);margin-bottom:14px;line-height:1.1">Mission Control</h1>
      <p style="color:var(--text2);font-size:15px;line-height:1.6;margin-bottom:24px">One workspace for clients, recruiters, ops managers, and admin. Every application, every reach-out, every conversation in one place.</p>
      <div style="display:grid;gap:10px;font-size:13px;color:var(--text2)">
        <div style="display:flex;gap:10px;align-items:center"><span style="color:var(--green);font-weight:700">✓</span> Daily reports at 6 PM</div>
        <div style="display:flex;gap:10px;align-items:center"><span style="color:var(--green);font-weight:700">✓</span> Full application history, searchable</div>
        <div style="display:flex;gap:10px;align-items:center"><span style="color:var(--green);font-weight:700">✓</span> Direct chat with your team</div>
      </div>
    </div>
    <div>
      ${msg?`<div class="card" style="background:var(--red-bg);color:var(--red);padding:12px 16px;font-weight:600;margin-bottom:14px;border-color:#f5c8d3">${esc(msg)}</div>`:''}
      <div class="card">
        <h2 style="margin-bottom:6px">Log in</h2>
        <p class="muted" style="margin-bottom:14px">Use your email and password.</p>
        <div class="field"><label>Email</label>
          <input id="li-email" type="email" placeholder="you@example.com" autocomplete="username"></div>
        <div class="field"><label>Password</label>
          <input id="li-pass" type="password" placeholder="Your password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doEmailLogin()"></div>
        <button class="btn blue" style="width:100%" onclick="doEmailLogin()">Log in →</button>
        <p class="center" style="margin-top:12px;font-size:12px"><a href="#" onclick="doReset();return false;" style="color:var(--blue)">Forgot password?</a></p>
        <div style="border-top:0.5px solid var(--border);margin:18px 0 14px;position:relative">
          <span style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace">OR</span>
        </div>
        <p class="center" style="font-size:12px"><a href="#" onclick="toggleCodeLogin();return false;" style="color:var(--text2)" id="code-toggle-link">Use access code instead</a></p>
        <div id="code-login-block" style="display:none;margin-top:12px">
          <div class="field"><label>Access code</label>
            <input id="code" type="password" placeholder="Enter your access code" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></div>
          <button class="btn" style="width:100%" onclick="doLogin()">Log in with code</button>
        </div>
        <p class="muted center" style="margin-top:14px;font-size:12px"><a href="index.html">← Back to home</a></p>
      </div>
    </div>
  </div>
  <style>@media(max-width:760px){#app > div{grid-template-columns:1fr!important;gap:20px!important}}</style>`;
}

window.toggleCodeLogin=function(){
  const b=document.getElementById('code-login-block');
  const l=document.getElementById('code-toggle-link');
  if(b.style.display==='none'){b.style.display='block';l.textContent='Hide access code option';setTimeout(()=>{const c=document.getElementById('code');if(c)c.focus();},50);}
  else{b.style.display='none';l.textContent='Use access code instead';}
}

window.doEmailLogin=async function(){
  const email=($('#li-email').value||'').trim().toLowerCase();
  const pass=$('#li-pass').value||'';
  if(!email||!pass){renderLogin('Enter email and password.');return;}
  document.getElementById('busy').style.display='block';
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ renderLogin(error.message||'Login failed.'); return; }
    // Session is now active; fetch our role via fn_whoami
    const who = await rpcRaw('fn_whoami', {}, data.session.access_token);
    if(!who || !who.ok){ await sb.auth.signOut(); renderLogin('Your email is not linked to an ApplyDesk profile yet. Ask admin to invite you.'); return; }
    authMode='supabase';
    session={code: who.role_code||'', role: who.role, name: who.name, email};
    await refresh(); rerender();
  }catch(e){ renderLogin('Connection problem, try again.'); }
  finally{ document.getElementById('busy').style.display='none'; }
}

window.doReset=async function(){
  const email = prompt('Enter your email to receive a password reset link:');
  if(!email) return;
  try{
    const { error } = await sb.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: window.location.origin + '/portal.html' });
    if(error){ alert(error.message||'Could not send reset email.'); return; }
    alert('If that email is registered, a reset link is on its way. Check your inbox in a few minutes.');
  }catch(e){ alert('Could not send reset email right now.'); }
}

// Direct RPC that lets us pass a specific access token (used at login time before authMode is set)
async function rpcRaw(fn, args, accessToken){
  try{
    const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+accessToken},
      body: JSON.stringify(args||{})
    });
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

window.sendInvite=async function(role, roleCode, email){
  if(!email){
    email = prompt('Email for this ' + role + ':');
    if(!email) return;
    email = email.trim().toLowerCase();
    if(!email.includes('@')){ alert('Please enter a valid email address.'); return; }
  }
  if(!confirm('Send invitation email to ' + email + '?\n\nThey will receive a "Set your password" link and can log in with email+password after.')) return;
  document.getElementById('busy').style.display='block';
  try{
    const { data:{ session:s } } = await sb.auth.getSession();
    if(!s){ alert('You need to be logged in with email+password to send invites (not access code). Log out and log back in with your email.'); return; }
    const r = await fetch(SB_URL + '/functions/v1/invite-user', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+s.access_token, 'apikey': SB_KEY },
      body: JSON.stringify({ email, role, role_code: roleCode })
    });
    const j = await r.json();
    if(!j.ok){ alert('Invite failed: ' + (j.err || 'unknown error')); return; }
    alert(j.note || 'Invitation sent! They will receive an email from Supabase shortly. Ask them to check inbox (and spam folder) and click "Set your password".');
    await refreshAnd(rerender);
  }catch(e){ alert('Could not reach invite service. Try again in a moment.'); }
  finally{ document.getElementById('busy').style.display='none'; }
}

window.doLogin=async function(){
  const code=$('#code').value.trim(); if(!code)return;
  try{
    const res=await rpc('fn_login',{p_code:code});
    if(!res.ok){renderLogin('Invalid code.');return;}
    authMode='legacy';
    session={code,role:res.role,name:res.name};
    sessionStorage.setItem('ad-code',code);
    await refresh(); rerender();
  }catch(e){renderLogin('Connection problem, try again.');}
}
window.logout=function(){renderLogin();}

/* ═══════ SHARED: SEARCH ═══════ */
let searchQ='';
function recMatch(r,q){
  q=q.toLowerCase();
  return [r.company,r.role,r.link,r.recruiter_name,r.recruiter_email,r.notes,r.resume_file,r.resume_link,clientName(r.client_code)]
    .some(v=>String(v||'').toLowerCase().includes(q));
}
function searchBox(placeholder){
  return `<div class="card" style="background:var(--yellow);padding:14px 18px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span style="font-size:1.3rem">🔎</span>
      <input id="rec-search" placeholder="${placeholder}" value="${esc(searchQ)}"
        style="flex:1;min-width:220px" oninput="searchQ=this.value;rerender();setTimeout(()=>{const e=document.getElementById('rec-search');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}},0)">
      ${searchQ?`<button class="btn sm red" onclick="searchQ='';rerender()">✕ Clear</button>`:''}
    </div>
  </div>`;
}

/* ═══════ SHARED: ADD RECORD FORM ═══════ */
function entryForm(allowedClients){
  if(!allowedClients.length) return `<p>No clients available yet.</p>`;
  const opts=allowedClients.map(c=>`<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');
  return `
  <h2>Add entry</h2>
  <div class="row c3" style="margin-top:14px">
    <div class="field"><label>Client</label><select id="f-client">${opts}</select></div>
    <div class="field"><label>Type</label>
      <select id="f-type" onchange="document.getElementById('reach-fields').classList.toggle('hidden',this.value!=='reachout')">
        <option value="application">Application</option><option value="reachout">Recruiter reach-out</option>
      </select></div>
    <div class="field"><label>Date</label><input id="f-date" type="date" value="${today()}"></div>
  </div>
  <div class="row c2">
    <div class="field"><label>Company</label><input id="f-company" placeholder="e.g. Stripe"></div>
    <div class="field"><label>Role</label><input id="f-role" placeholder="e.g. Data Engineer II"></div>
  </div>
  <div class="field"><label>Job link</label><input id="f-link" placeholder="https://..."></div>
  <div class="row c2">

window.addRecord=async function(btn){
  const type=$('#f-type').value;
  const company=$('#f-company').value.trim();
  if(!company){alert('Company is required');return;}
  btn.disabled=true;
  try{
    const res=await rpc('fn_add_record',{
      p_actor:session.code, p_client:$('#f-client').value, p_type:type,
      p_date:$('#f-date').value||today(), p_company:company, p_role:$('#f-role').value.trim(),
      p_link:$('#f-link').value.trim(),
      p_rname:type==='reachout'?$('#f-rname').value.trim():'',
      p_remail:type==='reachout'?$('#f-remail').value.trim():'',
      p_replied:type==='reachout'?$('#f-replied').value:'',
      p_notes:$('#f-notes').value.trim(),
      p_resume_link:$('#f-resume-link').value.trim()
    });
    if(!res.ok){alert(res.err||'Save failed');return;}
    const fi=$('#f-resume-file');
    if(fi&&fi.files.length){
      const f=fi.files[0];
      if(f.size>1024*1024){alert('Entry saved, but resume too big.');}
      else{
        const b64=await new Promise((ok,bad)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=bad;rd.readAsDataURL(f);});
        await rpc('fn_save_resume',{p_actor:session.code,p_record:res.id,p_name:f.name,p_data:b64});
      }
      fi.value='';
    }
    ['f-company','f-role','f-link','f-rname','f-remail','f-notes','f-resume-link'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    await refresh();
    const m=$('#save-msg'); if(m){m.textContent='Saved! ✓';setTimeout(()=>{if(m)m.textContent='';},2000);}
  }finally{btn.disabled=false;}
}
window.downloadResume=async function(id){
  const res=await rpc('fn_get_resume',{p_actor:session.code,p_record:id});

window.attachResume=function(id){

function fmtTime(ts){
  if(!ts) return '';
  try{
    const d = new Date(ts);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }catch(e){ return ''; }
}

/* ═══════ PERFORMANCE CHART ═══════ */
function perfChartFor(personCode, personName, dateFrom, dateTo, clientFilter){
  const APP_TARGET=20, REACH_TARGET=5;
  const from=dateFrom||new Date(Date.now()-6*86400000).toISOString().slice(0,10);
  const to=dateTo||today();
  let recs=(S.records||[]).filter(r=>r.added_by===personCode && r.date>=from && r.date<=to);
  if(clientFilter) recs=recs.filter(r=>r.client_code===clientFilter);
  const claimedLeads=(leads||[]).filter(l=>l.claimed_by===personCode && l.claimed_at && l.claimed_at.slice(0,10)>=from && l.claimed_at.slice(0,10)<=to);
  const days=[];const start=new Date(from+'T00:00:00'),end=new Date(to+'T00:00:00');
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const iso=d.toISOString().slice(0,10);
    days.push({date:iso,apps:recs.filter(r=>r.date===iso&&r.type==='application').length,reach:recs.filter(r=>r.date===iso&&r.type==='reachout').length});
  }
  const shown=days.slice(-40);
  const W=900,H=280,padL=44,padB=44,padT=26;
  const maxV=Math.max(APP_TARGET*1.3, ...shown.map(d=>d.apps+d.reach))*1.1;
  const bw=(W-padL-16)/Math.max(shown.length,1);
  const y=v=>H-padB-(v/maxV)*(H-padB-padT);
  const bars=shown.map((d,i)=>{const x=padL+i*bw;
    const meetsApps=d.apps>=APP_TARGET, meetsReach=d.reach>=REACH_TARGET;
    const dt=new Date(d.date+'T00:00:00');
    const lbl=(shown.length<=14||i%Math.ceil(shown.length/10)===0)?`<text x="${x+bw/2}" y="${H-padB+16}" font-size="9" text-anchor="middle" font-family="JetBrains Mono" fill="#8aa2b8">${dt.getMonth()+1}/${dt.getDate()}</text>`:'';
    return `<rect x="${x+bw*0.1}" y="${y(d.apps)}" width="${bw*0.4}" height="${Math.max(0,H-padB-y(d.apps))}" rx="2" fill="${meetsApps?'#1d72c8':'#c94a63'}"></rect>
    <rect x="${x+bw*0.55}" y="${y(d.reach)}" width="${bw*0.35}" height="${Math.max(0,H-padB-y(d.reach))}" rx="2" fill="${meetsReach?'#8fc0ea':'#e0a2b3'}"></rect>
    ${lbl}`;}).join('');
  const totalApps=shown.reduce((s,d)=>s+d.apps,0);
  const totalReach=shown.reduce((s,d)=>s+d.reach,0);
  const daysHit=shown.filter(d=>d.apps>=APP_TARGET&&d.reach>=REACH_TARGET).length;
  const hitRate=shown.length?Math.round(daysHit/shown.length*100):0;
  const scopeNote=clientFilter?` · client: ${esc(clientName(clientFilter))}`:'';
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px">
      <h3>Efficiency: ${esc(personName)}${scopeNote}</h3>
      <span class="muted mono" style="font-size:10.5px">${from} → ${to} · baseline 20 apps + 5 reach-outs/day</span>
    </div>
    <div class="row c5" style="margin-bottom:14px">
      <div class="stat blue"><div class="n">${totalApps}</div><div class="l">Applications</div></div>
      <div class="stat blue"><div class="n">${totalReach}</div><div class="l">Reach-outs</div></div>
      <div class="stat green"><div class="n">${daysHit}</div><div class="l">Days hit target</div></div>
      <div class="stat purple"><div class="n">${hitRate}%</div><div class="l">Target rate</div></div>
      <div class="stat pink"><div class="n">${claimedLeads.length}</div><div class="l">Leads claimed</div></div>
    </div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;background:#fff">
      <line x1="${padL}" y1="${y(APP_TARGET)}" x2="${W-8}" y2="${y(APP_TARGET)}" stroke="#178a63" stroke-width="1.5" stroke-dasharray="6 4"></line>
      <text x="${W-10}" y="${y(APP_TARGET)-4}" font-size="10" text-anchor="end" fill="#178a63" font-family="Inter">apps target 20</text>
      <line x1="${padL}" y1="${y(REACH_TARGET)}" x2="${W-8}" y2="${y(REACH_TARGET)}" stroke="#1d72c8" stroke-width="1.5" stroke-dasharray="6 4"></line>
      <text x="${W-10}" y="${y(REACH_TARGET)-4}" font-size="10" text-anchor="end" fill="#1d72c8" font-family="Inter">reach target 5</text>
      ${bars}
      <line x1="${padL}" y1="${H-padB}" x2="${W-8}" y2="${H-padB}" stroke="#c6d8ea" stroke-width="1.5"></line>
    </svg></div>
    <p class="muted" style="font-size:10.5px;margin-top:8px">
      <span style="display:inline-block;width:10px;height:10px;background:#1d72c8;border-radius:2px"></span> apps hit &nbsp;
      <span style="display:inline-block;width:10px;height:10px;background:#c94a63;border-radius:2px"></span> apps below &nbsp;
      <span style="display:inline-block;width:10px;height:10px;background:#8fc0ea;border-radius:2px"></span> reach hit &nbsp;
      <span style="display:inline-block;width:10px;height:10px;background:#e0a2b3;border-radius:2px"></span> reach below
    </p>
  </div>`;
}

function clientVolPanel(clientCode, dateFrom, dateTo){

  const from=dateFrom||new Date(Date.now()-6*86400000).toISOString().slice(0,10);
  const to=dateTo||today();
  const recs=(S.records||[]).filter(r=>r.client_code===clientCode && r.date>=from && r.date<=to);
  const apps=recs.filter(r=>r.type==='application');
  const reach=recs.filter(r=>r.type==='reachout');
  const replies=reach.filter(r=>r.replied==='yes');
  const days=[];const start=new Date(from+'T00:00:00'),end=new Date(to+'T00:00:00');
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const iso=d.toISOString().slice(0,10);
    days.push({date:iso,apps:apps.filter(r=>r.date===iso).length});
  }
  const shown=days.slice(-40);
  const daysHit=shown.filter(d=>d.apps>=target).length;
  const W=900,H=240,padL=44,padB=42,padT=24;
  const maxV=Math.max(target,...shown.map(d=>d.apps))*1.15;

  const y=v=>H-padB-(v/maxV)*(H-padB-padT);
  const bars=shown.map((d,i)=>{const x=padL+i*bw;const beat=d.apps>=target;const dt=new Date(d.date+'T00:00:00');
    const lbl=(shown.length<=14||i%Math.ceil(shown.length/10)===0)?`<text x="${x+bw/2}" y="${H-padB+15}" font-size="9" text-anchor="middle" font-family="JetBrains Mono" fill="#8aa2b8">${dt.getMonth()+1}/${dt.getDate()}</text>`:'';
    return `<rect x="${x+bw*0.15}" y="${y(d.apps)}" width="${bw*0.7}" height="${Math.max(0,H-padB-y(d.apps))}" rx="2" fill="${beat?'#1d72c8':'#c94a63'}"></rect>${lbl}`;}).join('');

    </div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;background:#fff">
      <line x1="${padL}" y1="${y(target)}" x2="${W-8}" y2="${y(target)}" stroke="#178a63" stroke-width="1.5" stroke-dasharray="6 4"></line>
      <text x="${W-10}" y="${y(target)-5}" font-size="10" text-anchor="end" fill="#178a63" font-family="Inter">baseline ${target}</text>
      ${bars}
      <line x1="${padL}" y1="${H-padB}" x2="${W-8}" y2="${H-padB}" stroke="#c6d8ea" stroke-width="1.5"></line>
    </svg></div>
  </div>`;
}

let finState = {
  from: '',
  to: '',
  preset: 'month',
  rows: [],
  summary: {total_in_inr: 0, total_out_inr: 0, net_inr: 0, count_in: 0, count_out: 0, series: []},
  loading: false,
  showForm: false,
  editingId: null,
  form: { txn_date: '', txn_type: 'IN', amount: '', currency: 'USD', category: 'Subscription', description: '', related_party: '', fx_rate: '' }
};

function finDefaultRange() {
  const t = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const from = new Date(t.getFullYear(), t.getMonth(), 1);
  return { from: iso(from), to: iso(t) };
}

function finApplyPreset(preset) {
  const t = new Date();
  const iso = d => d.toISOString().slice(0,10);
  let from, to = t;
  if (preset === 'today') { from = t; }
  else if (preset === '7d') { from = new Date(t); from.setDate(from.getDate() - 6); }
  else if (preset === 'month') { from = new Date(t.getFullYear(), t.getMonth(), 1); }
  else if (preset === 'lastmonth') { from = new Date(t.getFullYear(), t.getMonth()-1, 1); to = new Date(t.getFullYear(), t.getMonth(), 0); }
  else if (preset === 'ytd') { from = new Date(t.getFullYear(), 0, 1); }
  else if (preset === 'all') { from = new Date(2020, 0, 1); to = new Date(2030, 0, 1); }
  finState.preset = preset;
  finState.from = iso(from);
  finState.to = iso(to);
}

async function finLoad() {
  finState.loading = true;
  try {
    const listArgs = { p_from: finState.from || null, p_to: finState.to || null, p_type: null, p_limit: 500 };
    const sumArgs = { p_from: finState.from || null, p_to: finState.to || null };
    const [listRes, sumRes] = await Promise.all([
      rpc('fn_a_fin_list', listArgs),
      rpc('fn_a_fin_summary', sumArgs)
    ]);
    finState.rows = (listRes && listRes.ok && listRes.rows) ? listRes.rows : [];
    finState.summary = (sumRes && sumRes.ok) ? sumRes : {total_in_inr:0,total_out_inr:0,net_inr:0,count_in:0,count_out:0,series:[]};
  } catch(e) {
    finState.rows = [];
    finState.summary = {total_in_inr:0,total_out_inr:0,net_inr:0,count_in:0,count_out:0,series:[]};
  } finally {
    finState.loading = false;
  }
}

function finFmtInr(n) {
  n = Number(n || 0);
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function finFmtUsd(n) {
  n = Number(n || 0);
  return '$' + n.toFixed(2);
}

function finChart(series) {
  if (!series || !series.length) {
    return '<div class="muted center" style="padding:40px 0">No data in this range yet.</div>';
  }
  // Build cumulative
  const sorted = [...series].sort((a,b) => (a.d||'').localeCompare(b.d||''));
  let cum = 0;
  const points = sorted.map(p => { cum += Number(p.net || 0); return { d: p.d, bal: cum }; });
  const W = 800, H = 200, padL = 50, padR = 20, padT = 20, padB = 30;
  const cw = W - padL - padR, ch = H - padT - padB;
  const maxBal = Math.max(...points.map(p => p.bal), 100);
  const minBal = Math.min(...points.map(p => p.bal), 0);
  const range = maxBal - minBal || 1;
  const xStep = points.length > 1 ? cw / (points.length - 1) : 0;
  const yFor = v => padT + ch - ((v - minBal) / range) * ch;
  const grid = [0,1,2,3].map(i => {
    const y = padT + (ch/3) * i;
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#DBE7F2" stroke-width="0.5" ${i>0?'stroke-dasharray="2,2"':''}/>`;
  }).join('');
  const path = points.map((p,i) => (i===0?'M ':'L ') + (padL + i*xStep) + ' ' + yFor(p.bal)).join(' ');
  const area = path + ` L ${padL + (points.length-1)*xStep} ${padT+ch} L ${padL} ${padT+ch} Z`;
  const circles = points.map((p,i) => {
    const cx = padL + i*xStep, cy = yFor(p.bal);
    return `<circle cx="${cx}" cy="${cy}" r="${i===points.length-1?4:3}" fill="#1d72c8" ${i===points.length-1?'stroke="white" stroke-width="2"':''}/>`;
  }).join('');
  const labels = points.length ?
    `<text x="${padL}" y="${H-8}" font-size="10" fill="#8aa2b8" font-family="JetBrains Mono">${points[0].d.slice(5)}</text>` +
    (points.length > 1 ? `<text x="${W-padR}" y="${H-8}" font-size="10" fill="#8aa2b8" text-anchor="end" font-family="JetBrains Mono">${points[points.length-1].d.slice(5)}</text>` : '')
    : '';

window.finSaveForm = async function() {
  const date = document.getElementById('ff-date').value;
  const amount = parseFloat(document.getElementById('ff-amount').value);
  const category = document.getElementById('ff-category').value;
  const description = document.getElementById('ff-desc').value.trim();
  const related = document.getElementById('ff-related').value.trim();
  const rateEl = document.getElementById('ff-fxrate');
  const fxRate = rateEl ? parseFloat(rateEl.value) : null;

  if (!date) { alert('Date is required.'); return; }
  if (!amount || amount <= 0) { alert('Please enter a positive amount.'); return; }
  if (finState.form.currency === 'USD' && (!fxRate || fxRate <= 0)) {
    alert('For USD transactions, please enter the exchange rate (INR per 1 USD) on the transaction date.');
    return;
  }

  const args = {
    p_txn_date: date,
    p_txn_type: finState.form.txn_type,
    p_amount: amount,
    p_currency: finState.form.currency,
    p_category: category || 'Other',
    p_description: description || '',
    p_related_party: related || '',
    p_fx_rate: finState.form.currency === 'USD' ? fxRate : null
  };

  try {
    let res;
    if (finState.editingId != null) {
      args.p_id = finState.editingId;
      res = await rpc('fn_a_fin_update', args);
    } else {
      res = await rpc('fn_a_fin_add', args);
    }
    if (!res || !res.ok) { alert('Save failed: ' + ((res && res.err) || 'unknown error')); return; }
    finState.showForm = false;
    finState.editingId = null;
    finState._loaded = false;
    renderAdmin();
  } catch(e) {
    alert('Save failed: ' + (e.message || e));
  }
};

window.finEdit = function(id) {
  const row = finState.rows.find(r => r.id === id);
  if (!row) return;
  finState.editingId = id;
  finState.showForm = true;
  finState.form = {
    txn_date: row.txn_date,
    txn_type: row.txn_type,
    amount: row.amount,
    currency: row.currency,
    fx_rate: row.fx_rate || '',
    category: row.category,
    description: row.description,
    related_party: row.related_party
  };
  renderAdmin();
};

window.finDelete = async function(id) {
  if (!(await askConfirm('Delete this transaction? This cannot be undone.'))) return;
  try {
    const res = await rpc('fn_a_fin_delete', { p_id: id });
    if (!res || !res.ok) { alert('Delete failed: ' + ((res && res.err) || 'unknown')); return; }
    finState._loaded = false;
    renderAdmin();
  } catch(e) {
    alert('Delete failed: ' + (e.message || e));
  }
};

let range={mode:'week'};
function rangeBounds(){
  const t=new Date();const iso=d=>d.toISOString().slice(0,10);
  if(range.mode==='today')return{start:today(),end:today()};
  if(range.mode==='week'){const s=new Date(t);s.setDate(t.getDate()-6);return{start:iso(s),end:today()};}
  if(range.mode==='month'){const s=new Date(t);s.setDate(t.getDate()-29);return{start:iso(s),end:today()};}
  if(range.mode==='custom')return{start:range.start,end:range.end};
  return{start:'2000-01-01',end:'2100-01-01'};
}
window.setRange=m=>{range={mode:m};renderClient();}
window.setCustom=function(){const s=$('#r-start').value,e=$('#r-end').value;if(!s||!e){alert('Pick both dates');return;}range={mode:'custom',start:s,end:e};renderClient();}
function perfChartClient(mine){
  const target=(S.me&&S.me.target)||25;
  const dates=[...new Set(mine.map(r=>r.date))].sort();
  if(!dates.length)return'';
  const start=new Date(dates[0]+'T00:00:00'),end=new Date(dates[dates.length-1]+'T00:00:00');
  const days=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const iso=d.toISOString().slice(0,10);
    days.push({date:iso,apps:mine.filter(r=>r.date===iso&&r.type==='application').length});}
  const shown=days.slice(-31);
  const W=900,H=260,padL=44,padB=40,padT=26;
  const maxV=Math.max(target,...shown.map(d=>d.apps))*1.15;
  const bw=(W-padL-16)/shown.length;
  const y=v=>H-padB-(v/maxV)*(H-padB-padT);
  const bars=shown.map((d,i)=>{const x=padL+i*bw;const beat=d.apps>=target;const dt=new Date(d.date+'T00:00:00');
    const lbl=(shown.length<=10||i%Math.ceil(shown.length/8)===0)?`<text x="${x+bw/2}" y="${H-padB+16}" font-size="10" text-anchor="middle" font-family="IBM Plex Mono">${dt.getMonth()+1}/${dt.getDate()}</text>`:'';
    return `<rect x="${x+bw*0.15}" y="${y(d.apps)}" width="${bw*0.7}" height="${Math.max(0,H-padB-y(d.apps))}" fill="${beat?'#1d72c8':'#c94a63'}" stroke="#c6d8ea" stroke-width="1.5"></rect>
    ${d.apps>0?`<text x="${x+bw/2}" y="${y(d.apps)-6}" font-size="11" font-weight="bold" text-anchor="middle" font-family="Rubik">${d.apps}</text>`:''}${lbl}`;}).join('');
  const above=shown.filter(d=>d.apps>=target).length;
  return `<div class="card">
    <h3 style="margin-bottom:4px">Applications per day vs baseline</h3>
    <p class="muted" style="margin-bottom:12px">Baseline: <b>${target}/day</b> · <span style="color:var(--green);font-weight:900">${above}</span> of ${shown.length} days at or above target</p>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;background:#fff">
      ${bars}
      <line x1="${padL}" y1="${y(target)}" x2="${W-8}" y2="${y(target)}" stroke="#178a63" stroke-width="2.5" stroke-dasharray="7 5"></line>
      <text x="${W-10}" y="${y(target)-7}" font-size="11" font-weight="bold" text-anchor="end" fill="#178a63" font-family="Inter">BASELINE ${target}</text>
      <line x1="${padL}" y1="${H-padB}" x2="${W-8}" y2="${H-padB}" stroke="#c6d8ea" stroke-width="1.5"></line>
    </svg></div></div>`;
}
function renderClient(){
  const{start,end}=rangeBounds();
  const searching=!!searchQ;
  const mine=searching
    ? (S.records||[]).filter(r=>recMatch(r,searchQ))
    : (S.records||[]).filter(r=>r.date>=start&&r.date<=end);
  const apps=mine.filter(r=>r.type==='application'),reach=mine.filter(r=>r.type==='reachout'),replies=reach.filter(r=>r.replied==='yes');
  const days=[...new Set(mine.map(r=>r.date))].sort().reverse();
  const rangeLbl=range.mode==='all'?'All time':range.mode==='today'?'Today':`${fmt(start)} → ${fmt(end)}`;
  const dayBlocks=days.map(d=>{
    const dr=mine.filter(r=>r.date===d);
    return `<div class="card">
      <h3 style="margin-bottom:10px">${fmt(d)} <span class="muted" style="font-family:Rubik;font-size:.8rem;text-transform:none">· ${dr.filter(r=>r.type==='application').length} applications, ${dr.filter(r=>r.type==='reachout').length} reach-outs</span></h3>
      ${dataTable(dr,{showClient:false,showTime:false})}
    </div>`;}).join('');
  $('#app').innerHTML=`
  <div class="topbar">
    <div class="logo"><span class="mark">A</span>ApplyDesk<span class="rolebadge">CLIENT</span></div>
    <div><span style="font-weight:900;margin-right:12px">Hi, ${esc(session.name)}! 👋</span><button class="btn sm" onclick="logout()">Log out</button></div>
  </div>
  ${searchBox("Got an interview? Paste the job link or company name...")}
  ${searchQ?'':`<div class="card" style="background:var(--yellow)">
    <div class="range-btns">
      <button class="btn sm ${range.mode==='today'?'red':''}" onclick="setRange('today')">Today</button>
      <button class="btn sm ${range.mode==='week'?'red':''}" onclick="setRange('week')">Last 7 days</button>
      <button class="btn sm ${range.mode==='month'?'red':''}" onclick="setRange('month')">Last 30 days</button>
      <button class="btn sm ${range.mode==='all'?'red':''}" onclick="setRange('all')">All time</button>
      <div style="display:flex;gap:8px;align-items:end;margin-left:8px">
        <div><label>From</label><input id="r-start" type="date" value="${range.mode==='custom'?range.start:''}" style="padding:6px"></div>
        <div><label>To</label><input id="r-end" type="date" value="${range.mode==='custom'?range.end:''}" style="padding:6px"></div>
        <button class="btn sm blue" onclick="setCustom()">Go</button>
      </div>
    </div>
  </div>`}
  <h2 style="margin-bottom:14px">${searchQ?`Search results · <span style="color:var(--red)">${mine.length} match${mine.length===1?'':'es'}</span>`:`Your battle stats · <span style="color:var(--red)">${rangeLbl}</span>`}</h2>
  <div class="row c4" style="margin-bottom:24px">
    <div class="stat red"><div class="n">${apps.length}</div><div class="l">Applications</div></div>
    <div class="stat blue"><div class="n">${reach.length}</div><div class="l">Recruiter reach-outs</div></div>
    <div class="stat green"><div class="n">${replies.length}</div><div class="l">Recruiter replies</div></div>
    <div class="stat pink"><div class="n">${days.length}</div><div class="l">Active days</div></div>
  </div>
  ${searchQ?'':perfChartClient(mine)}
  <div class="card">
    <h3 style="margin-bottom:10px">💬 Message the team</h3>
    <p class="muted" style="margin-bottom:12px">Questions, target companies, roles to skip, anything.</p>
    ${msgThread(session.code,true)}
  </div>
  ${dayBlocks||`<div class="card center"><h3>Nothing in this range yet</h3></div>`}`;
}

(async function(){
  $('#app').innerHTML='<div class="center" style="padding-top:20vh"><h2>Loading…</h2></div>';
  const saved=sessionStorage.getItem('ad-code');
  if(saved){
    try{
      const res=await rpc('fn_login',{p_code:saved});
      if(res.ok){session={code:saved,role:res.role,name:res.name};await refresh();rerender();return;}
    }catch(e){}
  }
(async function boot(){
  // Handle Supabase invite / password-reset links (they arrive with tokens in the URL hash)
  const hash = window.location.hash || '';
  const isInvite = hash.includes('type=invite') || hash.includes('type=signup');
  const isRecovery = hash.includes('type=recovery');
  if (isInvite || isRecovery) {
    try {
      // Supabase JS reads the hash automatically on load. Give it a moment.
      await new Promise(r => setTimeout(r, 400));
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        renderSetPassword(isInvite ? 'Welcome to ApplyDesk! Choose a password to finish setting up your account.' : 'Choose your new password.');
        return;
      }
    } catch(e){}
  }
  renderLogin();
})();

function renderSetPassword(intro){
  $('#app').innerHTML = `
  <div style="max-width:480px;margin:8vh auto 0">
    <div class="logo" style="margin-bottom:18px"><span class="mark">A</span>ApplyDesk</div>
    <div class="card">
      <h2 style="margin-bottom:8px">Set your password</h2>
      <p class="muted" style="margin-bottom:18px">${esc(intro)}</p>
      <div class="field"><label>New password</label>
        <input id="sp-pass" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>
      <div class="field"><label>Confirm password</label>
        <input id="sp-conf" type="password" placeholder="Type it again" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')doSetPassword()"></div>
      <button class="btn blue" style="width:100%" onclick="doSetPassword()">Save password and continue →</button>
      <p id="sp-err" style="color:var(--red);font-size:12px;margin-top:10px;min-height:1em"></p>
    </div>
  </div>`;
  setTimeout(()=>{const el=document.getElementById('sp-pass'); if(el) el.focus();}, 100);
}

window.doSetPassword = async function(){
  const pass = document.getElementById('sp-pass').value;
  const conf = document.getElementById('sp-conf').value;
  const err = document.getElementById('sp-err');
  if (!pass || pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
  if (pass !== conf) { err.textContent = 'Passwords do not match.'; return; }
  err.textContent = '';
  document.getElementById('busy').style.display='block';
  try {
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error) { err.textContent = error.message || 'Could not save password.'; return; }
    // Clear the URL hash so refresh doesn\'t reopen the reset flow
    history.replaceState(null, '', window.location.pathname);
    // We're already signed in via the invite token; refresh to normal app state
    const who = await sb.auth.getUser();
    if (who && who.data && who.data.user) {
      const wr = await rpcRaw('fn_whoami', {}, (await sb.auth.getSession()).data.session.access_token);
      if (wr && wr.ok) {
        authMode = 'supabase';
        session = { code: wr.role_code || '', role: wr.role, name: wr.name, email: who.data.user.email };
        await refresh();
        rerender();
        return;
      }
    }
    // Fallback: send them to normal login
    alert('Password saved. Please log in.');
    renderLogin();
  } catch(e) {
    err.textContent = 'Could not save password. Try again.';
  } finally {
    document.getElementById('busy').style.display='none';
  }
}
})();
</script>
