<!-- Composite of employer-custom screening seen on Taleo TEE (Dah Sing / Phoenix) and
     SmartRecruiters screening-question types: required unknown questions must tank overall. -->
<!DOCTYPE html>
<html lang="en"><head><title>Custom screening</title></head>
<body>
<form>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field">
    <label for="hkid">Hong Kong Identity Card number *</label>
    <input id="hkid" name="hkid" type="text" required>
  </div>
  <div class="field">
    <label for="salary">Expected salary (HKD) *</label>
    <input id="salary" name="salary" type="text" required>
  </div>
  <div class="field">
    <label for="lang">Languages spoken *</label>
    <input id="lang" name="languages" type="text" required>
  </div>
</form>
</body></html>
